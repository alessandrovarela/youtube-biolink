# ============================================================
# EPIC 3 — Links & Página Pública
# Execution Plan — Wave-Based Development
#
# Template: epic-orchestration.yaml
# Generated by: @pm (Morgan)
# Source: docs/prd.md § 6 — Epic 3 (linhas 515-606)
# ============================================================

execution:
  epicId: EPIC-3
  epicTitle: "Links & Página Pública"
  epicGoal: >-
    Entregar o core do produto (vertical slice ponta a ponta): usuário autenticado
    gerencia seus links no dashboard (criar, editar, deletar, reordenar por
    drag-and-drop, ativar/desativar) e a página pública `/@username` renderiza via
    SSR (RSC) os links ativos na ordem definida. Sanitização de URLs (bloqueia
    schemes perigosos) e tratamento de 404 fazem parte da entrega. Ao final do
    Epic 3 o produto é PUBLICÁVEL E FUNCIONAL — mesmo sem design system formal
    (Epic 4) e sem analytics (Epic 5).

  storyBasePath: "docs/stories"
  template: "epic-orchestration"
  mode: interactive  # override via --mode=yolo at runtime

  # ──────────────────────────────────────────────────────────
  # DECISÕES DE ESCOPO (reconciliação pré-execução)
  # ──────────────────────────────────────────────────────────
  # Já reconciliadas no PRD v1.1 (§7 Top Issues) — registradas aqui p/ execução:
  #
  # 1. RLS/policies em `links` → DEFERIDO para Epic 6 (Story 6.2).
  #    No MVP a autorização é APPLICATION-LAYER: Server Actions filtram por
  #    `profile_id = auth.uid()`; a leitura pública filtra `is_active = true`
  #    no próprio query. Consistente com a decisão de authz do Epic 2 (sem RLS).
  #    (PRD Story 3.1 AC3.)
  #
  # 2. Roteamento da página pública → `app/[username]` + RESERVED LIST.
  #    Decisão H1 já RESOLVIDA na arquitetura v0.3: sem middleware rewrite no MVP.
  #    Story 3.6 documenta a decisão (docs/architecture/routing.md); o middleware
  #    edge (rewrite opcional) fica no Epic 6 (Story 6.5).
  #
  # 3. OG image na página pública → PLACEHOLDER no MVP (definitivo em Phase 2).
  #    (PRD Story 3.5 AC6.)
  #
  # 4. Smoke test consolidado ponta a ponta → vive na Story 5.6 (Epic 5);
  #    no Epic 3 cada story valida seu fluxo + validação manual no PR da 3.5.
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # OWNER PREREQUISITES
  # ──────────────────────────────────────────────────────────
  # NENHUM. Diferente do Epic 2, o Epic 3 não exige configuração manual no
  # painel Supabase (sem auth/e-mail/templates). Migrations são versionáveis
  # e aplicadas via `supabase db push`.
  owner_prerequisites: []

  # ──────────────────────────────────────────────────────────
  # PRÉ-REQUISITOS TÉCNICOS (bloqueiam a Wave 1 — fazer ANTES)
  # ──────────────────────────────────────────────────────────
  technical_prerequisites:
    - id: "PRE-1"
      task: >-
        ER diagram consolidado (profiles + links) em docs/architecture/ER.md.
        Origem: PRD §7 M3 — @data-engineer deve produzir o modelo ER consolidado
        antes do Epic 3 como input para a Story 3.1.
      owner: "@data-engineer"
      blocks: ["3.1"]
    - id: "PRE-2"
      task: >-
        Instalar `@dnd-kit/core` + `@dnd-kit/sortable` + `@dnd-kit/utilities`
        (drag-and-drop acessível — Story 3.4). Hoje ausentes do package.json.
        Instalação feita pelo @dev dentro da story 3.4 (não é passo separado),
        listado aqui apenas para visibilidade de novas dependências.
        NOTA: `zod` NÃO é instalado — a arquitetura (§ 2.5, § 3.1) decidiu
        validação inline TS + helpers puros (zero dependência). A Story 3.3 usa
        checks inline + `sanitizeLinkUrl`, reconciliando o PRD (que citava zod).
      owner: "@dev"
      blocks: ["3.4"]

  # ──────────────────────────────────────────────────────────
  # STORIES
  # ──────────────────────────────────────────────────────────
  stories:
    - id: "3.1"
      file: "3.1.story.md"
      title: "Schema `links`"
      status: pending
      branch: "feature/3.1-links-schema"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Migration cria tabela `links` (profile_id FK cascade, title check 1-60,
        url, position, is_active, timestamps) + índice (profile_id, position) +
        trigger updated_at. SEM RLS (deferido p/ 6.2). DDL revisada por
        @data-engineer (autoridade de schema). Aplica em development via db push.
        Teste de integração valida isolamento app-layer (user A não altera link
        de user B) e leitura pública só de is_active=true. Requer PRE-1 (ER).

    - id: "3.2"
      file: "3.2.story.md"
      title: "Helper de sanitização de URL"
      status: pending
      branch: "feature/3.2-url-sanitizer"
      complexity: 2
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Helper PURO lib/validation/url.ts → sanitizeLinkUrl(): Result<string,UrlError>.
        Aceita só http/https; rejeita javascript:/data:/vbscript:/file:/sem-scheme/
        vazias/malformadas (incl. obfuscation JaVaScRiPt:, espaços/tabs). ≥15 asserts.
        Sem acesso a DB — independente, roda em paralelo com 3.1 e 3.6.

    - id: "3.6"
      file: "3.6.story.md"
      title: "Tratamento de `@` e reserved routes (decisão de roteamento)"
      status: pending
      branch: "feature/3.6-public-routing"
      complexity: 2
      executor: "@architect"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Formaliza a decisão de roteamento (H1 já resolvida na arquitetura v0.3:
        `app/[username]` + reserved list, SEM middleware rewrite no MVP) em
        docs/architecture/routing.md. Garante que reservados (Story 2.3) não
        viram username e que /login, /dashboard, /signup não conflitam com a rota
        pública. Fundação de decisão que destrava a estrutura de rota da 3.5.

    - id: "3.3"
      file: "3.3.story.md"
      title: "CRUD de links no dashboard"
      status: pending
      branch: "feature/3.3-links-crud"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["3.1", "3.2"]
      notes: >-
        Página /dashboard/links lista por position; form inline de criação;
        edição inline + toggle is_active + delete (confirmação). Server Actions
        createLink/updateLink/deleteLink/toggleLinkActive validadas com checks TS
        INLINE + sanitizeLinkUrl (3.2) — SEM zod (reconciliação c/ arquitetura
        § 2.5/§ 3.1). Limite 30 links/usuário (erro no 31º). Optimistic
        updates onde seguro. Testes unitários (mock Supabase) + integração.
        Story de maior complexidade do epic.

    - id: "3.5"
      file: "3.5.story.md"
      title: "Página pública `/@username` via SSR"
      status: pending
      branch: "feature/3.5-public-page"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["3.1", "3.6"]
      notes: >-
        app/[username]/page.tsx via RSC. Query profile por username
        (case-insensitive) + links ativos por position. Render avatar(fallback)/
        display_name/bio/links. Links em nova aba rel="noopener noreferrer".
        404 via notFound() + not-found.tsx custom. Meta tags (title/description/
        OG placeholder). revalidate=60. NÃO code-depende de 3.3 (seed manual p/
        smoke), mas o teste ponta a ponta usa links criados pela 3.3.

    - id: "3.4"
      file: "3.4.story.md"
      title: "Reordenação de links via drag-and-drop"
      status: pending
      branch: "feature/3.4-links-reorder"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["3.3"]
      notes: >-
        Estende a lista da 3.3 com handle de drag (@dnd-kit — PRE-2). Drop
        reordena optimistic; Server Action reorderLinks persiste position em lote.
        Alternativa keyboard-accessible (botões ↑/↓ com aria-labels + focus).
        Teste de integração com 20+ links; latência <200ms. Área de maior atenção
        do epic (acessibilidade do drag-and-drop).

  # ──────────────────────────────────────────────────────────
  # WAVES
  # ──────────────────────────────────────────────────────────
  #
  # Estrutura de dependências:
  #   Wave 1: [3.1, 3.2, 3.6]  — fundação: schema, helper de URL e decisão de rota
  #                              (todas independentes → paralelas)
  #   Wave 2: [3.3, 3.5]       — CRUD dashboard e página pública SSR
  #                              (3.3 usa 3.1+3.2; 3.5 usa 3.1+3.6 → paralelas)
  #   Wave 3: [3.4]            — reordenação drag-and-drop (estende 3.3)
  # ──────────────────────────────────────────────────────────

  waves:
    - number: 1
      name: "Fundação"
      description: "Schema `links`, helper de sanitização de URL e decisão de roteamento — base do domínio de links e da página pública"
      stories: ["3.1", "3.2", "3.6"]
      parallel: true
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que a migration de `links` aplicou em development com índice
        (profile_id, position) e trigger updated_at, sem RLS (deferido p/ 6.2), e
        que o isolamento app-layer funciona (user A não altera link de user B).
        Confirmar (com @data-engineer) que a DDL bate com o ER consolidado (PRE-1).
        Validar que sanitizeLinkUrl cobre todos os schemes perigosos + obfuscation
        (≥15 asserts) e que routing.md documenta `app/[username]` + reserved list
        sem conflito com rotas internas.
      merge_order: ["3.1", "3.2", "3.6"]
      tag: "epic-3-wave-1-foundation"

    - number: 2
      name: "CRUD & Página Pública"
      description: "Dashboard de gestão de links (CRUD + toggle) e página pública SSR `/@username` — requer Wave 1"
      stories: ["3.3", "3.5"]
      parallel: true
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que o CRUD do dashboard cria/edita/deleta/toggle com Server
        Actions validadas por checks TS inline + sanitizeLinkUrl, respeitando o limite de 30
        links e o isolamento por auth.uid(). Verificar que /@username renderiza
        via SSR os links ativos na ordem, abre em nova aba com rel correto,
        retorna 404 custom para username inexistente e serve com revalidate=60.
        Confirmar que URLs perigosas nunca chegam ao DB nem à página.
      merge_order: ["3.3", "3.5"]
      tag: "epic-3-wave-2-crud-public"

    - number: 3
      name: "Reordenação"
      description: "Drag-and-drop acessível para reordenar links + persistência em lote — requer Wave 2 (estende a lista da 3.3)"
      stories: ["3.4"]
      parallel: false
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que o drag-and-drop (@dnd-kit) reordena optimistic e persiste
        via reorderLinks (update em lote de position), que a alternativa por
        teclado (↑/↓) tem aria-labels e foco corretos, que a reordenação persiste
        com 20+ links e que a ordem reflete imediatamente na página pública 3.5.
      merge_order: ["3.4"]
      tag: "epic-3-wave-3-reorder"

  # ──────────────────────────────────────────────────────────
  # FINAL GATE
  # ──────────────────────────────────────────────────────────
  final_gate:
    agent: "@architect"
    focus: >-
      Sign-off final do Epic 3 — Links & Página Pública. Produto PUBLICÁVEL.
      Verificar:
      1. Fluxo ponta a ponta: login → cria links → edita/toggle → reordena (drag
         e teclado) → página pública /@username exibe ativos na ordem definida
      2. Username inexistente → 404 custom (not-found.tsx)
      3. Sanitização: nenhum scheme perigoso (javascript:/data:/etc.) chega ao DB
         nem à renderização; links abrem em nova aba com rel="noopener noreferrer"
      4. Authz app-layer: usuário não altera/deleta links de outro (filtro
         auth.uid()); leitura pública só de is_active=true
      5. Limite de 30 links respeitado; página pública com revalidate=60
      6. CI verde em main; pnpm lint + test + build passando
      7. Conventional commits em todos os PRs do epic
    tag: "epic-3-complete"

  # ──────────────────────────────────────────────────────────
  # RETROSPECTIVE
  # ──────────────────────────────────────────────────────────
  retrospective:
    enabled: true
    agent: "@sm"
    focus: >-
      O que funcionou bem no Epic 3 (primeiro vertical slice completo)? O que
      melhorar nos próximos epics? Registrar em docs/retrospectives/epic-3.md.

