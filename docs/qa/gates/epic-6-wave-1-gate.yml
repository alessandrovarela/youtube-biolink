    handle_new_user_owner: postgres      # ✅ idêntico a development
    handle_new_user_prosecdef: true      # ✅ SECURITY DEFINER
    postgres_rolbypassrls: true          # ✅ o trigger insere fora do contexto de RLS
    current_rowsecurity: "profiles=false, links=false, link_clicks=false"  # estado pré-merge esperado
    current_policies: 0
    migrations_applied: 5                # as 2 novas aplicarão limpo, em ordem
    verdict: "PASS — AC5 confirmada TAMBÉM em produção. O merge é seguro para o CD aplicar."

