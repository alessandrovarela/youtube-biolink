# ── AC12/AC13: testes e build ───────────────────────────────
tests_and_build:
  middleware_test_quality:
    file: "tests/unit/middleware.test.ts — 9 testes"
    covers: "redirect sem usuário; ?next= preservado; passa com usuário; usa getUser() e não getSession(); matcher cobre /dashboard/*; NÃO cobre /[username], /_next, assets, /auth/callback, /login, /signup, /health, /; guarda contra matcher catch-all com negative lookahead."
    verdict: PASS_WITH_CAVEAT
    caveat: >-
      O teste do matcher REIMPLEMENTA o algoritmo de matching do Next
      (`matcherToRegExp`) — valida a cópia, não o roteador real. O próprio arquivo admite
      isso em comentário e aponta para a verificação por curl, que é a prova de verdade. É
      a mesma troca que aprovei na Wave 3 para a janela deslizante, mas aqui ela é MAIS
      frágil, porque a semântica de matcher do Next pode mudar entre versões sem que o
      teste perceba. Aceito porque este gate executou a verificação de runtime real (10
      paths + 10 variantes de bypass) e ela CONFIRMA o contrato.
    regression_lock_quality: >-
      O teste "não usa matcher catch-all com negative lookahead" é a melhor trava do
      arquivo: assere que todo pattern começa com /dashboard e não contém '(?!'. Se alguém
      colar o matcher da doc do Next, quebra. Trava certa para o risco certo (R1).
  gates_run_by_this_gate:
    typecheck: "PASS — exit 0, tsc --noEmit, sem saída"
    lint: "PASS — exit 0, eslint, sem saída"
    test: "PASS — 42 arquivos passed | 1 skipped (43); 317 testes passed | 1 skipped (318); 32.87s"
    build: "PASS — exit 0, com o warning de deprecação do middleware"
    dev: "PASS — `✓ Ready in 143ms`; /dashboard responde 307 → /login; CSP de dev traz unsafe-eval, ws: e localhost:*"
    baseline_claimed_by_dev: 317
    reconciliation: "BATE EXATAMENTE. 317 passed + 1 skipped, reproduzido do zero por este gate."
    progression: "192 (Epic 5) → 219 (W1) → 233 (W2) → 287/296 (W3) → 317 (W4)"
    delta_from_wave_3: "+21 sobre os 296 da suíte completa da Wave 3 (que já incluía os 9 do middleware): +21 de rate-limit-app-path e das travas da correção da issue #1."

