# ── Issues / concerns ───────────────────────────────────────
concerns:
  - id: 1
    severity: medium
    category: security
    story: "6.4 / 6.5 (transversal)"
    status: open
    title: "O fail-fast do pepper NÃO lança no boot como documenta — ele converte um deploy mal provisionado em queda TOTAL de auth com todos os health checks verdes"
    description: >-
      lib/rate-limit.ts L78-83 e L121-124 afirmam que sem RATE_LIMIT_PEPPER em produção o
      app "não sobe" e "quebra ruidosamente no boot". Testei e a afirmação é FALSA: o
      build passa (exit 0), o servidor sobe, e /, /login, /signup, /health e /[username]
      respondem 200 sem nenhum erro no log. O throw só dispara na primeira invocação real
      de uma Server Action que importe o módulo — porque o Next carrega esses módulos sob
      demanda.
    proof: >-
      PROBE DESTE GATE, com RATE_LIMIT_PEPPER removido de .env.local e NODE_ENV=production:
      `pnpm build` → EXIT 0. `pnpm start` → sobe limpo. GET /, /login, /signup, /health,
      /alessandrovarela → 307/200/200/200/200, ZERO ocorrências do erro no log. Em seguida
      invoquei a Server Action de login DE VERDADE (header `Next-Action` com o id extraído
      do HTML renderizado) → HTTP 500, e só então o log registrou
      "⨯ Error: [rate-limit] RATE_LIMIT_PEPPER é OBRIGATÓRIO em produção…".
    impact: >-
      Um deploy sem o env fica com TODOS OS SINAIS VERDES — build, deploy, homepage,
      página pública e /health — enquanto login, signup, reset de senha e tracking de
      cliques devolvem 500. Monitoração de disponibilidade de página não detecta. O blast
      radius é a superfície de auth inteira (lib/actions/auth.ts) mais o tracking
      (lib/actions/track-click.ts). Comparado ao problema que resolve — lockout de IPs
      escolhidos por um atacante — o modo de falha na má configuração é PIOR: total, e sem
      precisar de atacante.
    why_not_blocking: >-
      (1) Só se materializa se o env faltar, e isso já é precondição BLOQUEANTE de merge
      desde o gate da Wave 3 (issue #2), reafirmada abaixo. (2) `.env.local` agora define
      o pepper, então development não está mais degradado. (3) A mensagem de erro é
      excelente e o diagnóstico é imediato para quem olhar o log. (4) O princípio —
      falhar alto num controle de segurança em vez de degradar em silêncio — está CERTO e
      eu o endosso; o defeito é de POSICIONAMENTO e de DOCUMENTAÇÃO, não de intenção.
    recommendation: >-
      @dev — duas ações, ambas baratas. (a) MOVER a validação para o build: um check em
      next.config.ts (ou preflight no CI) que faça `next build` FALHAR quando
      NODE_ENV=production e RATE_LIMIT_PEPPER estiver ausente. Isso impede o deploy ruim de
      embarcar e transforma o throw em runtime num backstop redundante que nunca dispara —
      estritamente melhor que o estado atual. (b) CORRIGIR o comentário de lib/rate-limit.ts:
      trocar "o app não sobe / quebra no boot" por "a primeira invocação de qualquer Server
      Action de auth ou tracking falha com 500". Num arquivo cujo propósito é didático, um
      comentário que descreve comportamento inexistente ensina a coisa errada.

  - id: 2
    severity: medium
    category: docs
    story: "6.5"
    status: open
    title: "A justificativa registrada para `script-src 'unsafe-inline'` é factualmente incorreta em dois pontos"
    description: >-
      A Completion Note 2 da story e o comentário de next.config.ts L13-20 justificam a
      ausência de nonce com dois argumentos que não se sustentam: (a) que 'unsafe-inline'
      "o App Router exigiria de qualquer forma", e (b) que um nonce quebraria o cache ISR
      da página pública. O primeiro é falso — o Next suporta CSP com nonce via middleware
      como padrão de primeira classe, propagando o nonce aos próprios scripts inline do
      RSC. O segundo defende um cache que NÃO EXISTE: este gate provou que `/[username]`
      responde `no-store` e builda como `ƒ`, e `/dashboard/*` já é dinâmico e já passa pelo
      middleware. As duas superfícies que um nonce afetaria já são dinâmicas hoje.
    impact: >-
      NENHUM em runtime — a policy entregue é a mesma e não é uma regressão (o baseline
      era ausência total de CSP; `object-src 'none'`, `base-uri 'self'`, `form-action
      'self'` e `frame-ancestors 'none'` são ganhos reais que não dependem de
      'unsafe-inline'). O impacto é DIDÁTICO e de manutenção: a decisão é apresentada como
      impossibilidade técnica quando é, na verdade, uma escolha legítima de simplicidade.
      Quem reler isso no futuro concluirá que nonce é inviável neste projeto — e não é.
    recommendation: >-
      @dev / @architect — reescrever a justificativa com o enquadramento honesto: "optamos
      por uma única fonte estática de headers, simples de manter e sem duas CSPs
      divergentes; o preço é um script-src que não mitiga XSS". E registrar como débito
      explícito que, se/quando `/[username]` for de fato colocada em ISR (issue #3), a
      opção nonce-via-middleware para `/dashboard/*` volta à mesa sem custo de cache
      nenhum. NÃO peço mudança de código nesta story.

  - id: 3
    severity: medium
    category: performance
    story: "PROJETO (pré-existente — NÃO da 6.5)"
    status: open
    title: "`/[username]` declara `revalidate = 60` mas responde `no-store` — o ISR do NFR1 nunca existiu"
    description: >-
      app/[username]/page.tsx L12 declara `export const revalidate = 60`, mas a rota builda
      como `ƒ` (Dynamic) e responde
      `Cache-Control: private, no-cache, no-store, max-age=0, must-revalidate`. Nenhuma
      resposta da página pública é cacheada: cada visita paga render completo mais
      round-trip ao Supabase. O achado é do @dev e foi CONFIRMADO independentemente por
      este gate.
    proof: >-
      A/B DESTE GATE: movi FISICAMENTE middleware.ts e next.config.ts para fora do projeto
      e rebuildei do zero. Resultado idêntico ao da branch completa — `ƒ /[username]` nos
      DOIS cenários. Corroborado por: app/[username]/ não aparece em `git diff main...HEAD`;
      createPublicClient() não lê cookies; nenhum componente da árvore importa next/headers.
      A causa NÃO é a Story 6.5 e NÃO é opt-out dinâmico por cookies/headers.
    impact: >-
      Gap de NFR1 (cache agressivo em páginas públicas). Custo de compute e de latência em
      toda visita anônima, e pressão desnecessária sobre o free tier do Supabase — a mesma
      preocupação de NFR8 que motivou parte do Epic 6. Nenhum impacto de segurança.
    scope_ruling: >-
      DÉBITO DE PROJETO, NÃO DESTA STORY. A Story 6.5 não causou nem agravou: o AC5 pede
      que o comportamento de cache permaneça INALTERADO pela story, e ele permaneceu. Seria
      errado penalizar a 6.5 por um defeito que ela apenas tornou visível.
    recommendation: >-
      @architect — investigar a causa-raiz e decidir. Candidato mais provável: segmento
      dinâmico sem `generateStaticParams` combinado ao comportamento de fetch não cacheado
      do supabase-js sob Next 16/Turbopack. NÃO especulei além disso e recomendo que quem
      corrigir também não o faça. Tem interseção direta com o concern #2 da Wave 1
      ("verificação pós-deploy de ISR em produção"), aberto desde então — este achado
      provavelmente EXPLICA por que aquela verificação nunca fechou. Consolidar os dois.

  - id: 4
    severity: low
    category: code
    story: "6.5"
    status: open
    title: "O `?next=` que o middleware constrói é um parâmetro MORTO — ninguém o consome"
    description: >-
      middleware.ts L63-64 monta `?next=<pathname>` com o comentário "Preserva o destino
      para o pós-login". Nenhum código do projeto lê esse parâmetro: app/login/page.tsx só
      tipa e lê `confirmed` e `reset`, e `signIn` (lib/actions/auth.ts L100) redireciona
      incondicionalmente para '/dashboard'. O único lugar que lê um `next` é
      app/auth/callback/route.ts, que é outro fluxo e não recebe este parâmetro.
    proof: >-
      Grep deste gate por consumo de 'next' em app/, lib/ e components/: a única ocorrência
      é app/auth/callback/route.ts L11. app/login/page.tsx L6 declara
      `searchParams: Promise<{ confirmed?: string; reset?: string }>` — sem `next`.
    impact: >-
      NENHUM em segurança — e verifiquei especificamente por open redirect: o valor vem de
      `request.nextUrl.pathname`, que sob o matcher `/dashboard/:path*` sempre começa com
      /dashboard, então não há como induzir destino externo. É defeito de PRECISÃO DA
      AFIRMAÇÃO: o comentário promete um comportamento de produto que não existe. Nota
      atenuante: o guard de layout (Story 2.9) JÁ fazia o mesmo, então o middleware está
      espelhando fielmente o padrão pré-existente — a inconsistência é herdada, não
      inventada aqui.
    recommendation: >-
      @dev / @po — escolher uma das duas e não deixar no meio: (a) IMPLEMENTAR o
      pós-login, fazendo signIn ler `next` e redirecionar para lá, validando que começa com
      '/' e não com '//' (o mesmo cuidado que app/auth/callback/route.ts L12 já aplica
      corretamente); ou (b) remover o parâmetro das duas camadas e ajustar os comentários.
      A opção (a) é a que cumpre a intenção evidente. Baixa prioridade.

  - id: 5
    severity: low
    category: code
    story: "6.5"
    status: open
    title: "Next 16.2.6 deprecia o convention `middleware.ts` em favor de `proxy.ts`"
    description: >-
      O build emite `⚠ The "middleware" file convention is deprecated. Please use "proxy"
      instead.` Reproduzido por este gate, e confirmado como originado do arquivo: o
      warning DESAPARECE no A/B em que middleware.ts foi removido. O build output já nomeia
      a saída como `ƒ Proxy (Middleware)`.
    impact: >-
      NENHUM hoje: é warning e não erro, o build passa (exit 0) e o middleware funciona
      integralmente — todos os 307/200 deste gate foram obtidos com ele ativo. O risco é
      futuro e tem uma propriedade desagradável: numa major seguinte, o convention deixa de
      ser reconhecido e o middleware simplesmente PARA DE RODAR, sem quebrar build, sem
      quebrar typecheck e sem quebrar os 9 testes unitários (que importam '@/middleware'
      diretamente, não o roteador). O guard edge sumiria em silêncio.
    mitigating_factor: >-
      É exatamente o cenário para o qual o AC3 existe: o guard de layout continuaria
      barrando o acesso. A perda seria de otimização (render evitado) e do refresh
      proativo, não de controle de acesso. Isso VALIDA a decisão de defense-in-depth da
      story de um jeito que nem a story previu.
    recommendation: >-
      @sm / @dev — follow-up de baixa prioridade, FORA desta story e FORA desta wave.
      Renomear convention de framework merece story própria, porque arrasta
      docs/architecture/routing.md §6, os imports de tests/unit/middleware.test.ts e a
      redação das Dev Notes. Não fazer no fim de um epic.

  - id: 6
    severity: low
    category: security
    story: "PROJETO (pré-existente, Story 2.5 — NÃO da 6.5)"
    status: open
    title: "`/auth/callback` valida `next` contra `//` mas não contra `/\\` — backslash normaliza para protocol-relative"
    description: >-
      app/auth/callback/route.ts L12 faz
      `next.startsWith('/') && !next.startsWith('//')` para evitar open-redirect. Um valor
      como `/\evil.com` passa nos dois testes (começa com '/', não começa com '//'), mas o
      construtor de URL normaliza a barra invertida: `new URL('http://host' + '/\\evil.com')`
      resolve para `http://host//evil.com`, que os browsers tratam como protocol-relative.
    proof: >-
      PROBE DESTE GATE: `node -pe "new URL('http://localhost:3000' + '/\\\\evil.com').href"`
      → `http://localhost:3000//evil.com`. O ramo vulnerável NÃO foi alcançável nas minhas
      probes por curl porque exige um `code` VÁLIDO — com code inválido as 4 variantes
      testadas caíram todas em /auth/confirm-failed, como esperado.
    impact: >-
      BAIXO e condicionado. Exige que o atacante induza a vítima a abrir um link contendo
      um `code` válido (o do próprio atacante) mais o `next` malicioso — o que logaria a
      vítima na conta do atacante e depois a mandaria para fora. Vetor estreito e ruidoso.
    scope_ruling: >-
      PRÉ-EXISTENTE e FORA DO ESCOPO DA 6.5 — app/auth/callback/route.ts não aparece em
      `git diff main...HEAD`. Registro aqui porque o Epic 6 é o epic de Segurança e
      Hardening e porque toquei nessa superfície ao verificar que o fluxo de auth seguia
      intacto (AC11). Seria omissão não reportar.
    recommendation: >-
      @dev — endurecer a validação com uma linha:
      `next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\')`, ou
      preferencialmente resolver com `new URL(next, origin)` e comparar `.origin` com o
      origin esperado, que é imune a essa classe inteira de truque de normalização.

  - id: 7
    severity: low
    category: tests
    story: "6.5"
    status: accepted
    title: "O teste de matcher reimplementa o algoritmo de matching do Next"
    description: >-
      tests/unit/middleware.test.ts L30-35 converte o padrão `/dashboard/:path*` num regex
      próprio para decidir o que o Next interceptaria. Valida a CÓPIA, não o roteador. O
      próprio arquivo admite isso em comentário e aponta para a verificação por curl.
    impact: >-
      Baixo, mas real: a semântica de matcher do Next pode mudar entre versões — e a
      deprecação da issue #5 mostra que ESTÁ mudando — sem que o teste perceba. É a mesma
      troca que aprovei na Wave 3 para a janela deslizante, porém mais frágil, porque lá o
      alvo era código do projeto e aqui é comportamento de framework.
    recommendation: >-
      Aceito. Este gate executou a verificação de runtime real (10 paths + 10 variantes de
      bypass contra o build de produção) e ela CONFIRMA o contrato do teste. A trava contra
      matcher catch-all continua valiosa mesmo sendo aproximada. Se a wave 5 tocar no
      middleware, considerar um teste de integração que suba o servidor.

  - id: 8
    severity: low
    category: tests
    story: "6.5"
    status: accepted
    title: "Jornada pela UI real não executada (débito recorrente)"
    description: >-
      Não abri navegador para preencher o formulário de login, arrastar um link, trocar o
      período do gráfico e clicar em logout. Mesmo débito dos concerns #7 (Wave 3) e #6
      (Wave 2).
    mitigating_coverage: >-
      Este gate reduziu MUITO o débito em relação às waves anteriores: login real via
      GoTrue, sessão válida servindo as 3 rotas do dashboard, refresh com token expirado,
      3 temas renderizados e a Server Action de login INVOCADA de verdade. O que falta é
      especificamente interação de browser.
    recommendation: "Consolidar com a verificação pós-deploy pendente e com a validação de console do AC7 — uma sessão única de ~10 minutos fecha os três."

