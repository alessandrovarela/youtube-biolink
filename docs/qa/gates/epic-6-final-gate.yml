        Epic 5 está VIVO em prod neste momento.
      link_clicks_select_anon: "HTTP 200 — anon lê a tabela de cliques hoje."
      record_link_click: "HTTP 404 — não existe."
      check_app_rate_limit: "HTTP 404 — não existe."
      volume: "link_clicks = 0 linhas. profiles = 1 linha."
    dependency_chain_analysis: >-
      Simulação da aplicação sequencial das 5 migrations num banco limpo de
      Epic 6:
      1. 170252_profiles_rls — autocontida. Depende só de public.profiles
         (Epic 2). O INSERT continua funcionando porque o único caminho é o
         trigger handle_new_user (SECURITY DEFINER, owner postgres, BYPASSRLS).
      2. 171040_links_rls — autocontida. Depende de public.links (Epic 3).
      3. 180000_link_clicks_rls — depende da VIEW link_click_daily existir
         (criada em 20260702120000, Epic 5, JÁ EM PRODUÇÃO — verificado). O
         `alter view ... set (security_invoker = on)` falharia se a view não
         existisse. Dependência SATISFEITA.
      4. 190000_rate_limit — cria rate_limit_counters e check_rate_limit, e
         substitui record_link_click (criada em 180000, MESMA assinatura →
         `create or replace` troca o corpo, não cria sobrecarga). Ordem
         lexicográfica dos timestamps garante 180000 antes de 190000. OK.
      5. 200000_rate_limit_hardening — substitui check_rate_limit e REVOGA seu
         EXECUTE de anon/authenticated. ⚠️ Ponto que exigia verificação:
         record_link_click (de 190000) CHAMA check_rate_limit internamente.
         Como record_link_click é SECURITY DEFINER com owner postgres, ela roda
         com os privilégios do owner e o revoke não a afeta.
         NÃO ACEITEI ISSO POR RACIOCÍNIO: reproduzi em dev, onde as 5
         migrations já estão aplicadas — as 66 chamadas a record_link_click
         funcionaram (60 gravaram, 6 barradas pelo teto). A cadeia interna
         está PROVADA no estado final.
      Nenhuma migration depende de estado criado por outra fora desta ordem.
      Nenhuma é destrutiva. Nenhuma faz backfill nem altera dado existente.
    real_data_risk: >-
      NEGLIGENCIÁVEL, e isso é MEDIDO, não presumido: produção tem 1 profile e
      ZERO link_clicks. Não há volume para degradar plano de query, não há
      linha que possa violar uma policy nova, não há backfill. O cenário de
      "migration que quebra com dados reais" não se materializa aqui.
    production_downtime_window: >-
      NÃO HÁ janela de indisponibilidade. Há uma janela de DEGRADAÇÃO PARCIAL,
      e ela existe nas duas ordens possíveis (o CD do Supabase e o deploy da
      Vercel são processos independentes e não ordenados entre si):
      · migrations ANTES do deploy → o código ANTIGO faz INSERT direto em
        link_clicks e passa a receber 42501. Como o tracking é fire-and-forget
        e nunca lança, o efeito é PERDA SILENCIOSA DE CLIQUES na janela.
        Navegação, página pública, login e dashboard: intactos.
      · deploy ANTES das migrations → o código NOVO chama record_link_click
