# ── JULGAMENTO: a decisão de escopo dos headers ─────────────
judgment_header_placement:
  decision_by_dev: "4 headers em next.config.ts headers() com source '/:path*'; middleware só com auth/sessão."
  qa_verdict: CORRETA — E É A ÚNICA ESCOLHA DEFENSÁVEL
  reasoning: >-
    Verifiquei a consequência da alternativa em vez de aceitar o argumento. Se a CSP
    morasse no middleware, ela só existiria onde o matcher alcança — `/dashboard/*`. Isso
    deixaria SEM CSP justamente `/[username]`, que é a superfície MAIS exposta do produto:
    é a única rota anônima, renderiza `avatar_url` (URL arbitrária fornecida pelo usuário)
    e lista URLs de links também fornecidas pelo usuário. Proteger o dashboard autenticado
    e deixar a página pública descoberta seria exatamente o inverso do que a superfície de
    risco pede. A separação escolhida (middleware = auth/sessão; next.config = headers)
    é coerente, cobre 4/4 headers em 8/8 rotas testadas, e não custa invocação edge.
    A decisão está certa e a documentação dela em next.config.ts é honesta.

# ── JULGAMENTO: 'unsafe-inline' é regressão disfarçada? ─────
judgment_unsafe_inline:
  qa_verdict: NÃO É REGRESSÃO — MAS A JUSTIFICATIVA REGISTRADA ESTÁ PARCIALMENTE ERRADA
  is_it_a_regression:
    answer: "Não."
    reasoning: >-
      O baseline desta branch é AUSÊNCIA TOTAL de CSP. `script-src 'self' 'unsafe-inline'`
      é estritamente melhor que nada: continua bloqueando script de host externo, e a
      policy entrega junto `object-src 'none'`, `base-uri 'self'`, `form-action 'self'` e
      `frame-ancestors 'none'` — quatro controles REAIS que não dependem de 'unsafe-inline'
      e que fecham, respectivamente, plugins legados, sequestro de URL relativa,
      exfiltração de credencial por form injetado e clickjacking. Nada foi enfraquecido em
      relação ao que existia. Não há regressão.
  but_the_honest_framing: >-
    Dito isso, `script-src` com 'unsafe-inline' neutraliza justamente a função pela qual a
    CSP é conhecida: mitigação de XSS. Uma CSP com 'unsafe-inline' em script-src não
    impede a execução de um `<script>` injetado. O ganho de NFR4 aqui é real mas está
    concentrado nos OUTROS diretivos, não no script-src. A story deveria dizer isso com
    essas palavras.
  where_the_dev_reasoning_breaks:
    claim: >-
      Completion Note 2: "'unsafe-inline', que o App Router exigiria de qualquer forma" e
      "nonce por request torna a resposta não-cacheável [...] a página pública é ISR
      (revalidate = 60, NFR1)".
    finding_1: >-
      ❌ FACTUALMENTE INCORRETO que o App Router "exigiria de qualquer forma". O Next.js
      suporta CSP com nonce via middleware como padrão de primeira classe e propaga o nonce
      para os próprios scripts inline do RSC. O que é verdade é algo mais fraco: um nonce
      exige geração por request e portanto não cabe em headers ESTÁTICOS de next.config.
    finding_2: >-
      ❌ O ARGUMENTO DO CACHE DEFENDE UM CACHE QUE NÃO EXISTE. A premissa é que o nonce
      quebraria o ISR de `/[username]`. Mas este gate PROVOU (ver isr_debt abaixo) que
      `/[username]` NÃO está em ISR: responde `no-store` e builda como `ƒ`. E `/dashboard/*`
      já é dinâmico e já passa pelo middleware. Ou seja, as duas superfícies que um nonce
      afetaria já são dinâmicas — o custo de cache alegado é zero hoje.
  net_judgment: >-
    A DECISÃO é aceitável e proporcional para um projeto didático de MVP: uma única fonte
    de headers, simples de manter, sem duas CSPs divergentes. Não bloqueio. O que NÃO é
    aceitável é o REGISTRO da decisão, que apresenta como impossibilidade técnica
    ("exigiria de qualquer forma", "quebraria o ISR") aquilo que é, na verdade, uma
    escolha de simplicidade. Num projeto cujo propósito declarado é ENSINAR, uma
    justificativa tecnicamente errada é um defeito de produto: o leitor aprende a coisa
    errada. Ver issue #2.
  img_src_https_judgment:
    qa_verdict: JUSTIFICÁVEL — mantenha
    reasoning: >-
      `profile.avatar_url` é URL arbitrária do usuário renderizada em `<img>` puro
      (components/ui/Avatar.tsx). Sem `https:` todo avatar externo quebraria em silêncio —
      exatamente a armadilha que a AC7 existe para evitar. O custo real de `img-src https:`
      é privacidade (o host da imagem vê IP/UA de quem visita a página) e a possibilidade
      de pixel de rastreamento; NÃO habilita execução de script. Para uma feature de
      produto contratada, é a troca certa. A alternativa forte — proxiar avatares por
      next/image com allowlist de host — é mudança de produto, fora do escopo desta story.
      Registro como débito informativo, não como defeito.

# ── JULGAMENTO: o fail-fast do pepper ───────────────────────
# ACHADO NOVO E CENTRAL DESTE GATE.
judgment_pepper_fail_fast:
  question: "Lançar na carga do módulo em produção é a escolha certa, ou cria indisponibilidade pior que o problema que resolve?"
  qa_verdict: O PRINCÍPIO ESTÁ CERTO — A IMPLEMENTAÇÃO ESTÁ NO PIOR LUGAR POSSÍVEL
  documented_claim: >-
    lib/rate-limit.ts L78-83 afirma: "production sem pepper → lança na CARGA DO MÓDULO.
    O app NÃO SOBE. Um deploy mal provisionado quebra ruidosamente NO BOOT, e não
    silenciosamente meses depois."
  empirical_test:
    method: "Removi RATE_LIMIT_PEPPER de .env.local e exercitei build + boot + rotas + Server Action real, em NODE_ENV=production."
    results:
      - { step: "pnpm build",                        result: "EXIT 0 — build PASSA sem o pepper" }
      - { step: "pnpm start (boot)",                 result: "sobe normalmente, sem erro no log" }
      - { step: "GET /",                             result: "307 (normal)" }
      - { step: "GET /login",                        result: "200" }
      - { step: "GET /signup",                       result: "200" }
      - { step: "GET /health",                       result: "200 — health check VERDE" }
      - { step: "GET /alessandrovarela",             result: "200" }
      - { step: "erro do pepper no log após tudo isso", result: "0 ocorrências" }
      - { step: "POST Server Action de login REAL (header Next-Action com o id extraído do HTML)", result: "HTTP 500 · log: '⨯ Error: [rate-limit] RATE_LIMIT_PEPPER é OBRIGATÓRIO em produção…'" }
  finding: >-
    ❌ A AFIRMAÇÃO DOCUMENTADA É FALSA. O app SOBE. O build PASSA. Todas as páginas servem
    200. O /health responde VERDE. O erro só aparece na PRIMEIRA INVOCAÇÃO REAL de uma
    Server Action que importe o módulo — porque o Next carrega módulos de Server Action sob
    demanda, não no boot.
  why_this_is_the_worst_placement: >-
    O controle está tarde demais para impedir o deploy ruim e cedo demais para ser
    inofensivo. Um deploy mal provisionado ficaria com TODOS OS SINAIS VERDES — build
    verde, deploy verde, homepage verde, página pública verde, /health verde — enquanto
    login, signup, reset de senha E tracking de cliques retornam 500. Monitoração que
    observe disponibilidade de página (o padrão) não veria nada. Quem descobre é o usuário
    tentando entrar. Blast radius: lib/rate-limit.ts é importado por lib/actions/auth.ts e
    lib/actions/track-click.ts, ou seja, a superfície de auth INTEIRA mais o tracking.
  is_it_worse_than_the_problem_it_solves:
    answer: "No caso de má configuração, sim — mas a comparação certa não é essa."
    reasoning: >-
      Sem pepper e sem fail-fast: o atacante nega login a IPs ESCOLHIDOS (indisponibilidade
      parcial, dirigida, exige ação do atacante). Com fail-fast e env ausente: TODO MUNDO
      perde auth (indisponibilidade total, imediata, sem atacante nenhum). O modo de falha
      é pior. O que salva a escolha é que a condição é determinística, de provisionamento
      único, já contratada como precondição BLOQUEANTE de merge (AC9 / issue #2 da Wave 3),
      e produz mensagem de erro excelente — enquanto a degradação silenciosa duraria
      indefinidamente sem ninguém notar. Por isso NÃO peço remoção do fail-fast.
  recommendation: >-
    Mover a validação para o BUILD, não substituir o throw. Um check de env em
    next.config.ts (ou passo de preflight no CI) que falhe `next build` quando
    NODE_ENV=production e RATE_LIMIT_PEPPER estiver ausente torna o deploy ruim
    IMPOSSÍVEL de embarcar — e aí o throw em runtime vira backstop redundante que nunca
    dispara. Isso é estritamente melhor que as duas alternativas atuais e custa poucas
    linhas. E, independentemente disso, CORRIGIR O COMENTÁRIO: ele descreve um
    comportamento que o código não tem, num arquivo cujo propósito é didático. Ver issue #1.

# ── AC5 / NFR1: o achado de ISR do @dev, verificado ─────────
isr_debt_independent_verification:
  dev_claim: "`/[username]` não está de fato em ISR (retorna no-store, builda como ƒ), e isso é PRÉ-EXISTENTE."
  qa_verdict: CONFIRMADO — E É DÉBITO DE PROJETO, NÃO DESTA STORY
  method: >-
    A/B feito por este gate, movendo FISICAMENTE middleware.ts e next.config.ts para fora
    do projeto (mv, não git stash, para não colidir com o @ux-design-expert na mesma
    branch) e rebuildando do zero.
  results:
    - { scenario: "COM middleware.ts + next.config.ts (esta story)", build_output: "ƒ /[username]", cache_control: "private, no-cache, no-store, max-age=0, must-revalidate" }
    - { scenario: "SEM middleware.ts e SEM next.config.ts (baseline)", build_output: "ƒ /[username]", cache_control: "(idêntico — rota já dinâmica)" }
  corroborating_evidence:
    - "app/[username]/ NÃO aparece em `git diff main...HEAD` — o arquivo está intocado por esta branch."
    - "app/[username]/page.tsx L12 declara `export const revalidate = 60` — a intenção existe."
    - "createPublicClient() não lê cookies (lib/supabase.ts L49-53) e nenhum componente da árvore importa next/headers — a causa NÃO é opt-out dinâmico por cookies/headers."
  verdict_scope: "PRÉ-EXISTENTE — a Story 6.5 NÃO causou e NÃO agravou."
  gap_description: >-
    NFR1 contrata cache agressivo na página pública e a rota DECLARA `revalidate = 60`,
    mas o comportamento observável é `no-store`: nenhuma resposta é cacheada, e cada
    visita à página pública paga render + round-trip ao Supabase. O `revalidate = 60`
    está inerte. Não determinei a causa-raiz com certeza (candidato mais provável:
    segmento dinâmico sem `generateStaticParams` combinado ao comportamento de fetch não
    cacheado do supabase-js sob Next 16/Turbopack) e não vou especular além disso num gate.
  routing: >-
    Registrar como DÉBITO DE PROJETO (não da 6.5) e endereçar a @architect. Tem interseção
    direta com o concern #2 da Wave 1 ("verificação pós-deploy de ISR em produção"), que
    segue aberto desde então — este gate dá a explicação provável de por que aquela
    verificação nunca fechou. Ver issue #3.

# ── Deprecação middleware.ts → proxy.ts (Next 16.2.6) ───────
middleware_deprecation:
  warning: '⚠ The "middleware" file convention is deprecated. Please use "proxy" instead.'
  reproduced_by_gate: true
  observations:
    - "O warning some quando middleware.ts é removido (confirmado no A/B) — a origem é o arquivo, não outra configuração."
    - "É WARNING, não erro: build exit 0, e o middleware FUNCIONA integralmente (todos os 307/200 desta seção foram obtidos com ele ativo)."
    - "O build output já nomeia a saída como `ƒ Proxy (Middleware)` — o Next já trata internamente como proxy."
  impact: LOW
  judgment: >-
    Não afeta esta wave: comportamento correto, build verde, zero impacto funcional. Mas é
    dívida com prazo — numa major seguinte o convention deixa de ser aceito e o middleware
    silenciosamente para de rodar. E aí o guard EDGE desaparece sem quebrar build nem
    teste; só o guard de layout seguraria. É precisamente o cenário para o qual o AC3
    (defense-in-depth) existe — a segunda camada cobriria a falha, o que valida a decisão
    de arquitetura da story.
  recommendation: >-
    Follow-up de baixa prioridade, NÃO nesta story: a renomeação mexe em convention de
    framework e merece story própria com atualização de routing.md e dos testes (que
    importam '@/middleware'). Ver issue #5.

