blocking_issues: []

merge_preconditions:
  - owner: "@devops"
    precondition: >-
      RATE_LIMIT_PEPPER provisionado em production E preview na Vercel ANTES do merge (AC9).
      Já era contratado pela story; este gate o CONFIRMA como bloqueante e eleva sua
      justificativa de privacidade para disponibilidade (issue #2).

decision: >-
  CONCERNS — Wave 3 do Epic 6 (Rate Limiting) APROVADA PARA MERGE com 7 concerns
  documentados, nenhum bloqueante, e UMA precondição de merge (o pepper na Vercel, que a
  própria story já contratava na AC9).

  O QUE ESTE GATE PROVOU, E NÃO LEU NO RELATÓRIO DO @dev. O ataque foi reproduzido do zero:
  75 chamadas curl diretas a POST /rest/v1/rpc/record_link_click com a anon key crua, contra
  o mesmo link ativo real do gate da Wave 2, sem tocar no Next.js. Resultado: 60 aceitas, 15
  recusadas, PRIMEIRA RECUSA NA CHAMADA #61, contagem do link de 1 → 61. A soma dos
  sub-buckets ficou em 60 e não em 75, o que é prova de quebra de que as requisições
  estouradas NÃO incrementam o contador (AC3, risco R4). O vetor de click inflation que o
  gate da Wave 2 deixou em aberto está FECHADO COMO BYPASS: nenhum caminho escapa do teto.
  Estado de development INTEGRALMENTE RESTAURADO e verificado — as 60 linhas da probe
  removidas, todos os contadores semeados apagados, a contagem do link de volta a 1, zero
  artefatos remanescentes.

  O RISCO Nº1 DA STORY ESTÁ AFASTADO. O catálogo foi lido diretamente: existe EXATAMENTE UMA
  public.record_link_click, assinatura (uuid, text) inalterada. Nenhuma sobrecarga órfã com
  grant a anon e sem teto ficou publicada, e o argumento do @dev de que o `drop function` do
  § 6.4(b) do ADR se tornou desnecessário sem a camada 3 está CORRETO e foi verificado, não
  aceito. A camada 3 descartada pelo @pm não vazou para lugar nenhum: zero ocorrências de
  p_app_proof, private.app_secrets ou TRACKING_APP_PROOF em código executável (só comentários
  explicativos na migration), e o schema `private` não existe no banco.

  AS TENTATIVAS DE EVASÃO FALHARAM, uma a uma. O subject do teto de tracking é derivado
  dentro da RPC e não é escolhido pelo chamador. O pg_advisory_xact_lock serializa DE
  VERDADE: 40 chamadas simultâneas com limite 20 produziram exatamente 20 hits. Não há burst
  de 2x na virada (a janela é soma de sub-buckets, não contador que zera); há apenas um
  excesso de granularidade de +16% no tracking, bounded e aceitável. O housekeeping é
  matematicamente incapaz de apagar contador vivo — apaga o que tem mais de 24h e a janela
  mais longa é 1h.

  SOBRE O FAIL-OPEN, QUE ERA A PERGUNTA MAIS IMPORTANTE: julgo que NÃO é disparável de
  propósito para desligar o teto de tracking, e a razão é estrutural, não circunstancial —
  dentro de record_link_click os cinco argumentos de check_rate_limit são LITERAIS, e o único
  valor sob controle do atacante (p_link_id) é tipado uuid e validado contra `links` antes.
  Não existe entrada que faça o handler disparar. O gate ainda descobriu que o fail-open é
  MENOS abrangente do que a story afirma: o bloco DECLARE fica fora do exception handler, e
  uma chamada direta com p_bucket_seconds=0 PROPAGOU "division by zero" em vez de retornar
  true. Isso não é explorável (nenhum caminho do produto passa parâmetro variável) mas
  invalida a afirmação literal da AC5 e do comentário da migration — issue #3. O risco real
  que permanece é o contratado pelo ADR: o fail-open dispara por falha genuína de
  infraestrutura, e essas condições correlacionam com carga, ou seja, o limiter tende a
  abrir justamente quando mais importa. Aceito como trade-off consciente, com a ressalva de
  que a issue #1 dá ao atacante um caminho para se aproximar dessas condições.

  POR QUE CONCERNS E NÃO PASS. O contrato da story foi cumprido, mas este gate encontrou um
  vetor NOVO, introduzido por esta própria story e não coberto por AC nem por débito aceito:
  `check_rate_limit` é `grant execute to anon` com p_bucket e p_subject inteiramente
  controlados pelo chamador, o que a converte numa PRIMITIVA DE ESCRITA REMOTA nos
  contadores. Provado por três probes. (a) Silenciamento de analytics: 60 chamadas anônimas
  esgotaram o balde track_link de um link de terceiro sem gravar UM ÚNICO clique, e a
  chamada legítima seguinte foi recusada — mais barato e mais discreto que a click inflation
  que a story fecha, e NÃO mitigável pelo pepper, porque o subject ali é o link_id, que é
  público por design. (b) Com o pepper vazio — que é o estado atual de .env.local e de
  .env.example — o subject dos buckets de auth é computável: 10 requisições anônimas negaram
  login a um IP arbitrário por 15 minutos, provado com o subject forjado do IP 203.0.113.77.
  (c) Buckets arbitrários são aceitos, permitindo crescimento irrestrito da tabela contra o
  NFR8. Balanço honesto: a story LIMITA a inflação de cliques e ABRE a supressão de cliques.
  Não bloqueio o merge porque o objetivo contratado foi cumprido e provado, o impacto é de
  disponibilidade e não de confidencialidade ou integridade, e porque o grant é EXIGIDO pela
  AC6 — o @dev implementou o contrato com fidelidade e o defeito é de DESENHO (ADR-001 § 3).
  Roteio a decisão para @architect/@pm exatamente como o gate da Wave 2 roteou o seu concern
  #1, e pelo mesmo motivo: precisa ser tomada conscientemente, não por omissão.

  A CONSEQUÊNCIA PRÁTICA IMEDIATA é que o gate de merge do pepper deixa de ser higiene de
  privacidade e passa a ser controle de segurança. A story, o .env.example e o handoff
  descrevem sua ausência como "permite correlacionar hashes de IP"; este gate demonstrou que
  ela habilita lockout de autenticação por IP. A afirmação funcional do @dev sobre o modo
  degradado (aviso único no log, limiter continua ativo) foi verificada e está CORRETA — o
  que está errado é a classificação de severidade.

  AS DUAS EXPECTATIVAS DE TESTE ALTERADAS SÃO FORTALECIMENTO LEGÍTIMO, não mascaramento. As
  asserções passaram de `error === null` + `length 0` para `error !== null` + "permission
  denied" + `data === null`: estritamente mais fortes, e um `200 []` que ANTES passava hoje
  FALHA. A mudança é a consequência direta e pretendida do revoke que o concern #2 da Wave 2
  recomendou. Nenhuma asserção removida, nenhum client anon trocado por service role.

  A MIGRATION É SEGURA PARA O CD DE PRODUÇÃO. Preflight executado por este gate contra
  bmyijncgsiubufwhttul: última versão aplicada 20260702120000, rate_limit_counters não existe
  e record_link_click ainda não existe — ou seja, as Waves 2 e 3 vão juntas no mesmo run, em
  ordem lexicográfica correta, e as dependências desta migration sobre a da Wave 2 são
  satisfeitas dentro do próprio run. Migration atômica, sem statement destrutivo, sem DROP,
  sem alteração de linha existente, rollback trivial e sem perda de dados.

  GATES REPRODUZIDOS: typecheck exit 0, lint exit 0. A suíte completa deu 296 testes, e não
  os 287 alegados — discrepância INVESTIGADA antes de virar achado: os 9 excedentes são de
  tests/unit/middleware.test.ts, arquivo não-rastreado da Story 6.5 em andamento pelo @dev na
  mesma branch. Excluindo-o, o resultado é EXATAMENTE 287 passed + 1 skipped em 40 arquivos.
  O número do @dev está correto para o escopo da 6.4. Progressão do projeto: 192 (Epic 5) →
  219 (Wave 1) → 233 (Wave 2) → 287 (Wave 3).

