execution:
  epicId: EPIC-2
  epicTitle: "Autenticação & Identidade"
  epicGoal: >-
    Entregar o domínio de autenticação completo via Supabase Auth (e-mail + senha,
    sem OAuth no MVP): signup com verificação obrigatória de e-mail, login, logout,
    reset de senha, sessão persistida por cookies server-side, proteção de rotas
    autenticadas via auth guard de layout e perfil editável com username único.
    Ao final, um usuário real cria conta, confirma e-mail, loga, edita perfil e sai;
    o dashboard existe como shell autenticado pronto para os próximos epics.

  storyBasePath: "docs/stories"
  template: "epic-orchestration"
  mode: interactive  # override via --mode=yolo at runtime

  # ──────────────────────────────────────────────────────────
  # DECISÕES DE ESCOPO (reconciliação pré-execução)
  # ──────────────────────────────────────────────────────────
  # Aprovadas por Alessandro Varela em 2026-06-14 antes de iniciar o epic:
  #
  # 1. Story 2.9 (proteção de rotas) → AUTH GUARD VIA LAYOUT
  #    (app/dashboard/layout.tsx), NÃO middleware.ts. Resolve a contradição
  #    PRD (pedia middleware) × Arquitetura v1.0 (proíbe edge middleware).
  #    A arquitetura prevalece (é mais recente). PRD Story 2.9 reconciliado.
  #    O middleware edge entra no Epic 6 (Hardening) como unidade didática.
  #
  # 2. Entrega de e-mail (2.5 confirmação / 2.7 reset) → BUILT-IN DO SUPABASE.
  #    Sem SMTP customizado no MVP. Limitação ~2-4 e-mails/h ("testing only")
  #    documentada como débito didático nas stories 2.5 e 2.7.
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # PRÉ-REQUISITOS DO OWNER (bloqueiam waves — fazer ANTES)
  # ──────────────────────────────────────────────────────────
  # Config no painel Supabase, em AMBOS os projetos (dev + prod).
  # Não são versionáveis por migration; precisam ser feitas por Alessandro.
  owner_prerequisites:
    - id: "OWNER-1"
      task: "Habilitar 'Confirm email' (Authentication → Providers → Email)"
      blocks: ["2.4", "2.5"]
      env: ["development", "production"]
    - id: "OWNER-2"
      task: >-
        Configurar Site URL + Redirect allowlist (Authentication → URL Configuration):
        localhost:3000 + URLs de preview (dev) e youtube-biolink.vercel.app (prod);
        incluir /auth/callback e /reset-password/confirm na allowlist.
      blocks: ["2.5", "2.7"]
      env: ["development", "production"]
    - id: "OWNER-3"
      task: >-
        Customizar Email Templates em pt-BR (Confirm signup + Reset password)
        em Authentication → Email Templates.
      blocks: ["2.5", "2.7"]
      env: ["development", "production"]

  # ──────────────────────────────────────────────────────────
  # STORIES
  # ──────────────────────────────────────────────────────────
  stories:
    - id: "2.1"
      file: "2.1.story.md"
      title: "Schema profiles e trigger de sincronização"
      status: pending
      branch: "feature/2.1-profiles-schema"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: "Fundação de dados. Depende do baseline do Epic 1. Migration + trigger auth.users → profiles."

    - id: "2.3"
      file: "2.3.story.md"
      title: "Lista de usernames reservados e validação"
      status: pending
      branch: "feature/2.3-username-validation"
      complexity: 2
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: "Helper puro (lib/validation/username.ts), sem acesso a DB. Independente."

    - id: "2.4"
      file: "2.4.story.md"
      title: "Signup com e-mail, senha e username"
      status: pending
      branch: "feature/2.4-signup"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.1", "2.3"]
      notes: "Requer OWNER-1 (confirm email habilitado). Usa trigger de 2.1 e validação de 2.3."

    - id: "2.5"
      file: "2.5.story.md"
      title: "Confirmação de e-mail"
      status: pending
      branch: "feature/2.5-email-confirmation"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.4"]
      notes: "Requer OWNER-1/2/3. Route Handler /auth/callback. E-mail via built-in Supabase."

    - id: "2.6"
      file: "2.6.story.md"
      title: "Login com credenciais e sessão"
      status: pending
      branch: "feature/2.6-login-session"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.4"]
      notes: "Sessão via cookies server-side (@supabase/ssr). Erro genérico p/ credenciais inválidas."

    - id: "2.7"
      file: "2.7.story.md"
      title: "Reset de senha"
      status: pending
      branch: "feature/2.7-password-reset"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.4", "2.5"]
      notes: "Requer OWNER-2/3 (redirect allowlist + template). E-mail via built-in Supabase."

    - id: "2.8"
      file: "2.8.story.md"
      title: "Logout"
      status: pending
      branch: "feature/2.8-logout"
      complexity: 1
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.6"]
      notes: "Server Action signOut() + invalidação de cookies."

    - id: "2.9"
      file: "2.9.story.md"
      title: "Proteção de rotas via auth guard de layout"
      status: pending
      branch: "feature/2.9-auth-guard-layout"
      complexity: 2
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.6"]
      notes: >-
        DECISÃO: auth guard via app/dashboard/layout.tsx (getUser() → redirect /login),
        NÃO middleware.ts. Alinha com arquitetura v1.0. Middleware edge fica no Epic 6.

    - id: "2.10"
      file: "2.10.story.md"
      title: "Dashboard de perfil editável"
      status: pending
      branch: "feature/2.10-profile-dashboard"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["2.1", "2.6"]
      notes: >-
        Form display_name/bio/avatar_url. Authz app-layer (filtro por auth.uid()).
        Username NÃO editável no MVP (débito Phase 2).

  # ──────────────────────────────────────────────────────────
  # WAVES
  # ──────────────────────────────────────────────────────────
  #
  # Estrutura de dependências:
  #   Wave 1: [2.1, 2.3]        — fundação: schema+trigger e helper de username
  #   Wave 2: [2.4, 2.5]        — signup → confirmação (SEQUENCIAL, 2.5 depende de 2.4)
  #   Wave 3: [2.6, 2.7]        — login e reset (dependem do fluxo de signup/e-mail)
  #   Wave 4: [2.8, 2.9, 2.10]  — logout, guarda de rotas e perfil (dependem da sessão 2.6)
  # ──────────────────────────────────────────────────────────

  waves:
    - number: 1
      name: "Fundação"
      description: "Schema profiles + trigger e helper de validação de username — base do domínio de identidade"
      stories: ["2.1", "2.3"]
      parallel: true
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que a migration de profiles aplicou em development com o trigger
        auth.users → profiles funcionando (teste de integração) e que o helper de
        username é puro e cobre happy path + todos os erros + normalização.
      merge_order: ["2.1", "2.3"]
      tag: "epic-2-wave-1-foundation"

    - number: 2
      name: "Signup & Confirmação"
      description: "Cadastro com username + verificação obrigatória de e-mail — requer Wave 1 e OWNER-1/2/3"
      stories: ["2.4", "2.5"]
      parallel: false  # 2.5 depende de 2.4
      gate_agent: "@architect"
      gate_focus: >-
        Verificar fluxo signup → e-mail de verificação → /auth/callback → /login?confirmed=1.
        Confirmar que username duplicado não cria usuário, que o profile é criado pelo trigger,
        e que os templates pt-BR e a redirect allowlist estão configurados (OWNER-2/3).
      merge_order: ["2.4", "2.5"]
      tag: "epic-2-wave-2-signup"

    - number: 3
      name: "Login & Reset"
      description: "Login com sessão por cookies e fluxo de recuperação de senha — requer Wave 2"
      stories: ["2.6", "2.7"]
      parallel: true
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que login válido persiste cookie de sessão (@supabase/ssr), que
        credenciais inválidas retornam erro genérico, e que o fluxo de reset
        (request → e-mail → /reset-password/confirm → nova senha) funciona ponta a ponta.
      merge_order: ["2.6", "2.7"]
      tag: "epic-2-wave-3-login-reset"

    - number: 4
      name: "Guarda & Perfil"
      description: "Logout, proteção de rotas via layout guard e dashboard de perfil — requer Wave 3"
      stories: ["2.8", "2.9", "2.10"]
      parallel: true
      gate_agent: "@architect"
      gate_focus: >-
        Verificar que logout invalida a sessão e bloqueia /dashboard, que o auth guard
        de layout redireciona anônimos para /login (sem middleware.ts), e que a edição
        de perfil persiste e respeita o filtro por auth.uid() (usuário não edita perfil alheio).
      merge_order: ["2.8", "2.9", "2.10"]
      tag: "epic-2-wave-4-guard-profile"

  # ──────────────────────────────────────────────────────────
  # FINAL GATE
  # ──────────────────────────────────────────────────────────
  final_gate:
    agent: "@architect"
    focus: >-
      Sign-off final do Epic 2 — Autenticação & Identidade.
      Verificar:
      1. Fluxo completo: signup → confirma e-mail → login → edita perfil → logout
      2. /dashboard inacessível sem sessão (redirect /login via layout guard)
      3. Username único validado contra reservados e duplicatas
      4. Sessão persiste por cookies server-side (@supabase/ssr)
      5. Authz app-layer: usuário não lê/escreve dados de outro (filtro auth.uid())
      6. CI verde em main; pnpm lint + test + build passando
      7. Conventional commits em todos os PRs do epic
    tag: "epic-2-complete"

  # ──────────────────────────────────────────────────────────
  # RETROSPECTIVE (opcional)
  # ──────────────────────────────────────────────────────────
  retrospective:
    enabled: true
    agent: "@sm"
    focus: >-
      O que funcionou bem no Epic 2? O que melhorar nos próximos epics?
      Registrar em docs/retrospectives/epic-2.md.

