profiles_column_exposure:
  columns_audited: 8
  columns:
    - { name: id,           type: uuid,        sensitive: false, note: "UUID do auth.users; já é chave pública da página." }
    - { name: username,     type: citext,      sensitive: false, note: "Público por design (FR13/FR14) e exigido pelo signup." }
    - { name: display_name, type: text,        sensitive: false, note: "Renderizado na página pública." }
    - { name: bio,          type: text,        sensitive: false, note: "Renderizado na página pública." }
    - { name: avatar_url,   type: text,        sensitive: false, note: "Renderizado na página pública." }
    - { name: theme,        type: text,        sensitive: false, note: "Renderizado na página pública." }
    - { name: created_at,   type: timestamptz, sensitive: false, note: "Metadado; não é PII." }
    - { name: updated_at,   type: timestamptz, sensitive: false, note: "Metadado; não é PII." }
  pii_found: false
  email_or_password_in_table: false  # e-mail/credenciais vivem em auth.users, sem grant p/ anon
  verdict: "USING (true) NÃO expõe nenhuma coluna sensível. Não há e-mail, telefone, hash nem token em public.profiles. A enumeração de usernames é o estado atual desde o Epic 2 e é REQUISITO do signup anônimo (lib/actions/auth.ts:37, role anon) e da página pública ISR. Restringir SELECT quebraria o cadastro SILENCIOSAMENTE. Decisão do @dev está correta."

