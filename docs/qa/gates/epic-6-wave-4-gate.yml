blocking_issues: []

merge_preconditions:
  - owner: "@devops"
    precondition: >-
      RATE_LIMIT_PEPPER provisionado em production E preview na Vercel ANTES do merge
      (AC9 da 6.4). REAFIRMADO E REFORÇADO por este gate: além do lockout de auth que o
      gate da Wave 3 provou, a ausência do env agora derruba a superfície de auth INTEIRA
      com HTTP 500 enquanto build, deploy, homepage, página pública e /health permanecem
      VERDES (issue #1). Um deploy sem esse env parece saudável e não tem login.

decision: >-
  CONCERNS — Wave 4 do Epic 6 APROVADA PARA MERGE com 8 concerns documentados, nenhum
  bloqueante, e UMA precondição de merge herdada e reforçada (o pepper na Vercel).

  A CORREÇÃO DO HIGH DA STORY 6.4 ESTÁ COMPLETA, e eu a reproduzi do zero em vez de ler o
  relatório. Os três abusos que eu mesmo provei na Wave 3 estão fechados: a supressão de
  analytics bate em 42501 na primitiva revogada E em 22023 no wrapper, porque 'track_link'
  não está na allowlist — tentei ainda contornar o regex de subject com um digest hex e a
  validação de bucket acontece antes, então não adianta; o lockout de auth perdeu a via
  direta e o subject forjado com pepper vazio não colide mais com o real, agora que
  .env.local define o pepper; e os buckets arbitrários foram recusados em 5 variantes,
  incluindo string vazia e tentativa de injeção, junto com 3 subjects malformados,
  inclusive um IP em claro — o NFR19 virou invariante do banco e não mais promessa do app.

  O PONTO FRÁGIL DO DESENHO FOI O QUE MAIS ME INTERESSOU, E ELE AGUENTA. Revogar a
  primitiva e contar com SECURITY DEFINER para que record_link_click continue alcançando-a
  internamente é uma aposta em resolução de privilégio: se estivesse errada, o teto de
  60/min/link teria sido DESLIGADO em silêncio e o vetor de click inflation que a Wave 3
  fechou estaria reaberto, sem erro nenhum aparecendo. Disparei 65 chamadas reais ao
  PostgREST com a anon key crua: 60 aceitas, primeira recusa na #61, 60 cliques gravados,
  ZERO erros de permissão, e a soma dos sub-buckets em 60 e não em 65 — o que reconfirma de
  quebra que requisição estourada não incrementa contador. A camada 2 também segue de pé
  pelo wrapper (60 true, depois recusa). A issue #3 da Wave 3 está corrigida no código, e
  não na afirmação, que era o que eu havia pedido. Estado de development integralmente
  restaurado e verificado por diff programático: zero linhas remanescentes deste gate.

  NA STORY 6.5, O NÚCLEO ESTÁ CERTO E EU FUI ALÉM DO QUE O @dev CONSEGUIU. O matcher é
  cirúrgico e não achei bypass em 10 variantes, incluindo path traversal, barra dupla,
  encoding e — o vetor sutil — a requisição RSC com header próprio. A prova de
  não-interceptação é estrutural e não depende de instrumentação: o middleware redireciona
  incondicionalmente sem usuário, logo todo 200 anônimo é prova de que ele não rodou, e
  /[username], /login, /signup, /health, / e os assets todos servem 200. O /auth/callback
  responde com a própria lógica e não com o /login do middleware, então o fluxo de troca de
  code está intacto. O guard de layout não aparece no diff em nenhuma forma — a proibição
  central do epic foi respeitada. E o mais importante: o @dev declarou que o dashboard
  autenticado "nunca foi renderizado", então eu o renderizei. Criei usuário de probe, fiz
  login pelo caminho real do produto, montei o cookie no formato do @supabase/ssr e servi as
  três rotas do dashboard com 200. Depois expirei o access_token deixando o refresh_token
  válido e provei o refresh proativo: Set-Cookie novo, token diferente do original,
  expires_at no futuro, 200 sem cair para /login. A AC5 deferida da Story 2.9 está fechada
  com prova de comportamento. Renderizei também os 3 temas, alterando profiles.theme entre
  eles: zero recursos externos em qualquer um.

  SOBRE A CSP, MEU JULGAMENTO SE DIVIDE. A decisão de ESCOPO está certa e é a única
  defensável: se a CSP morasse no middleware, ela cobriria só /dashboard/* e deixaria
  /[username] descoberta — justamente a rota anônima que renderiza avatar_url arbitrário e
  URLs de links fornecidas pelo usuário. Proteger o dashboard e expor a página pública seria
  o inverso do que a superfície de risco pede; os 4 headers estão em 8/8 rotas, inclusive
  assets, em enforce. O 'unsafe-inline' NÃO é regressão disfarçada: o baseline era ausência
  total de CSP, e a policy entrega object-src 'none', base-uri 'self', form-action 'self' e
  frame-ancestors 'none', que são controles reais e independentes dele. Mas seria desonesto
  parar aí: script-src com 'unsafe-inline' não mitiga XSS, que é a função pela qual a CSP é
  conhecida — o ganho está nos outros diretivos. E a JUSTIFICATIVA registrada está errada em
  dois pontos que verifiquei: o App Router NÃO "exigiria de qualquer forma" (nonce via
  middleware é padrão de primeira classe do Next, com propagação para os scripts do RSC), e
  o argumento de que o nonce quebraria o ISR defende um cache que não existe — /[username]
  responde no-store e /dashboard/* já é dinâmico. A decisão é aceitável; o registro dela,
  num projeto cujo propósito é ensinar, não é. Isso é a issue #2, e é de documentação, não
  de código. O img-src https: eu mantenho: avatar_url é feature contratada, sem ele todo
  avatar externo quebra em silêncio, e o custo é privacidade, não execução de script.

  SOBRE O PEPPER FAIL-FAST, ENCONTREI QUE A DOCUMENTAÇÃO DESCREVE UM COMPORTAMENTO QUE O
  CÓDIGO NÃO TEM. O comentário afirma que sem o env "o app não sobe" e "quebra ruidosamente
  no boot". Testei removendo o env com NODE_ENV=production: o build passa com exit 0, o
  servidor sobe, e /, /login, /signup, /health e /[username] respondem sem um único erro no
  log. Só quando invoquei a Server Action de login DE VERDADE, com o header Next-Action e o
  id extraído do HTML, veio o 500 e o erro apareceu. O Next carrega módulos de Server Action
  sob demanda, então o throw de topo de módulo nunca roda no boot. A consequência prática é
  ruim: um deploy mal provisionado fica com todos os sinais verdes — build, deploy,
  homepage, página pública, /health — enquanto login, signup, reset e tracking devolvem 500,
  e monitoração de disponibilidade de página não vê nada. Respondendo diretamente à pergunta:
  o PRINCÍPIO está certo e eu o endosso, porque um controle de segurança degradado em
  silêncio é pior que uma falha alta; mas a IMPLEMENTAÇÃO está no pior lugar possível, tarde
  demais para impedir o deploy ruim e cedo demais para ser inofensiva. No caso de má
  configuração o modo de falha é sim pior que o problema original — lockout de IPs
  escolhidos por um atacante versus queda total de auth sem atacante nenhum. O que salva a
  escolha é que a condição é determinística, de provisionamento único e já bloqueante de
  merge. A correção é barata e estritamente melhor que ambas as alternativas: validar o env
  no BUILD, para que o deploy ruim não embarque, deixando o throw como backstop que nunca
  dispara. Issue #1.

  O ACHADO DE ISR DO @dev PROCEDE E É DÉBITO DE PROJETO. Refiz o A/B por conta própria,
  movendo fisicamente middleware.ts e next.config.ts para fora e rebuildando: /[username]
  aparece como ƒ nos DOIS cenários. Somado a app/[username]/ não constar do diff da branch,
  a createPublicClient() não ler cookies e a nenhum componente da árvore importar
  next/headers, a conclusão é segura: a rota declara revalidate = 60 e responde no-store, e
  isso é anterior ao Epic 6. Não penalizo a 6.5 por um defeito que ela apenas tornou
  visível; registro como issue #3 para @architect, consolidada com o concern #2 da Wave 1,
  que este achado provavelmente explica.

  A DEPRECAÇÃO middleware.ts → proxy.ts é warning, não erro, e o middleware funciona
  integralmente — mas tem uma propriedade desagradável que merece registro: numa major
  futura o convention deixa de ser reconhecido e o middleware para de rodar sem quebrar
  build, typecheck ou os 9 testes unitários, que importam '@/middleware' diretamente em vez
  de passar pelo roteador. O guard edge sumiria em silêncio. É exatamente o cenário para o
  qual o AC3 existe: o guard de layout seguraria o acesso, e a perda seria de otimização e
  de refresh, não de controle. Isso valida a decisão de defense-in-depth de um jeito que nem
  a story previu. Follow-up de baixa prioridade, com story própria, fora do fim de epic.

  DECLARO EXPLICITAMENTE O QUE NÃO CONSEGUI VERIFICAR. Eu TAMBÉM não tenho browser
  conectado — list_connected_browsers retornou [] para mim como retornou para o @dev. A AC7,
  na redação literal "o console do browser está limpo", permanece NÃO VERIFICADA POR
  OBSERVAÇÃO DIRETA, e não vou classificar como verificado aquilo que não observei. Classifico
  o gap residual como LOW, não medium, e o fundamento é este: o risco concreto é uma CSP
  bloquear recurso que o browser tenta carregar, e a superfície inteira desses recursos está
  agora enumerada no HTML REALMENTE SERVIDO das rotas públicas E das autenticadas, nos 3
  temas — zero script ou stylesheet externo, zero host externo em posição de recurso, zero
  img externo, atributos style cobertos, SVG inline sem recurso externo. O que resta fora de
  alcance é estreito e o nomeio: comportamento que só existe em runtime de browser, como um
  eval dentro de chunk exercitado apenas por interação, ou requisição disparada por evento —
  sendo que connect-src já libera o único destino de rede do produto. Recomendo fechar
  pós-merge, com 10 minutos de console aberto incluindo um drag de link e uma troca de
  período no gráfico, consolidado com as verificações pós-deploy pendentes das Waves 1 e 2.

  GATES REPRODUZIDOS DO ZERO: typecheck exit 0, lint exit 0, build exit 0, pnpm dev sobe em
  143ms, e a suíte deu 42 arquivos passed + 1 skipped, 317 testes passed + 1 skipped em
  32.87s. O baseline alegado de 317 BATE EXATAMENTE — diferente da Wave 3, onde a
  discrepância exigiu investigação. Progressão do projeto: 192 (Epic 5) → 219 (W1) → 233
  (W2) → 296 (W3) → 317 (W4).

