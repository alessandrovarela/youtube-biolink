# ── Item 2: ASSINATURA ÚNICA DA RPC (risco nº1 da story) ────
# Uma sobrecarga antiga com `grant execute to anon` e SEM TETO reabriria o vetor inteiro.
rpc_signature_audit:
  method: "Leitura direta do catálogo (pg_proc/pg_namespace) via Management API — não o relatório do @dev."
  functions_found:
    - proname: record_link_click
      args: "p_link_id uuid, p_user_agent_short text"
      prosecdef: true
      proconfig: "{search_path=public}"
      proacl: "{postgres=X/postgres,anon=X/postgres,authenticated=X/postgres,service_role=X/postgres}"
      count: 1
    - proname: check_rate_limit
      args: "p_bucket text, p_subject text, p_limit integer, p_window_seconds integer, p_bucket_seconds integer"
      prosecdef: true
      proconfig: "{search_path=public}"
      proacl: "{postgres=X/postgres,anon=X/postgres,authenticated=X/postgres,service_role=X/postgres}"
      count: 1
  verdict: PASS
  reasoning: >-
    EXATAMENTE UMA `public.record_link_click` publicada, com a assinatura (uuid, text)
    inalterada. Nenhuma sobrecarga órfã sem teto ficou publicada — o `create or replace`
    substituiu o corpo da MESMA função, como o @dev argumentou, e a ausência do
    `drop function` do § 6.4(b) do ADR é de fato desnecessária SEM a camada 3. O
    raciocínio do @dev está correto e foi verificado no catálogo, não aceito no relatório.
    A ausência da entrada `=X/postgres` (PUBLIC) no proacl das DUAS funções confirma que
    os `revoke all ... from public` pegaram. Os três controles obrigatórios do ADR-001 § 4
    (search_path fixo, PUBLIC revogado, grant explícito mínimo) estão aplicados em ambas.
  regression_lock: >-
    tests/integration/rate-limit.test.ts assere via OpenAPI do PostgREST que a RPC publica
    exatamente {p_link_id, p_user_agent_short}. Trava adequada — um parâmetro a mais
