# ── Concerns / débitos (todos LOW/aceitos, não bloqueiam) ───
concerns:
  - severity: low
    category: performance
    story: "3.4"
    description: "reorderLinks: N UPDATEs sequenciais em loop; não escala além de ~30 links."
    recommendation: "Futuro: RPC/upsert em lote. Aceito no teto de 30 links do MVP."
  - severity: low
    category: correctness
    story: "3.4"
    description: "reorderLinks não exige lista completa de ids; sublista poderia gerar position colidente."
    recommendation: "UI sempre envia lista completa → sem bug real. Tornar a action defensiva (follow-up)."
  - severity: low
    category: correctness
    story: "3.3"
    description: "createLink calcula position = last+1 em query separada do insert (não atômico)."
    recommendation: "Colisão só em criação concorrente do mesmo usuário. Probabilidade mínima; aceito."
  - severity: medium
    category: process
    story: "3.5"
    description: "AC8 (smoke manual do fluxo público) não executável headless."
    recommendation: "Executar no PR contra dev com links reais. Smoke consolidado na Story 5.6."
  - severity: medium
    category: infra
    story: "3.1"
    description: "Migration links aplicada apenas no projeto dev."
    recommendation: "@devops aplica em prod (supabase db push) no fechamento do epic."
  - severity: low
    category: security
    story: "3.1"
    description: "Sem RLS — isolamento depende 100% do filtro app-layer."
    recommendation: "Defesa em profundidade endereçada na Story 6.2 (Epic 6). Débito consciente do MVP."

decision: >-
