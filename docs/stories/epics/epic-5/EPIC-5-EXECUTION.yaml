execution:
  epicId: EPIC-5
  epicTitle: "Analytics de Cliques"
  epicGoal: >-
    Entregar o último pilar didático do MVP — analytics. Tracking server-side de
    cliques (fire-and-forget, sem bloquear navegação), agregação eficiente por
    link e por dia, e dashboard de métricas (totais 7/30/90 dias + gráfico
    temporal). Mantém privacidade (sem IP raw, UA truncado ≤120 chars). Ao final,
    o produto está FUNCIONALMENTE COMPLETO e demonstra os 6 pilares integrados;
    a Story 5.6 declara o MVP entregue via smoke test manual ponta a ponta.

  storyBasePath: "docs/stories"
  template: "epic-orchestration"
  mode: yolo  # solicitado pelo owner (padrão dos Epics 3-4)

  # ──────────────────────────────────────────────────────────
  # DECISÕES DE ESCOPO (reconciliação pré-execução — ratificar)
  # ──────────────────────────────────────────────────────────
  #
  # 1. GRÁFICO (Story 5.5) → INLINE SVG zero-dependência (default recomendado).
  #    O PRD 5.5 AC2 diz "biblioteca escolhida pelo @architect" (recharts/tremor).
  #    Reconciliação: o projeto é zero-dep por princípio (sem zod, cn local, sem
  #    lib de UI). Um gráfico de linha simples cabe em SVG inline + tokens do
  #    design system (Epic 4), sem adicionar peso de bundle. Alternativa recharts
  #    fica a critério do @architect se o SVG inline provar-se insuficiente.
  #    Usar a skill `dataviz` como guia de boas práticas visuais.
  #
  # 2. AUTHZ = APPLICATION-LAYER (sem RLS, sem SERVICE_ROLE, sem rate limiting).
  #    Consistente com Epics 2-4. `link_clicks` sem RLS no MVP: INSERT via Server
  #    Action com client server-side; SELECT via Server Action filtrando por
  #    links do auth.uid(). RLS de link_clicks → Epic 6 (Story 6.3); rate limiting
  #    do tracking (60/linkId/IP/min) → Epic 6 (Story 6.4). (PRD 5.1 AC3, 5.2 AC5.)
  #
  # 3. PRIVACIDADE — sem IP raw; user_agent truncado ≤120 chars; hash SHA-256
  #    truncado (16 chars) é OPCIONAL/stretch (dedup futura). (PRD 5.1 AC1/AC4,
  #    NFR19.)
  #
  # 4. AGREGAÇÃO (Story 5.4) — view `link_click_daily` (regular; materializada só
  #    se o benchmark exigir). Helpers em `lib/analytics/clicks.ts`. Benchmark
  #    <100ms com 10k cliques seeded (PRD 5.4 AC4). Reconciliação: o AC3 cita "RLS
  #    filter" — no MVP o filtro é app-layer (join por profile_id via auth.uid()),
  #    igual às demais leituras.
  #
  # 5. GRÁFICO/DASHBOARD reusa o design system do Epic 4 (Card, tabela, tokens,
  #    tema) — depende do Epic 4 mergeado (ver PREREQ técnico).
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # OWNER PREREQUISITES
  # ──────────────────────────────────────────────────────────
  # Nenhum para código. Itens humanos/comunidade da Story 5.6 (não bloqueiam a
  # implementação, bloqueiam a DECLARAÇÃO de MVP):
  owner_prerequisites:
    - id: "OWN-1"
      task: "Executar o smoke test manual ponta a ponta (roteiro da Story 5.6) e confirmar analytics refletindo cliques reais."
      blocks: ["5.6"]
    - id: "OWN-2"
      task: "3 devs externos reproduzem o setup local (registros em issues/discussion). Pode ser assíncrono pós-implementação."
      blocks: ["5.6"]
    - id: "OWN-3"
      task: "Tag de release v0.1.0 na main e promoção do Change Log do PRD para 1.0 — via @devops (exclusivo)."
      blocks: ["5.6"]

  # ──────────────────────────────────────────────────────────
  # PRÉ-REQUISITOS TÉCNICOS (bloqueiam a Wave 1 — fazer ANTES)
  # ──────────────────────────────────────────────────────────
  technical_prerequisites:
    - id: "PRE-1"
      task: >-
        Epic 4 (Design System) mergeado na `main` OU o branch do Epic 5 ramifica
        de `feature/epic-4-design-system`. O dashboard de analytics (5.5) e o
        tracking na pública (5.3) reusam primitivos, tokens e a PublicProfileView
        do Epic 4. IDEAL: @devops mergeia o Epic 4 primeiro; então o Epic 5
        ramifica de `main` atualizada.
      owner: "@devops / @pm"
      blocks: ["5.3", "5.5"]
    - id: "PRE-2"
      task: >-
        Confirmar schema `links` (Epic 3) como base do FK de `link_clicks`. ER
        consolidado em docs/architecture/ER.md deve ganhar a entidade link_clicks.
      owner: "@data-engineer"
      blocks: ["5.1"]
    - id: "PRE-3"
      task: >-
        Script de seed `pnpm seed:dev` (ou equivalente) para popular ~10k cliques
        no projeto Supabase development, necessário ao benchmark da Story 5.4.
        Criado dentro da 5.4 (não é passo separado), listado p/ visibilidade.
      owner: "@dev"
      blocks: ["5.4"]

  # ──────────────────────────────────────────────────────────
  # STORIES
  # ──────────────────────────────────────────────────────────
  stories:
    - id: "5.1"
      file: "5.1.story.md"
      title: "Schema `link_clicks`"
      status: pending
      branch: "feature/5.1-link-clicks-schema"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Migration cria `link_clicks` append-only: id uuid PK, link_id FK→links
        (on delete cascade), clicked_at timestamptz default now(), user_agent_short
        text check(len<=120), user_agent_hash text (opcional). Índice
        (link_id, clicked_at desc). Trigger updated_at NÃO se aplica (append-only).
        SEM RLS (deferido 6.3). Aplica em development via db push. DDL revisada
        por @data-engineer. Teste integração: user A não vê cliques de links de
        user B via SELECT filtrado por auth.uid(). Requer PRE-2 (ER).

    - id: "5.2"
      file: "5.2.story.md"
      title: "Server Action de tracking de clique"
      status: pending
      branch: "feature/5.2-track-click-action"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["5.1"]
      notes: >-
        `lib/actions/track-click.ts` (padrão dos demais actions) exporta
        trackLinkClick(linkId). Valida linkId existe E is_active=true antes de
        inserir (evita lixo). INSERT via createServerClient (SEM SERVICE_ROLE —
        link_clicks sem RLS no MVP). Trunca UA ≤120 chars; hash opcional (stretch).
        SEM rate limiting (Epic 6). Retorna {ok:true}|erro tipado; NUNCA lança
        (graceful). Testes unit (mock) + integração contra development.

    - id: "5.4"
      file: "5.4.story.md"
      title: "Agregação de cliques (view + query helpers)"
      status: pending
      branch: "feature/5.4-clicks-aggregation"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["5.1"]
      notes: >-
        Migration cria view `link_click_daily` (count por link_id + dia).
        Helper `lib/analytics/clicks.ts`: getClicksByLink(profileId) (total por
        link) e getDailyClicks(profileId, days) (série diária). Filtro app-layer
        por auth.uid() via join em profile_id. Benchmark documentado: 10k cliques
        seeded (PRE-3) → query <100ms; materializar só se necessário. Testes de
        integração com seed. Independe de 5.2/5.3 (constrói sobre o schema).

    - id: "5.3"
      file: "5.3.story.md"
      title: "Tracking disparado na página pública"
      status: pending
      branch: "feature/5.3-public-tracking"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["5.2"]
      notes: >-
        Componente client envolve cada link da pública e intercepta onClick →
        dispara trackLinkClick ANTES de navegar, fire-and-forget (sem bloquear).
        Link continua <a href> válido: Ctrl+Click, middle-click e teclado
        funcionam; navegação ocorre mesmo com tracking offline. Integra com a
        PublicProfileView do Epic 4 (PRE-1). Teste manual: clique grava linha;
        navegação resiliente a falha de tracking.

    - id: "5.5"
      file: "5.5.story.md"
      title: "Dashboard de analytics"
      status: pending
      branch: "feature/5.5-analytics-dashboard"
      complexity: 5
      executor: "@dev"
      quality_gate: "@ux-design-expert"
      dependencies: ["5.4"]
      notes: >-
        Página /dashboard/analytics: tabela (título, total, 7d, 30d) + gráfico de
        linha (cliques/dia, 30d, todos os links) via INLINE SVG zero-dep (decisão
        #1) usando tokens do Epic 4. Toggle de período 7/30/90d. Estado vazio
        amigável + CTA compartilhar. Skeleton loading. A11y: <caption> na tabela,
        aria-label/tabela alternativa no gráfico. Adicionar link na nav do
        dashboard (Perfil ↔ Links ↔ Analytics). Reusa primitivos Epic 4 (PRE-1).
        Testes unit dos helpers de agregação. Usar skill `dataviz` como guia.

    - id: "5.6"
      file: "5.6.story.md"
      title: "Revisão final: smoke test manual e merge MVP"
      status: pending
      branch: "feature/5.6-mvp-smoke-test"
      complexity: 2
      executor: "@pm"
      quality_gate: "@qa"
      dependencies: ["5.3", "5.5"]
      notes: >-
        Checklist smoke MANUAL (E2E automatizado fora de escopo): signup→confirm→
        login→perfil+tema accent→3 links (reorder, desativar 1)→pública anônima→
        clicar 2→analytics reflete 2. Documentar roteiro em docs/smoke-test.md.
        README ganha "O MVP está pronto quando…" (NFR17 + goals). Incorporar o
        débito da retro Epic 3 (e2e do reset por e-mail) ao roteiro. Itens
        humanos: 3 repro externas (OWN-2), tag v0.1.0 + PRD→1.0 (OWN-3, @devops).

  # ──────────────────────────────────────────────────────────
  # WAVES
  # ──────────────────────────────────────────────────────────
  #
  # Estrutura de dependências:
  #   Wave 1: [5.1]        — schema link_clicks (base; bloqueia o resto)
  #   Wave 2: [5.2, 5.4]   — track action e agregação (view+helpers); ambos só
  #                          dependem de 5.1, tocam arquivos distintos → paralelas
  #   Wave 3: [5.3, 5.5]   — tracking na pública (usa 5.2) e dashboard analytics
  #                          (usa 5.4); arquivos distintos (pública vs dashboard)
  #                          → paralelas. Requer Epic 4 (PRE-1).
  #   Wave 4: [5.6]        — smoke test manual + declaração de MVP (consolida)
  #
  # NOTA DE EXECUÇÃO (lição Epics 3-4): em YOLO, subagentes rodam SEQUENCIAIS no
  # mesmo working tree respeitando dependências; a paralelização "real" (worktrees)
  # é colapsada para evitar o gotcha de merge. Waves definem a ordem lógica.
  # ──────────────────────────────────────────────────────────

  waves:
    - number: 1
      name: "Fundação de Dados"
      description: "Schema `link_clicks` append-only — base do tracking e da agregação"
      stories: ["5.1"]
      parallel: false
      gate_agent: "@data-engineer"
      gate_focus: >-
        Migration de link_clicks aplicou em development com índice
        (link_id, clicked_at desc) e FK cascade para links; sem RLS (deferido
        6.3); UA ≤120 chars por CHECK; sem IP raw. Isolamento app-layer: SELECT
        filtrado por auth.uid() não vaza cliques entre usuários. DDL bate com o
        ER atualizado (PRE-2).
      merge_order: ["5.1"]
      tag: "epic-5-wave-1-schema"

    - number: 2
      name: "Tracking & Agregação"
      description: "Server Action de tracking e view/helpers de agregação — requer Wave 1"
      stories: ["5.2", "5.4"]
      parallel: true
      gate_agent: "@qa"
      gate_focus: >-
        trackLinkClick valida existência + is_active antes de inserir, nunca
        lança, retorna tipado; INSERT sem SERVICE_ROLE. Agregação: view
        link_click_daily + getClicksByLink/getDailyClicks corretos e filtrados
        por auth.uid(); benchmark <100ms com 10k cliques documentado. Sem rate
        limiting (Epic 6).
      merge_order: ["5.2", "5.4"]
      tag: "epic-5-wave-2-tracking-aggregation"

    - number: 3
      name: "Superfícies"
      description: "Tracking na página pública e dashboard de analytics — requer Wave 2 + Epic 4 (PRE-1)"
      stories: ["5.3", "5.5"]
      parallel: true
      gate_agent: "@ux-design-expert"
      gate_focus: >-
        Pública: clique dispara tracking fire-and-forget sem bloquear navegação;
        <a href> preserva Ctrl/middle/teclado. Dashboard: tabela (total/7d/30d) +
        gráfico SVG por dia + toggle 7/30/90d + estado vazio + skeleton; a11y
        (<caption>, aria no gráfico); link na nav; reusa design system Epic 4.
        `pnpm dev` sobe sem erro (lição Epic 4).
      merge_order: ["5.3", "5.5"]
      tag: "epic-5-wave-3-surfaces"

    - number: 4
      name: "Fechamento do MVP"
      description: "Smoke test manual ponta a ponta + declaração de MVP — requer Waves 1-3"
      stories: ["5.6"]
      parallel: false
      gate_agent: "@qa"
      gate_focus: >-
        docs/smoke-test.md com roteiro completo (inclui e2e do reset por e-mail —
        débito da retro Epic 3); README com "O MVP está pronto quando…". Itens
        humanos (repro externas, tag v0.1.0, PRD→1.0) sinalizados como pendências
        de owner/@devops, não bloqueiam o código.
      merge_order: ["5.6"]
      tag: "epic-5-wave-4-mvp-closure"

  # ──────────────────────────────────────────────────────────
  # FINAL GATE
  # ──────────────────────────────────────────────────────────
  final_gate:
    agent: "@qa"
    focus: >-
      Sign-off final do Epic 5 — Analytics de Cliques (MVP funcionalmente
      completo). Verificar:
      1. Fluxo: clicar link na pública → link_clicks grava → dashboard analytics
         reflete total + série diária
      2. Privacidade: sem IP raw; UA ≤120 chars; nada de PII desnecessário (NFR19)
      3. Tracking fire-and-forget: navegação nunca bloqueia; Ctrl/middle/teclado OK
      4. Authz app-layer: usuário só vê analytics dos próprios links (auth.uid())
      5. Agregação com benchmark <100ms (10k cliques); gráfico SVG zero-dep + a11y
      6. Nenhuma regressão (auth, links, temas, página pública)
      7. `pnpm dev` sobe sem erro de compilação + CI verde em main (typecheck+lint+
         test+build)
      8. Conventional commits; migrations (5.1, 5.4) versionadas p/ CD de prod
    tag: "epic-5-complete"

  # ──────────────────────────────────────────────────────────
  # RETROSPECTIVE
  # ──────────────────────────────────────────────────────────
  retrospective:
    enabled: true
    agent: "@sm"
    focus: >-
      O que funcionou no Epic 5 (último pilar do MVP)? A decisão de gráfico
      zero-dep (SVG inline) se pagou? O smoke test manual fechou os gaps que os
      testes de integração não cobrem (reset por e-mail, clique real)? Registrar
      em docs/retrospectives/epic-5.md. Ao final: MVP declarado pronto?

