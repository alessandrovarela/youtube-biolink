name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Preflight de provisionamento (issue #1 do gate da Wave 4).
      # O gate autoritativo é `assertProductionEnv()` em next.config.ts, que faz o
      # `next build` abaixo FALHAR sem os envs. Este passo roda ANTES só para dar a
      # mensagem crua e um log legível — um build vermelho por env ausente não deve
      # exigir arqueologia de stack trace. Se um dos dois for removido, o outro segura.
      - name: Preflight — required production env
        env:
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}
        run: |
          if [ -z "${RATE_LIMIT_PEPPER}" ]; then
            echo "::error::RATE_LIMIT_PEPPER ausente. Sem ele o subject dos buckets de auth é sha256(\":\"+ip) — computável por qualquer um — e um atacante nega login a IPs arbitrários (lockout). Provisione o secret no GitHub e as env vars em production E preview na Vercel (openssl rand -hex 32, server-only, NUNCA NEXT_PUBLIC_*, valor distinto por ambiente)."
            exit 1
          fi
          echo "RATE_LIMIT_PEPPER presente (${#RATE_LIMIT_PEPPER} chars)."

      - name: Build
        run: pnpm build
        env:
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}

  # ────────────────────────────────────────────────────────────
  # CD — aplica migrations em produção após merge na main.
  # Roda só no push da main, depois de `quality` passar. Usa o
  # environment `production` (configure required reviewers no GitHub
  # para exigir aprovação manual em migrations sensíveis/destrutivas).
  # Secrets necessários: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
  # SUPABASE_PROJECT_REF_PROD.
  # ────────────────────────────────────────────────────────────
  migrate-production:
    name: Apply migrations to production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link & push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF_PROD"
          supabase db push
