# ── Item 1: PROBES REPRODUZIDAS PELO GATE ───────────────────
# Executadas pelo @qa com curl e a anon key crua de .env.local contra o PostgREST de
# development — exatamente o que um atacante de posse da anon key faria. NÃO são os
# números reportados pelo @dev; foram reproduzidas do zero.
adversarial_probes:
  target: "rjsvkwjgsctqsswrospx (youtube-biolink-dev) — PostgREST"
  method: "curl + anon key crua (NEXT_PUBLIC_SUPABASE_ANON_KEY)"
  results:
    - probe: "GET /rest/v1/link_click_daily?select=*&limit=3"
      http: 401
      body: '{"code":"42501","message":"permission denied for view link_click_daily"}'
      verdict: PASS
      closes: "concern #1 do gate da Wave 1 — vazamento ATIVO. Antes: HTTP 200 com a agregação de TODOS os perfis."
    - probe: "GET /rest/v1/link_clicks?select=*&limit=3"
      http: 200
      body: "[]"
      verdict: PASS
      note: "RLS não erra — a linha simplesmente não existe para a role anon (sem policy TO anon). AC4."
    - probe: "POST /rest/v1/link_clicks (link_id arbitrário)"
      http: 401
      body: '{"code":"42501","message":"permission denied for table link_clicks"}'
      verdict: PASS
      closes: "🔴 CONCERN MEDIUM DO GATE DO EPIC 5 — FECHADO E PROVADO. AC3."
    - probe: "DELETE /rest/v1/link_clicks?link_id=neq.<uuid>"
      http: 401
      body: "permission denied for table link_clicks"
      verdict: PASS
    - probe: "PATCH /rest/v1/link_clicks?link_id=neq.<uuid> (UPDATE em massa)"
      http: 401
      body: "permission denied for table link_clicks"
      verdict: PASS
      note: "Probe ADICIONAL do gate (o @dev não reportou UPDATE). Append-only é real."
    - probe: "POST /rest/v1/rpc/record_link_click (link inexistente)"
      http: 200
      body: "false"
      verdict: PASS
      note: "No-op silencioso, não lança. AC9."
    - probe: "POST /rest/v1/link_click_daily (INSERT na view)"
      http: 500
      body: '{"code":"55000","message":"cannot insert into view — Views containing GROUP BY are not automatically updatable"}'
      verdict: PASS_WITH_NOTE
      note: >-
        Probe ADICIONAL do gate. A escrita falha, mas por NÃO-ATUALIZABILIDADE (55000) e
        não por privilégio (42501) — o Postgres checa updatability antes do ACL. Efeito
        prático nulo (a view é agregada, jamais será atualizável), mas a mensagem confirma
        a existência e a forma da view a um anônimo. Ver concern #4.
  conclusion: >-
    Os dois furos contratados estão FECHADOS e provados por este gate de forma
    independente. Nenhuma probe passou onde deveria falhar.

# ── Item 2: AUDITORIA DA RPC COMO SUPERFÍCIE DE ATAQUE ──────
# record_link_click é SECURITY DEFINER com `grant execute to anon` — ou seja,
# executável por QUALQUER pessoa na internet. Auditada vetor a vetor.
rpc_attack_surface_audit:
  function: "public.record_link_click(p_link_id uuid, p_user_agent_short text)"
  catalog_verified_by_gate:
    prosecdef: true
    proconfig: "{search_path=public}"
    owner: postgres
    proacl: "{postgres=X/postgres, anon=X/postgres, authenticated=X/postgres, service_role=X/postgres}"
    public_execute_present: false
    note: >-
      Lido pelo gate via Management API. A AUSÊNCIA da entrada `=X/postgres` (PUBLIC)
      prova que o `revoke all ... from public` pegou. Contraste didático confirmado:
      handle_new_user() e set_updated_at() AINDA têm `=X/postgres`.
  vectors:
    - vector: "SQL injection via p_link_id ou p_user_agent_short"
      result: NOT_EXPLOITABLE
      why: >-
        plpgsql sem NENHUM SQL dinâmico (zero EXECUTE / format / concatenação). Os dois
        parâmetros são tipados (uuid, text) e usados exclusivamente como valores de bind.
        Um p_link_id não-uuid é rejeitado pelo próprio parser antes de entrar na função.
    - vector: "search_path hijack (schema temporário com uma tabela `links` falsa)"
      result: DENIED
      why: "`set search_path = public` fixo na função, confirmado no catálogo (proconfig). Mesmo padrão de handle_new_user."
    - vector: "Inserir clique em link de OUTRO usuário"
      result: ALLOWED_BY_DESIGN
      why: >-
        É o requisito. O clicador é um visitante anônimo na página pública de outra
        pessoa — a RPC PRECISA gravar em link de terceiro. Não é escalada: a função só
        insere em link_clicks, valida is_active no banco, e o resultado continua sujeito
        a link_clicks_select_own na leitura (só o dono lê). O privilégio elevado cobre
        UMA operação e não sai do banco.
    - vector: "user_agent gigante (payload de 500 chars / MBs) estourando o CHECK ou DoS de storage"
      result: MITIGATED
      why: >-
        `left(p_user_agent_short, 120)` trunca DENTRO da função, em paridade com o CHECK
        da Story 5.1 — um chamador direto da RPC não consegue estourar o CHECK nem gravar
        mais que 120 chars. Provado por teste dedicado (link-clicks-rls.test.ts:248) e
        reproduzido: 500 chars → linha com length exatamente 120. O corpo da requisição
        ainda trafega inteiro até o Postgres, mas isso é limite do PostgREST/Kong, não
        desta função.
    - vector: "Enumeração de link_ids válidos/ativos pelo retorno boolean (oracle)"
      result: NOT_A_LEAK
      why: >-
        Analisado e DESCARTADO por duas razões independentes. (1) link_id é uuid v4 —
        enumerar é 2^122, inviável. (2) Mais importante: o boolean não vaza NADA de novo,
        porque `links_select_public_active` (Story 6.2) já permite ao anon LISTAR todos os
        links ativos via GET /rest/v1/links. O oracle entrega estritamente MENOS que o que
        já é público por design. Bônus: link inexistente e link inativo colapsam ambos em
        `false`, então NÃO há oracle que distinga "não existe" de "existe mas está
        desativado" — os links inativos continuam invisíveis. Desenho correto.
    - vector: "DoS / click inflation por repetição contra um link ativo legítimo"
      result: OPEN_BY_DESIGN
      why: >-
        Único vetor que permanece aberto, e está explicitamente no OUT da story. PROVADO
        POR ESTE GATE — ver concern #1, que é o achado central deste gate: a mitigação
        planejada não fecha o caminho que o gate demonstrou.
  verdict: >-
    A RPC está CORRETAMENTE ENDURECIDA. Os três controles obrigatórios do ADR-001 § 4
    (search_path fixo, revoke de PUBLIC, grant explícito e mínimo) estão aplicados e
    foram confirmados no catálogo pelo gate. Nenhum vetor de escalada de privilégio,
    injeção ou vazamento. O único risco residual é volumétrico (inflation), não de
    confidencialidade nem de integridade de esquema.

# ── Item 3: contrato fire-and-forget preservado ─────────────
contract_preservation:
  file: "lib/actions/track-click.ts"
  never_throws:
    status: PASS
    why: >-
      Corpo inteiro dentro de try/catch com `catch { return { ok:false, ... } }` como
      guarda de último recurso. Os três caminhos de falha (input inválido, error da RPC,
      data !== true) RETORNAM ActionResult — nenhum `throw`. `git diff main` confirma que
      o try/catch não foi tocado pelo refactor.
  navigation_never_blocked:
    status: PASS
    why: >-
      Falha de rede/RPC vira `{ ok:false }`, nunca exceção. O contrato de retorno
      (ActionResult) é idêntico ao anterior — o caller não tem como perceber a mudança.
  tracked_link_untouched:
    status: PASS
    why: >-
      components/public/TrackedLink.tsx NÃO está no diff da branch (verificado:
      `git diff main --name-only | grep -E '^(lib|app|components)/'` retorna APENAS
      lib/actions/track-click.ts). Ctrl/middle-click e navegação por teclado seguem
      exatamente como a Story 5.3 os deixou, incluindo o fix do clique fantasma (9dd7935).
  behavioral_equivalence:
    status: PASS
    why: >-
      Os dois erros antigos ('Link não encontrado' e 'Link inativo') colapsaram em
      'Link não encontrado ou inativo'. Externamente equivalente: ambos já eram
      `{ ok:false }` e nenhuma mensagem de tracking é renderizada na UI (fire-and-forget).
      Fecha, de quebra, o item 9 do inventário (caminho morto), que o gate da Wave 1
      havia deferido para cá — CONFIRMADO FECHADO.
  improvement_noted: >-
    O refactor ELIMINA a janela TOCTOU do SELECT-depois-INSERT (o link podia ser
    desativado entre as duas queries) e corta 2 round-trips para 1 no caminho crítico
    da página pública. É ganho de correção E de latência, não só de segurança.

# ── Item 4: analytics sem regressão + qualidade da correção ─
# A pergunta adversarial: a correção dos testes foi REAL ou mascarada?
analytics_regression:
  helpers_under_rls: PASS
  why: >-
    getClicksByLink/getDailyClicks funcionam sob RLS com client autenticado — provado
    pelos testes de integração (que rodam contra o dev real, não mocks) e pela cadeia de
    grants: `grant select on link_clicks to authenticated` (AC7) + security_invoker na
    view. O risco R1/R7 ("permission denied for table link_clicks", o erro mais provável
    de um rollout apressado) NÃO se materializou.
  test_fix_audit:
    masked_or_tautological: false
    verdict: CORRIGIDO CORRETAMENTE — NÃO MASCARADO
    evidence: >-
      O gate leu o diff dos três arquivos procurando especificamente pela fraude mais
      provável: trocar o client anon por createAdminClient() (service role BYPASSA RLS,
      o que tornaria os testes tautológicos e a RLS não seria exercida). ISSO NÃO
      ACONTECEU. Os três arquivos autenticam DE VERDADE via
      `createAnonClient()` + `signInWithPassword()` → JWT real → role Postgres
      `authenticated`, que é o caminho REAL do produto
      (app/dashboard/analytics/page.tsx usa createServerClient() com cookie de sessão).
      O service role aparece apenas em setup/teardown e em releituras AUTORITATIVAS de
      estado — uso correto e necessário (a verificação do estado final não pode depender
      das policies que estão sob teste).
    strongest_evidence: >-
      clicks-aggregation.test.ts:125 — o teste de isolamento passou a criar DOIS clients
      autenticados independentes (asA e asB) e verifica simetria nos dois sentidos. Antes
      era um único client anon com filtro app-layer. E link-clicks-rls.test.ts:177 pede
      `select('id, link_id')` SEM FILTRO app-layer NENHUM: se a policy falhar, o clique de
      B aparece e o teste quebra. Isso é um teste REAL de RLS — antes era app-layer.
  app_layer_preserved_nfr3: PASS
  app_layer_note: >-
    lib/analytics/clicks.ts NÃO foi tocado; o filtro `.in('link_id', linkIds)` e o
    `.eq('profile_id', profileId)` continuam no lugar. Defense-in-depth mantida: a RLS
    SOMOU uma barreira, não substituiu a app-layer. Único arquivo de runtime no diff da
    branch inteira: lib/actions/track-click.ts.

# ── Item 5: isolamento cross-user (os 3 caminhos) ───────────
cross_user_isolation:
  via_table:
    result: ISOLATED
    why: "link_clicks_select_own (única policy, lida do catálogo pelo gate) exige EXISTS em links com l.profile_id = (select auth.uid()). A não vê cliques de B."
  via_view:
    result: ISOLATED
    why: "security_invoker = on faz a view rodar sob a RLS do chamador; o count(*) passa a ser calculado apenas sobre as linhas VISÍVEIS. anon perdeu TODOS os grants na view."
  via_rpc:
    result: NOT_A_READ_PATH
    why: "record_link_click retorna boolean e não devolve dado nenhum de link_clicks. Não há caminho de leitura por ela."
  via_service_role:
    result: OUT_OF_RUNTIME
    why: "SUPABASE_SERVICE_ROLE_KEY não é usada pelo app Next.js — confirmado: só aparece em tests/integration/helpers/admin.ts. .env.example anotado (AC14)."
  verdict: "PASS — nenhum caminho de leitura cross-user encontrado nos três vetores."

