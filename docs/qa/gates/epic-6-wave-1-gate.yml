# ── Concerns / débitos (nenhum bloqueante) ──────────────────
concerns:
  - id: 1
    severity: medium
    category: security
    story: "6.2 → carry-forward 6.3"
    status: deferred_story_6_3
    description: >-
      A view public.link_click_daily é owner `postgres` e NÃO declara security_invoker
      (pg_class.reloptions = null). Views sem security_invoker executam com os
      privilégios do OWNER — e postgres tem rolbypassrls = true. Hoje é inofensivo
      (link_clicks ainda não tem RLS), mas no instante em que a Story 6.3 habilitar
      RLS em link_clicks, a view passará a ser um BYPASS TOTAL dessa RLS: qualquer
      anon com a anon key lerá a agregação de cliques de TODOS os perfis via
      GET /rest/v1/link_click_daily. Além disso, anon tem hoje grants de
      INSERT/UPDATE/DELETE/TRUNCATE na view (default do Supabase).
    recommendation: >-
      Story 6.3 DEVE incluir, na mesma migration que habilitar RLS em link_clicks:
      `alter view public.link_click_daily set (security_invoker = on);` MAIS
      `grant select on public.link_clicks to authenticated;` (senão o analytics
      quebra — é o item 7 do inventário) e `revoke insert, update, delete, truncate
      on public.link_click_daily from anon, authenticated;`. Registrado aqui para
      não se perder entre waves.
  - id: 2
    severity: medium
    category: ops
    story: "6.1 + 6.2"
    status: action_for_devops
    description: >-
      Invalidação de cache ISR em produção. A página pública é ISR (revalidate=60);
      uma falha de policy em prod não falha alto — publica 404 cacheado por 60s. O CD
      (migrate-production) e o deploy da Vercel não são ordenados entre si.
      Risco real é BAIXO (as policies foram verificadas por catálogo E por
      comportamento em dev, e a Wave 1 é puramente aditiva para leitura anônima),
      mas a verificação pós-deploy não é opcional.
    recommendation: >-
      @devops: logo após o merge na main e o deploy, rodar
      `curl -s -o /dev/null -w '%{http_code}' https://youtube-biolink.vercel.app/<username-real>`
      → esperado 200. Se 404, rollback = `alter table public.links disable row level
      security;` (+ profiles) e investigar antes de reabilitar.
  - id: 3
    severity: low
    category: process
    story: "6.2"
    status: resolved_by_gate
    description: >-
      Débito #1 da Story 6.2: o @dev não leu pg_policies/rowsecurity do catálogo e
      substituiu por verificação comportamental, alegando que o token da CLI estava
      cifrado no keychain. A premissa estava ERRADA — o token é armazenado como
      `go-keyring-base64:<base64>` (codificado, não cifrado) e é recuperável com
      `security find-generic-password -s "Supabase CLI" -w | sed 's/go-keyring-base64://' | base64 -d`.
    recommendation: >-
      FECHADO por este gate: o catálogo foi lido e as 7 policies conferem
      caractere a caractere com as migrations (ver bloco catalog_verification).
      Documentar o comando acima para as próximas stories do Epic 6.
  - id: 4
    severity: low
    category: docs
    story: "5.4 (pré-existente) → afeta 6.3"
    status: open
    description: >-
      O cabeçalho de 20260702120000_link_click_daily.sql afirma "A leitura de
      analytics usa a anon key (mesmo client stateless das demais leituras do MVP)".
      É FALSO: app/dashboard/analytics/page.tsx:19 usa createServerClient() com
      cookie de sessão → role `authenticated`. A imprecisão importa porque a Story
      6.3 vai dimensionar grants/policies de link_clicks a partir desse comentário.
    recommendation: >-
      Corrigir o comentário na Story 6.3. Lado bom: como o caminho real é
      `authenticated`, links_select_own já cobre os links inativos no analytics —
      NÃO há regressão de analytics na Wave 1 (verificado pelo gate).
  - id: 5
    severity: low
    category: tests
    story: "6.1 + 6.2"
    status: accepted
    description: >-
      Smoke pela UI autenticada (editar perfil no dashboard; toggle e drag-and-drop
      de reorder em /dashboard/links) não foi executado em nenhuma das duas stories —
      exigiria login com senha no navegador.
    recommendation: >-
      Aceito. A cobertura db-layer usa as formas de query EXATAS das actions
      (UPDATE .eq('id').eq('profile_id') com .select('*'), reorder por id+profile_id),
      lib/actions/links.ts e profile.ts não foram tocados e seus testes seguem verdes.
      Um clique manual no dashboard antes do merge continua recomendado (barato).
  - id: 6
    severity: info
    category: security
    story: "6.1"
    status: accepted_by_design
    description: >-
      Enumeração de usernames e leitura de todas as 8 colunas de profiles via anon key
      permanece possível.
    recommendation: >-
      Sem ação. NÃO é regressão (estado desde o Epic 2), nenhuma coluna é sensível
      (auditadas uma a uma neste gate) e é requisito funcional do signup e da página
      pública. Restringir colunas (view public_profiles / REVOKE por coluna) está
      explicitamente OUT (inventário § 5.1) e seria invenção de requisito (Artigo IV).

blocking_issues: []

decision: >-
  APPROVED — Wave 1 do Epic 6 (RLS Foundation) aprovada. As Stories 6.1 e 6.2 estão
  Done do ponto de vista do quality gate e a branch está liberada para push/PR (@devops).

  O débito central aberto pelo @dev da 6.2 foi FECHADO por este gate: o catálogo de
  development foi lido diretamente (Management API) e as 7 policies conferem
  CARACTERE A CARACTERE com o que as migrations declaram — roles, cmd, USING e
  WITH CHECK. rowsecurity = true em profiles e links, false em link_clicks (correto,
  é 6.3). Nenhuma policy extra, nenhuma RESTRICTIVE, nada anulando a intenção.

  Verificação adicional que nenhuma story fez e que era o maior risco não coberto:
  o gate bloqueante AC5 (owner de handle_new_user) foi confirmado TAMBÉM em
  PRODUÇÃO → postgres / SECURITY DEFINER / BYPASSRLS. Sem isso, o merge poderia
  quebrar o signup inteiro em prod. Está seguro.

  As policies foram auditadas linha a linha em busca de bypass e o gate rodou suas
  PRÓPRIAS probes adversariais contra o dev com a anon key crua (não só os testes do
  @dev): anon não lê link inativo, não o reativa, não deleta, não insere e não
  escreve em profiles; o estado do banco ficou inalterado após todas as tentativas.
  A combinação OR das duas SELECT PERMISSIVE de links foi provada com um link
  inativo real semeado para este gate. profiles_select_public USING (true) é
  correto: as 8 colunas foram auditadas e nenhuma é sensível — não há e-mail nem
  credencial em public.profiles.

  App-layer 100% intacta (NFR3): zero arquivos de lib/, app/ ou components/ no diff
  da branch; 16 filtros de ownership continuam no lugar. A Wave 1 é puramente
  aditiva.

  Gates reproduzidos pelo gate: typecheck PASS, lint PASS, 219/219 testes (+1
  skipped, 36 arquivos), +27 sobre a baseline do Epic 5. Migrations atômicas,
  ordenadas, não destrutivas e com rollback trivial — seguras para o CD aplicar.

  Nenhum issue CRITICAL/HIGH. Os 6 concerns são MEDIUM ou menos e nenhum bloqueia.
  Os dois MEDIUM são acionáveis e estão endereçados: o concern #1 (view
  link_click_daily sem security_invoker) é o achado mais importante deste gate — não
  afeta a Wave 1, mas se torna um BYPASS TOTAL da RLS no momento em que a Story 6.3
  habilitar RLS em link_clicks, e por isso está registrado aqui com a correção
  exata; o concern #2 é o curl de verificação pós-deploy, ação de @devops.

next_actions:
  - owner: "@devops"
    action: "Push da branch + PR. Após o merge e o deploy, curl em /[username] real → esperar 200 (concern #2)."
  - owner: "@dev / @sm (Story 6.3)"
    action: "Incluir na migration de link_clicks: security_invoker=on na view link_click_daily + grant select em link_clicks para authenticated + revoke de escrita na view para anon (concern #1). Corrigir o comentário do cabeçalho da migration da view (concern #4)."
  - owner: "owner do produto"
    action: "Clique manual no dashboard (editar perfil, toggle de link, reorder) antes do merge — barato e fecha o concern #5."
