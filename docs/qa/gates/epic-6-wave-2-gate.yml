# ── Concerns / débitos (nenhum bloqueante) ──────────────────
concerns:
  - id: 1
    severity: medium
    category: security
    story: "6.3 → carry-forward 6.4"
    status: open
    title: "A mitigação planejada para click inflation NÃO fecha o caminho direto à RPC"
    description: >-
      ACHADO CENTRAL DESTE GATE. A story registra corretamente que click inflation
      permanece aberto e aponta a Story 6.4 (rate limiting) como mitigação. O gate
      verificou a 6.4 e a mitigação, COMO PLANEJADA, NÃO FECHA O VETOR.
      A 6.4 aplica `checkRateLimit('track', ...)` DENTRO de `trackLinkClick` — uma
      Server Action do Next.js (AC11/AC12 da 6.4: "Ponto de aplicação: trackLinkClick").
      Mas `record_link_click` é `grant execute to anon` e está exposta pelo PostgREST em
      `POST /rest/v1/rpc/record_link_click`. Um atacante NÃO PRECISA passar pelo Next.js:
      chama a RPC direto com a anon key pública e o rate limiting da 6.4 nunca é avaliado.
      Agravante de desenho: o `subject` do bucket `track` é `hash(ip + ':' + linkId)`, e
      a RPC NÃO TEM ACESSO ao IP do cliente — então a 6.4 não pode simplesmente mover a
      chamada para dentro de record_link_click sem redesenhar a chave do bucket.
    proof: >-
      PROVADO POR PROBE DESTE GATE contra development. Alvo: link ativo real
      a22e0cf2-62f8-4f08-8372-4570b208015d. Contagem antes: 1. Executadas 20 chamadas
      curl diretas a POST /rest/v1/rpc/record_link_click com a anon key, sem tocar no
      app Next.js. Contagem depois: 21 (20 cliques forjados gravados). As 20 linhas da
      probe foram REMOVIDAS ao final (cleanup HTTP 204) e a contagem voltou a 1 —
      estado de development restaurado.
    why_not_blocking: >-
      Não é regressão: o vetor de inflation já existia antes desta story (e era PIOR — o
      INSERT direto aceitava link_id ARBITRÁRIO, inclusive inativo e inexistente). A 6.3
      ESTREITOU o vetor de "qualquer linha em link_clicks" para "apenas links ativos
      legítimos, uma linha por chamada". É progresso real, e o item está explicitamente
      no OUT da story. O problema não é a 6.3 — é o plano da 6.4.
    recommendation: >-
      @pm / @architect: reavaliar a AC de tracking da Story 6.4 ANTES da implementação.
      O rate limiting do bucket `track` precisa ser aplicado DENTRO de
      `record_link_click` (a RPC chamando check_rate_limit), não apenas na Server Action
      — senão a 6.4 fecha o caminho do app e deixa o caminho direto aberto, dando uma
      falsa sensação de mitigação. Como a RPC não enxerga o IP, decidir a chave do
      bucket: (a) o app passa um `p_client_key` já hasheado como parâmetro (atacante
      direto pode forjá-lo, mas o custo sobe), ou (b) bucket por `linkId` apenas
      (defensável: limita inflation por link independentemente da origem), ou (c) aceitar
      formalmente e documentar. Este gate NÃO decide o desenho — sinaliza que a decisão
      precisa ser tomada de forma consciente e não por omissão.
  - id: 2
    severity: low
    category: security
    story: "6.3"
    status: open
    title: "anon manteve GRANT SELECT em link_clicks — assimetria com a própria filosofia da migration"
    description: >-
      O gate leu os grants residuais no catálogo de development:
      link_clicks → anon: SELECT, REFERENCES, TRIGGER.
      A migration revoga insert/update/delete/truncate de anon e authenticated (bloco (e),
      com a justificativa explícita "se um dia alguém adicionar uma policy permissiva por
      engano, o privilégio ainda não estará lá"), mas NÃO revoga o SELECT de `anon`
      (herdado do default do Supabase). Resultado: a proteção de ESCRITA contra anon tem
      duas camadas (RLS + ausência de grant), mas a proteção de LEITURA tem apenas UMA
      (a RLS). O raciocínio do bloco (e) aplica-se identicamente aqui e não foi aplicado.
    impact: >-
      BAIXO e hoje inofensivo — probe do gate confirma GET anônimo em link_clicks → 200
      com [] (nenhuma policy TO anon existe). É um desvio de menor privilégio e de
      consistência interna, não uma vulnerabilidade explorável no estado atual.
    recommendation: >-
      Adicionar `revoke select on public.link_clicks from anon;` numa migration futura do
      Epic 6 (a 6.4 já toca DDL e é o veículo natural). Verificar que não quebra nada: o
      app nunca lê link_clicks como anon (a leitura é do dashboard, `authenticated`; a
      escrita é a RPC, que roda como owner). Os grants residuais REFERENCES e TRIGGER em
      ambas as roles são ruído do default do Supabase, sem impacto prático (exigiriam
      CREATE em schema que essas roles não têm) — revogar junto, por higiene.
  - id: 3
    severity: low
    category: ops
    story: "6.3"
    status: action_for_devops
    title: "Janela não-ordenada entre a migration de produção e o deploy da Vercel"
    description: >-
      Diferente das Waves anteriores, esta story acopla uma mudança de banco a uma
      mudança de CÓDIGO: a partir da migration, o INSERT direto morre e só a RPC grava.
      O job `migrate-production` (.github/workflows/ci.yml, needs: quality, push na main)
      e o deploy da Vercel NÃO são ordenados entre si. Nas duas ordens possíveis há uma
      janela de perda de cliques:
      (a) migration primeiro → o código ANTIGO ainda em produção faz INSERT direto → 401;
      (b) deploy primeiro → o código NOVO chama uma RPC que ainda não existe → erro.
    impact: >-
      BAIXO e auto-curável. Em AMBOS os casos o efeito é idêntico e benigno: `trackLinkClick`
      retorna `{ ok:false }`, fire-and-forget, A NAVEGAÇÃO DO VISITANTE NÃO É AFETADA e
      nenhuma mensagem aparece na UI. O custo é a perda silenciosa de alguns cliques
      durante a janela (minutos). Nenhum dado é corrompido; nada requer rollback. O
      analytics NÃO quebra em nenhuma das ordens (ver migration_safety).
    recommendation: >-
      @devops: após o merge e o deploy, validar o caminho ponta a ponta em produção —
      abrir uma página pública real, clicar num link, e confirmar no dashboard de
      analytics que o clique foi contabilizado. Combinar com o curl do concern #2 do gate
      da Wave 1 (que continua pendente). Se cliques não aparecerem, o diagnóstico mais
      provável é o schema cache do PostgREST: o `notify pgrst` está na migration, mas um
      reload manual pelo painel do Supabase resolve.
  - id: 4
    severity: info
    category: security
    story: "6.3"
    status: accepted
    title: "INSERT anônimo na view retorna 55000 (não-atualizável) em vez de 42501 (permissão)"
    description: >-
      Probe adicional do gate: POST /rest/v1/link_click_daily → HTTP 500, código 55000,
      "Views containing GROUP BY are not automatically updatable". O Postgres avalia
      updatability ANTES do ACL, então a mensagem confirma a um anônimo que a view existe
      e que ela contém um GROUP BY.
    recommendation: >-
      Sem ação. A escrita é impossível por construção (view agregada), o REVOKE está
      correto, e o nome da view já é conhecível por quem tem a anon key. Registrado
      apenas para que a diferença de código não seja confundida com falha de grant numa
      auditoria futura.
  - id: 5
    severity: low
    category: process
    story: "6.3"
    status: open
    title: "AC11 — revisão de DDL pelo @data-engineer ainda não executada"
    description: >-
      A AC11 exige revisão formal de DDL pelo @data-engineer das funções/policies
      SECURITY DEFINER. A DoD da story registra o item como pendente (o @dev a
      solicitou; é trabalho de outro agente). Não bloqueia este gate.
    recommendation: >-
      Mitigado na prática: ESTE gate executou a auditoria adversarial da superfície de
      ataque da RPC vetor a vetor (ver rpc_attack_surface_audit) e confirmou os três
      controles obrigatórios diretamente no catálogo — search_path fixo, PUBLIC revogado
      (ausência de `=X/postgres` no proacl) e grant explícito mínimo. Nenhum achado. A
      revisão do @data-engineer, se executada, deve ser confirmatória. @pm: decidir se a
      AC11 é formalmente dispensada ou se a Wave 2 aguarda a revisão.
  - id: 6
    severity: low
    category: tests
    story: "6.3"
    status: accepted
    title: "Smoke pela UI real não executado"
    description: >-
      O smoke do @dev (T8) verificou que `pnpm dev` sobe e que as rotas respondem
      (200/200/307), mas NÃO houve clique real num link da página pública renderizada nem
      login no dashboard de analytics pelo navegador — o mesmo débito do concern #5 do
      gate da Wave 1.
    recommendation: >-
      Aceito. A cobertura db-layer usa as formas de query EXATAS do produto e a suíte de
      integração roda contra o banco de development real (não mocks), incluindo os
      helpers de analytics com client autenticado. Um clique manual antes do merge
      continua recomendado — barato e fecha junto com o concern #3.

