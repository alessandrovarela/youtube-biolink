# ════════════════════════════════════════════════════════════════════════════
decision: >-
  PASS_WITH_CONCERNS — o Epic 6 está APROVADO para merge, condicionado às 6
  precondições BLOCKING de provisionamento (PRE-M1..PRE-M6), que são de
  @devops e não de código.

  O epic entrega o que prometeu, e entrega verificadamente. Os dois débitos
  nominais que ele veio fechar estão FECHADOS e eu os reproduzi, não os aceitei
  de relatório: o INSERT anônimo em link_clicks retorna 42501 em dev (e ainda
  passa em prod hoje — sonda feita, o débito está VIVO lá até o merge), e o
  click inflation por curl direto foi barrado exatamente no 61º de 66 disparos.
  Os 4 targets do NFR18 batem ao número. As 3 tabelas multi-tenant têm RLS
  efetiva e a app-layer não perdeu uma única linha de autorização — verifiquei
  no diff, não na descrição. O contraste do accent foi corrigido pelo método
  certo (OKLCH, croma preservado) e blindado na CI.

  O que me impede de assinar PASS puro são três coisas, nenhuma delas defeito
  de implementação:

  (1) DUAS ACEITAÇÕES DEPENDEM DE OLHOS HUMANOS E NINGUÉM AS FEZ. A AC7 da 6.6
  exige ver os 3 temas renderizados; três agentes em sequência declararam
  honestamente que não conseguiram. E o smoke manual do owner — que o contrato
  do final gate lista como ponto 6 — não só não foi executado como, do jeito que
  o roteiro está escrito hoje, PASSARIA IDÊNTICO com toda a segurança do epic
  desligada. Um smoke que não distingue os dois estados não prova nada sobre
  este epic. Especifiquei as 6 mudanças (SMOKE-A..F) que o tornam capaz de
  provar; sem elas, re-executá-lo é teatro.

  (2) A PARTE MAIS FRÁGIL DO EPIC SÓ EXISTE COMO PREDIÇÃO EM PRODUÇÃO. Todo o
  rate limiting depende de que o owner das funções SECURITY DEFINER tenha
  BYPASSRLS para escrever numa tabela com RLS ligada e zero policy. Em dev isso
  é fato observado. Em prod é inferência — e o modo de falha é o pior possível:
  o `exception when others` engole o erro, o limiter libera tudo, e nenhum sinal
  fica vermelho. Um produto que se declara protegido sem estar é pior que um que
  se sabe desprotegido. Por isso PRE-M7 não é opcional.

  (3) O RISCO REAL DESTE MERGE NÃO ESTÁ NO CÓDIGO, ESTÁ NO PROVISIONAMENTO. E
  ele tem uma armadilha específica que quase ninguém pega: o job `quality` do CI
  não declara `environment:`, então um RATE_LIMIT_PEPPER criado apenas no
  environment `production` do GitHub fica invisível para ele — a CI falha, e
  como `migrate-production` tem `needs: quality`, as migrations NÃO são
  aplicadas. Resultado: main mergeada, código novo no ar, schema antigo no
  banco. É o cenário que mais me preocupa em todo o epic, e ele se evita com um
  `gh secret set` no escopo certo. Some-se a isso que a CSP passou a depender de
  NEXT_PUBLIC_SUPABASE_URL em TEMPO DE BUILD — dependência nova, silenciosa, e
  cujo modo de falha é o login quebrar no browser sem um único erro de servidor.

  Sobre a ordem das migrations, que era a pergunta aberta mais séria: sondei o
  banco de produção e a resposta é tranquilizadora por um motivo específico e
  temporário — prod tem 1 profile e ZERO cliques. As 5 migrations são aditivas,
  não fazem backfill, e a única cadeia de dependência não-óbvia (o revoke de
  check_rate_limit versus a chamada interna feita por record_link_click) está
  provada no estado final em dev. A janela não-ordenada entre CD e deploy é
  real, mas em ambas as ordens a única vítima é o tracking, e não há tráfego
  para perder. Este argumento expira no momento em que produção tiver volume.

  Recomendo mergear. Recomendo com mais ênfase ainda que PRE-M7 seja executado
  na mesma sessão do merge, e que o smoke atualizado seja rodado antes de
  qualquer declaração de 'publicável em produção aberta'. O epic promoveu o
  produto de funcional para defensável; declará-lo publicável é uma afirmação
  sobre produção, e produção ainda não foi observada.

