blocking_issues: []

decision: >-
  CONCERNS — Wave 2 do Epic 6 (Tracking Hardening) APROVADA PARA MERGE com 6 concerns
  documentados, NENHUM bloqueante. A Story 6.3 está Done do ponto de vista do quality
  gate e a branch está liberada para push/PR (@devops).

  O QUE FOI ENTREGUE, PROVADO POR ESTE GATE E NÃO PELO RELATÓRIO DO @dev: as 7 probes
  adversariais foram reproduzidas do zero com a anon key crua contra o PostgREST de
  development, e o catálogo foi lido diretamente pela Management API. Os dois furos
  contratados estão FECHADOS. (1) O concern MEDIUM herdado do gate do Epic 5 —
  POST /rest/v1/link_clicks com a anon key → 401 permission denied; UPDATE e DELETE
  idem (probe de UPDATE em massa é adicional deste gate, o @dev não a reportou).
  A tabela é append-only DE VERDADE agora, e nem o próprio dono escreve direto.
  (2) O concern #1 do gate da Wave 1, o vazamento ATIVO — GET /rest/v1/link_click_daily
  anônimo → 401. A view tem security_invoker=on e anon perdeu todos os grants.

  CONFIRMAÇÃO QUE REFORÇA A URGÊNCIA DO MERGE: o preflight de PRODUÇÃO executado por
  este gate mostra que AMBOS os furos estão ATIVOS EM PROD NESTE MOMENTO — anon tem
  INSERT/SELECT/UPDATE/DELETE/TRUNCATE em link_clicks E na view, e a view não tem
  security_invoker. A Wave 2 não introduz risco em produção; ela remove um risco que
  está de pé hoje. A migration aplicará limpo (a view existe com owner postgres e
  reloptions null; os grants que ela revoga existem de fato) e o analytics de produção
  NÃO quebra, porque já roda como `authenticated` e o grant na tabela base está na
  mesma migration atômica.

  A RPC foi AUDITADA COMO SUPERFÍCIE DE ATAQUE, vetor a vetor, por ser SECURITY DEFINER
  com grant execute to anon — executável por qualquer pessoa na internet. Injeção de SQL:
  impossível (plpgsql sem SQL dinâmico, parâmetros tipados usados só como bind).
  search_path hijack: bloqueado (search_path=public fixo, confirmado em proconfig).
  Escalada de privilégio: não há (a função só insere em link_clicks e o resultado
  continua sujeito à RLS na leitura). user-agent gigante: coberto pelo left(...,120)
  dentro da função. Enumeração pelo retorno boolean: analisado e DESCARTADO — links
  ativos já são publicamente listáveis por design (links_select_public_active), e
  inexistente/inativo colapsam ambos em false, sem oracle. Os três controles
  obrigatórios do ADR-001 § 4 foram confirmados no catálogo, incluindo a AUSÊNCIA da
  entrada PUBLIC (=X/postgres) no proacl, que prova que o revoke pegou.

  O CONTRATO FIRE-AND-FORGET ESTÁ PRESERVADO. trackLinkClick nunca lança (try/catch
  intacto, três caminhos de falha retornando ActionResult), a navegação nunca é
  bloqueada, e TrackedLink.tsx não foi tocado — o diff de runtime da branch inteira é
  UM arquivo. O refactor ainda elimina a janela TOCTOU e corta 2 round-trips para 1.

  A CORREÇÃO DOS TESTES FOI AUDITADA CONTRA MASCARAMENTO e está CORRETA. O gate
  procurou especificamente a fraude mais provável — trocar o client anon por
  createAdminClient(), que bypassa RLS e tornaria os testes tautológicos. NÃO
  ACONTECEU: os três arquivos autenticam de verdade via signInWithPassword, que é o
  caminho real do produto. O service role aparece só em setup/teardown e releituras
  autoritativas. Os testes ficaram MAIS FORTES: o isolamento entre perfis passou a
  usar dois clients autenticados independentes e a ler SEM filtro app-layer — virou
  teste REAL de RLS, não do .eq().

  Gates reproduzidos: typecheck exit 0, lint exit 0, 233 testes passed + 1 skipped em
  37 arquivos (12.06s). Batem EXATAMENTE com o reportado pelo @dev. Progressão do
  projeto: 192 (Epic 5) → 219 (Wave 1) → 233 (Wave 2).

  POR QUE CONCERNS E NÃO PASS: as 18 ACs estão cumpridas e nada nesta story está
  errado. O veredito reflete um achado adversarial sobre o FUTURO, não sobre a entrega.
  O gate provou por probe (20 cliques forjados gravados num link ativo real, via curl
  direto na RPC, sem tocar no Next.js; estado restaurado depois) que o débito de click
  inflation carregado para a Story 6.4 tem uma MITIGAÇÃO PLANEJADA QUE NÃO O FECHA: a
  6.4 aplica rate limiting dentro da Server Action trackLinkClick, mas a RPC é
  `grant execute to anon` e chamável direto pelo PostgREST, contornando o app inteiro.
  Pior, a chave do bucket é hash(ip+linkId) e a RPC não enxerga o IP — não dá para só
  mover a chamada para dentro dela. Deixar isso implícito faria a 6.4 fechar a porta da
  frente e declarar vitória com a porta dos fundos aberta. A decisão de desenho é do
  @pm/@architect e precisa ser tomada CONSCIENTEMENTE, antes da implementação da 6.4 —
  é para isso que este concern existe.

  A decisão #1 do @dev (não editar a migration já aplicada em prod, reregistrando a
  correção em dois lugares vivos) está CORRETA e endossada: o schema_migrations registra
  a versão, não o conteúdo, então a edição não seria reaplicada em lugar nenhum e só
  criaria divergência entre o git e o que rodou nos bancos — num projeto didático, o
  precedente errado custa mais que o comentário. O concern #4 da Wave 1 fica reclassificado
  como resolvido por reregistro.

