# ── AC4/AC5: o matcher, que é o risco central ───────────────
matcher_verification:
  method: >-
    curl real contra build de PRODUÇÃO (pnpm build && pnpm start). A prova é estrutural e
    não depende de instrumentação: o middleware redireciona INCONDICIONALMENTE quando não
    há usuário, então QUALQUER resposta 200 anônima é prova de que ele NÃO foi invocado
    naquele path.
  results:
    - { path: "/dashboard",            result: "307 → /login?next=%2Fdashboard",            middleware_ran: true }
    - { path: "/dashboard/links",      result: "307 → /login?next=%2Fdashboard%2Flinks",    middleware_ran: true }
    - { path: "/dashboard/analytics",  result: "307 → /login?next=%2Fdashboard%2Fanalytics", middleware_ran: true }
    - { path: "/alessandrovarela",     result: "200 OK (perfil real)",                      middleware_ran: false }
    - { path: "/login",                result: "200 OK",                                    middleware_ran: false }
    - { path: "/signup",               result: "200 OK",                                    middleware_ran: false }
    - { path: "/health",               result: "200 OK",                                    middleware_ran: false }
    - { path: "/reset-password",       result: "200 OK",                                    middleware_ran: false }
    - { path: "/auth/callback",        result: "307 → /auth/confirm-failed (lógica própria da rota, NÃO /login)", middleware_ran: false }
    - { path: "/_next/static/chunks/0zoa._yun3_11.js", result: "200 OK · Cache-Control: public, max-age=31536000, immutable", middleware_ran: false }
  verdict: PASS
  reasoning: >-
    O matcher positivo e enumerado (`/dashboard/:path*`) faz exatamente o que a story
    contratou. `/auth/callback` é o caso mais importante da lista: ele responde com a
    própria lógica (confirm-failed por code inválido) e NÃO com o /login do middleware —
    o fluxo de troca de code por sessão está intacto. Os assets mantêm o
    `immutable` de 1 ano, sem custo de invocação edge.

  bypass_attempts:
    method: "9 variantes de path com --path-as-is contra o build de produção."
    results:
      - { path: "/dashboard/",             result: "308 → /dashboard (normaliza, depois barra)" }
      - { path: "/Dashboard",              result: "404" }
      - { path: "/DASHBOARD",              result: "404" }
      - { path: "/dashboard//links",       result: "308 → /dashboard/links" }
      - { path: "//dashboard",             result: "308 → /dashboard" }
      - { path: "/dashboard/links/",       result: "308 → /dashboard/links" }
      - { path: "/dashboard/../dashboard", result: "307 → /login (barrado)" }
      - { path: "/dashboard%2Flinks",      result: "307 → /login (barrado)" }
      - { path: "/./dashboard",            result: "307 → /login (barrado)" }
      - { path: "/dashboard?_rsc=abc + header RSC:1", result: "307 → /login (barrado)" }
    verdict: NO_BYPASS_FOUND
    reasoning: >-
      O Next normaliza o path ANTES de avaliar o matcher, então as variantes com barra
      dupla, barra final e path traversal convergem para a forma canônica e são
      capturadas. Nenhuma variante alcançou conteúdo do dashboard. Testei também a
      requisição RSC (`?_rsc=` + header `RSC: 1`), que é o vetor sutil — um matcher que
      só cobrisse o documento HTML deixaria o payload RSC exposto. Está coberto.
    note: >-
      `/Dashboard` dá 404 e não redirect: o matcher é case-sensitive, mas o roteador do
      Next também é, então não existe rota a proteger ali. Não é bypass.

