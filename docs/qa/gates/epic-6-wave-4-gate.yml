# ── AC2/AC6: guard e refresh COM SESSÃO REAL ────────────────
# O @dev nunca renderizou o dashboard autenticado. Este gate renderizou.
authenticated_session_verification:
  why_it_matters: >-
    O @dev verificou apenas o caminho ANÔNIMO (redirect). O caminho POSITIVO — usuário
    válido passa, e o token é renovado — nunca foi exercido em runtime por ninguém antes
    deste gate. Sem isso, um middleware que redirecionasse TODO MUNDO (inclusive
    autenticados) passaria em todos os testes do @dev.
  method: >-
    Usuário de probe criado via admin API (service role) com user_metadata.username
    (exigido pelo trigger handle_new_user). Login pelo caminho REAL do produto
    (POST /auth/v1/token?grant_type=password com a ANON key). Cookie de sessão montado no
    formato do @supabase/ssr 0.10.3 (`sb-<ref>-auth-token` = 'base64-' + base64(JSON)).
  ac2_positive_path:
    results:
      - { path: "/dashboard",           result: "200 OK · 15917 bytes de HTML" }
      - { path: "/dashboard/links",     result: "200 OK · 11888 bytes" }
      - { path: "/dashboard/analytics", result: "200 OK · 17432 bytes" }
    verdict: PASS
    note: "O guard deixa passar sessão válida. A metade positiva da AC2 está PROVADA pela primeira vez."
  ac6_proactive_refresh:
    method: >-
      Cookie remontado com o access_token EXPIRADO (expires_at 120s no passado) e o
      refresh_token VÁLIDO — a condição exata que a AC6 descreve.
    results:
      http: "200 OK (a navegação NÃO caiu para /login)"
      set_cookie_emitted: "sb-rjsvkwjgsctqsswrospx-auth-token=base64-eyJhY2Nlc3NfdG9rZW4i…"
      new_access_token_differs_from_original: true
      new_expires_at_in_future: true
    verdict: PASS
    reasoning: >-
      PROVA EMPÍRICA DIRETA do refresh proativo. O middleware detectou a expiração, trocou
      o refresh_token por um access_token NOVO, propagou o Set-Cookie ao browser e serviu
      o dashboard — o usuário não precisou refazer login. A AC5 deferida da Story 2.9
      (L494) está fechada com prova de comportamento, não com leitura de código. Confirma
      também que o padrão de reatribuição do `response` dentro de `setAll` está correto:
      se o response não fosse recriado, o cookie novo não chegaria ao browser.

# ── AC7: CSP nos 3 temas — o gap que o @dev sinalizou ───────
ac7_csp_browser_validation:
  browser_available_to_qa: false
  evidence: "`list_connected_browsers` retornou [] também para este gate — mesma limitação do @dev."
  explicit_statement: >-
    ⚠️ DECLARO EXPLICITAMENTE: eu TAMBÉM não consegui observar o console de um browser
    real. A AC7, na sua redação literal ("o console do browser está limpo"), permanece
    NÃO VERIFICADA POR OBSERVAÇÃO DIRETA após este gate. Não vou classificar como
    verificada aquilo que não observei.
  what_this_gate_did_beyond_the_dev:
    - >-
      RENDERIZOU O DASHBOARD AUTENTICADO — que o @dev declarou que "nunca foi renderizado".
      As 3 rotas de dashboard foram servidas com sessão real e o HTML auditado.
    - >-
      RENDERIZOU OS 3 TEMAS. O tema vem de profiles.theme; alterei-o via service role para
      light, dark e accent e re-renderizei /dashboard em cada um.
  theme_matrix:
    rows:
      - { theme: light,  bytes: 15917, inline_scripts: 6, external_resources: 0 }
      - { theme: dark,   bytes: 15984, inline_scripts: 7, external_resources: 0 }
      - { theme: accent, bytes: 15987, inline_scripts: 7, external_resources: 0 }
    note: >-
      dark e accent acrescentam 1 script inline (o anti-flash do ThemeProvider, Story 4.3)
      — coberto por `script-src 'unsafe-inline'`. ZERO recursos externos em qualquer tema.
  authenticated_html_audit:
    method: "Enumeração de todo construto que carrega recurso no HTML das 3 rotas autenticadas."
    findings:
      - { route: "/dashboard",           script_src_externo: 0, stylesheet_externo: 0, script_inline: 6,  style_tag: 0, style_attr: 14, svg_inline: 1, img_externo: 0 }
      - { route: "/dashboard/links",     script_src_externo: 0, stylesheet_externo: 0, script_inline: 6,  style_tag: 0, style_attr: 1,  svg_inline: 0, img_externo: 0 }
      - { route: "/dashboard/analytics", script_src_externo: 0, stylesheet_externo: 0, script_inline: 10, style_tag: 0, style_attr: 1,  svg_inline: 0, img_externo: 0 }
    verdict: NO_VIOLATION_SURFACE_FOUND
    reasoning: >-
      Todo `<script src>` e `<link rel=stylesheet>` aponta para /_next/* (⊂ 'self'). Os
      atributos `style=` (14 em /dashboard) estão cobertos por `style-src 'unsafe-inline'`.
      O SVG inline do gráfico (Story 5.5) não carrega recurso externo. Zero host externo em
      posição de carregamento. Não existe, no HTML servido, nenhum recurso que a CSP
      entregue fosse bloquear.
  residual_gap_severity: low
  severity_reasoning: >-
    Classifico como LOW, e não medium, e explico por quê — a preocupação legítima é que
    "uma CSP mal calibrada quebra o dashboard SILENCIOSAMENTE no browser enquanto o build
    passa". Essa preocupação é real, mas ela se materializa através de RECURSOS QUE O
    BROWSER TENTA CARREGAR E A POLICY RECUSA. A superfície inteira desses recursos está
    agora enumerada no HTML REALMENTE SERVIDO das 5 rotas × 3 temas, incluindo as
    autenticadas, e ela é integralmente coberta pela policy. O que resta fora de alcance é
    estreito e o registro honestamente: comportamento que só existe em runtime de browser —
    um `eval()` dentro de um chunk exercitado apenas por interação (dnd-kit em drag ativo),
    uma requisição `fetch`/WebSocket disparada por evento de usuário, ou um recurso
    injetado dinamicamente por JS. `connect-src` já libera o domínio Supabase (REST e wss),
    que é o único destino de rede do produto. O risco não é zero, mas é bem menor do que
    "não verificado" sugere.
  recommendation: >-
    Manter como precondição pós-merge, não como bloqueio: abrir as 5 rotas × 3 temas com o
    console aberto (10 minutos), incluindo UM drag de link e UMA troca de período no
    gráfico de analytics — que são as duas interações que exercitam código não coberto pela
    análise estática. Consolidar com a verificação pós-deploy já pendente das Waves 1 e 2.

