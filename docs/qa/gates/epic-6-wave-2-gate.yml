# ── Resultado por story ─────────────────────────────────────
stories:
  - id: "6.3"
    title: "RLS em link_clicks + hardening da view link_click_daily + refactor do tracking"
    verdict: CONCERNS
    acs_met: "18/18"
    note: >-
      Todas as 18 ACs verificadas de forma independente por este gate (probes próprias
      com a anon key crua + leitura direta do catálogo, não os números do @dev). O
