# ============================================================
# EPIC 6 — Segurança em Camadas & Hardening
# Execution Plan — Wave-Based Development (YOLO)
#
# Template: epic-orchestration.yaml
# Generated by: @pm (Morgan)
# Source: docs/prd.md — Epic 6 (linha 230) + referências de deferimento
#         (FR21 L66, NFR3 L75, NFR18 L90, Section 4 L185, L303, Stories
#         2.2 L386-388, 2.3 AC6, 2.4 AC6, 2.5 AC6, 2.9 L486/494, 3.1 AC3,
#         5.1 AC3, 5.2 AC5) + débitos dos QA gates dos Epics 4 e 5.
# ============================================================

execution:
  epicId: EPIC-6
  epicTitle: "Segurança em Camadas & Hardening"
  epicGoal: >-
    Promover o produto de "funcional" (MVP, Epics 1-5) para "publicável em
    produção aberta": reintroduzir como unidades didáticas dedicadas os
    controles deferidos no MVP — RLS em profiles/links/link_clicks
    (defense-in-depth sobre a authz app-layer), rate limiting em endpoints
    sensíveis e no tracking, e middleware edge (auth guard + CSP formal +
    refresh proativo de token). Fecha também os débitos de a11y/design do
    Epic 4 (contraste do tema accent). Ao final, toda tabela multi-tenant
    tem RLS com policies que replicam e reforçam a app-layer (NFR3), e o
    concern MEDIUM do gate do Epic 5 (INSERT anônimo em link_clicks via
    PostgREST) está eliminado.

  storyBasePath: "docs/stories"
  template: "epic-orchestration"
  mode: yolo  # solicitado pelo owner (padrão dos Epics 3-5)

  # ──────────────────────────────────────────────────────────
  # DECISÕES DE ESCOPO (reconciliação pré-execução — ratificar)
  # ──────────────────────────────────────────────────────────
  #
  # 1. ESTRATÉGIA DO INSERT DE TRACKING PÓS-RLS (Story 6.3) — decisão do
  #    @architect (contratada no PRD L716). Duas rotas válidas:
  #      a) RPC `security definer` (função SQL que insere validando is_active)
  #         → zero env novo em runtime, superfície mínima. RECOMENDADA
  #         (princípio zero-dep/superfície mínima do projeto).
  #      b) `createAdminClient` com SUPABASE_SERVICE_ROLE_KEY (PRD L185/L303
  #         prevê a introdução no Epic 6) → ensina o padrão admin client,
  #         mas coloca a service key no runtime do app.
  #    O @architect ratifica na Wave 2; se (b), @devops adiciona a env no
  #    Vercel (prod + preview) ANTES do merge. `.env.example` já tem o
  #    placeholder (linha 55).
  #
  # 2. TECNOLOGIA DE RATE LIMITING (Story 6.4) — decisão do @architect
  #    (contratada no PRD NFR18). Targets fixos: signup 5/h/IP; login
  #    10/15min/IP; reset 3/h/IP; tracking 60/min/IP/linkId.
  #    RECOMENDAÇÃO: Supabase-native (tabela de contadores + RPC/função com
  #    janela deslizante) — zero dependência nova (sem Upstash/Vercel KV),
  #    consistente com o princípio do projeto. Alternativas ficam a critério
  #    do @architect se a opção nativa provar-se insuficiente.
  #
  # 3. REWRITE `/@username` NO MIDDLEWARE (Story 6.5) — OPCIONAL/stretch no
  #    PRD ("opcionalmente rewrite"). Fica FORA do DoD da story; entra só se
  #    o middleware base (auth guard + CSP + refresh) estiver verde e o
  #    esforço restante for trivial. Não bloqueia o epic.
  #
  # 4. DÉBITOS DO EPIC 4 ENTRAM COMO STORY 6.6 (pedido do owner: "demais
  #    pendências"). Origem: QA gate epic-4 (concerns #1, #2, #3):
  #      - Escurecer --color-accent do tema accent até accent-fg/accent
  #        ≥ 4.5:1 (hoje 3.12:1) — token, afeta Button primary no dashboard.
  #      - Elevar o limiar do par em a11y-contrast.test.ts de 3.0 → 4.5
  #        (tests/unit/a11y-contrast.test.ts:78-80) para a CI barrar regressão.
  #      - Alinhar o swatch de preview do tema accent ao canvas real
  #        (#FAF7F2 vs #EDD3A9) — usar a skill `biolink-design` como
  #        referência; registrar a mudança na referência de design (Artigo IV
  #        — a correção É a atualização da referência, não invenção).
  #      - Stretch: preserveAspectRatio do gráfico SVG ('xMidYMid meet') —
  #        concern info do gate epic-5, cosmético.
  #
  # 5. ORDEM DE ATIVAÇÃO DA RLS — habilitar RLS numa tabela em uso é mudança
  #    de comportamento em produção. Cada story de RLS (6.1-6.3) DEVE:
  #      a) criar as policies E habilitar RLS na MESMA migration (nunca
  #         habilitar sem policy → lockout);
  #      b) manter os filtros app-layer existentes (defense-in-depth, NFR3 —
  #         não remover o que já funciona);
  #      c) rodar suíte completa + `pnpm dev` + verificação manual da página
  #         pública anônima (ISR) e do dashboard após aplicar em development;
  #      d) migration segue o CD `migrate-production` no merge da main
  #         (padrão Epic 3+) — nenhum passo manual em prod.
  #
  # 6. NÃO-ESCOPO: migrations antigas sem IF NOT EXISTS (concern info do
  #    gate epic-5 — aceito, tracking do Supabase garante execução única);
  #    SMTP customizado; captcha; WAF. Não inventar controles fora do PRD.
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # OWNER PREREQUISITES (fechamento formal do MVP — herdados da
  # Story 5.6; NÃO bloqueiam a implementação do Epic 6, bloqueiam a
  # declaração v0.1.0/v1.0. Rodar em paralelo ao epic.)
  # ──────────────────────────────────────────────────────────
  owner_prerequisites:
    - id: "OWN-1"
      task: >-
        Owner executa docs/smoke-test.md ponta a ponta (inclui e2e do reset
        de senha por e-mail — débito da retro do Epic 3). IDEAL: rodar ANTES
        do Epic 6 (baseline) e DE NOVO após (regressão de RLS/rate-limit).
      blocks: ["mvp-declaration"]
    - id: "OWN-2"
      task: >-
        3 reproduções externas do setup local (issues/discussion no GitHub)
        — Story 5.6 AC4. Assíncrono.
      blocks: ["mvp-declaration"]
    - id: "OWN-3"
      task: >-
        @devops (exclusivo): tag v0.1.0 na main + promover Change Log do PRD
        para versão 1.0 (Story 5.6 AC5). Fazer ANTES do merge do Epic 6 —
        a tag marca o MVP; o Epic 6 é pós-MVP (v0.2.0 candidato).
      blocks: ["mvp-declaration"]
    - id: "OWN-4"
      task: >-
        @sm: retrospectiva do Epic 5 → docs/retrospectives/epic-5.md (ainda
        não escrita; epics 1, 3 e 4 têm). Lições alimentam este epic.
      blocks: []

  # ──────────────────────────────────────────────────────────
  # PRÉ-REQUISITOS TÉCNICOS (bloqueiam a Wave 1 — fazer ANTES)
  # ──────────────────────────────────────────────────────────
  technical_prerequisites:
    - id: "PRE-1"
      task: >-
        @architect ratifica as decisões #1 (security definer vs admin client
        p/ tracking) e #2 (tecnologia de rate limiting) e registra em
        docs/architecture/ (ADR curto ou seção). Sem isso, 6.3 e 6.4 não
        têm design fechado.
      owner: "@architect"
      blocks: ["6.3", "6.4"]
    - id: "PRE-2"
      task: >-
        Inventário de policies: mapear TODAS as queries existentes por tabela
        (Server Actions + RSC + página pública ISR) para derivar as policies
        exatas de 6.1/6.2/6.3. Grep por createServerClient/createPublicClient
        usage. Evita policy que quebra query em produção.
      owner: "@dev (dentro da Wave 1)"
      blocks: ["6.1", "6.2"]
    - id: "PRE-3"
      task: >-
        Se decisão #1 = admin client: @devops adiciona SUPABASE_SERVICE_ROLE_KEY
        nos ambientes Vercel (production/preview) e documenta em .env.example
        que a chave NUNCA vai para NEXT_PUBLIC_*. Condicional.
      owner: "@devops"
      blocks: ["6.3"]

  # ──────────────────────────────────────────────────────────
  # STORIES
  # ──────────────────────────────────────────────────────────
  stories:
    - id: "6.1"
      file: "6.1.story.md"
      title: "RLS policies em `profiles`"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 3
      executor: "@dev"
      quality_gate: "@data-engineer"
      dependencies: []
      notes: >-
        Origem: Story 2.2 (migrada na reconciliação PRD v1.1, L386-388).
        Migration habilita RLS em profiles + policies: SELECT público (página
        /@username lê profile anonimamente — ISR), UPDATE/INSERT own
        (id = auth.uid()). DDL revisada por @data-engineer. App-layer intacta
        (decisão #5b). Testes cross-user existentes continuam passando; NOVO
        teste de integração valida a policy no banco (query direta com anon
        key não altera profile alheio). Aplica em development via db push;
        prod via CD no merge.

    - id: "6.2"
      file: "6.2.story.md"
      title: "RLS policies em `links`"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 4
      executor: "@dev"
      quality_gate: "@data-engineer"
      dependencies: ["6.1"]
      notes: >-
        Origem: PRD Story 3.1 AC3 (L529) — policies nominais contratadas:
        links_select_public_active (anon lê só is_active=true),
        links_select_own, links_insert_own, links_update_own,
        links_delete_own (profile_id = auth.uid()). ATENÇÃO: o dashboard
        lista links inativos do dono → select_own NÃO filtra is_active;
        a pública anônima SÓ vê ativos. Validar página pública ISR + reorder
        + toggle ativo/inativo após aplicar. Teste de integração: anon key
        não lê link inativo nem escreve.

    - id: "6.3"
      file: "6.3.story.md"
      title: "RLS em `link_clicks` + refactor do tracking"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["6.2"]
      notes: >-
        Origem: PRD 5.1 AC3 (L702) + 5.2 (L716) + concern MEDIUM do gate
        epic-5 (INSERT anônimo via PostgREST). Migration habilita RLS em
        link_clicks: INSERT negado ao anon/authenticated direto; SELECT own
        via join com links (profile_id = auth.uid()); UPDATE/DELETE negados
        (append-only). Refatorar lib/actions/track-click.ts conforme decisão
        #1 (@architect, PRE-1): RPC security definer (recomendada) ou
        createAdminClient (PRE-3). Preservar contrato: valida is_active,
        nunca lança, fire-and-forget (5.2/5.3 intactas). Teste-chave: INSERT
        direto com anon key via PostgREST retorna erro (fecha o débito);
        tracking real continua gravando; analytics dashboard segue funcional.

    - id: "6.4"
      file: "6.4.story.md"
      title: "Rate limiting (signup, login, reset, tracking)"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["6.3"]
      notes: >-
        Origem: FR21 (L66) + NFR18 (L90) + ACs deferidas 2.3/2.4/2.5/5.2.
        Targets: signup 5/h/IP; login 10/15min/IP; reset 3/h/IP; tracking
        60/min/IP/linkId. Implementação conforme decisão #2 (PRE-1;
        recomendada: Supabase-native, contadores + função com janela
        deslizante, zero dep nova). Resposta ao estouro: erro genérico
        amigável (não vazar o mecanismo); tracking estourado = no-op
        silencioso (nunca quebra navegação — contrato 5.2). IP: usar headers
        da Vercel (x-forwarded-for / x-real-ip), SEM persistir IP raw
        (NFR19 — hash/truncar se precisar armazenar). Testes unit da janela
        + integração dos 4 endpoints.

    - id: "6.5"
      file: "6.5.story.md"
      title: "Middleware edge: auth guard + CSP formal + refresh de token"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Origem: PRD 2.9 reconciliação v1.2 (L486, L494) + Epic 6 (L230).
        Criar middleware.ts raiz (matcher: /dashboard/*): auth guard edge
        (redirect /login) SOMANDO ao guard de layout existente (defense-in-
        depth — não remover o layout guard), refresh proativo de token
        (@supabase/ssr middleware pattern), e headers de segurança formais:
        CSP (compatível com Next.js 15 — inline styles do SVG/Tailwind,
        domínio Supabase em connect-src), X-Frame-Options/frame-ancestors,
        X-Content-Type-Options, Referrer-Policy. CSP em Report-Only primeiro
        se necessário para calibrar. Rewrite /@username = stretch (decisão
        #3, fora do DoD). CUIDADO: matcher NÃO pode interceptar /_next,
        assets, nem a página pública ISR (custo edge + cache). `pnpm dev`
        sobe + pública anônima + login flow verificados.

    - id: "6.6"
      file: "6.6.story.md"
      title: "Débitos de a11y/design do Epic 4 (tema accent)"
      status: pending
      branch: "feature/epic-6-security"
      complexity: 2
      executor: "@dev"
      quality_gate: "@ux-design-expert"
      dependencies: []
      notes: >-
        Origem: QA gate epic-4 concerns #1/#2/#3 (decisão #4). Escurecer
        --color-accent do tema accent até accent-fg/accent ≥ 4.5:1 (hoje
        3.12:1); elevar limiar do teste em tests/unit/a11y-contrast.test.ts
        de 3.0 → 4.5 (o teste passa a barrar regressão na CI); alinhar
        swatch de preview do tema accent ao canvas real (skill
        biolink-design como referência de design — atualizar a referência
        junto, Artigo IV). Stretch: preserveAspectRatio 'xMidYMid meet' no
        gráfico SVG (gate epic-5, cosmético). Verificação visual nos 3 temas
        (dashboard + pública) via pnpm dev.

  # ──────────────────────────────────────────────────────────
  # WAVES
  # ──────────────────────────────────────────────────────────
  #
  # Estrutura de dependências:
  #   Wave 1: [6.1, 6.2]   — RLS nas tabelas de identidade e links (6.2 após
  #                          6.1: mesmo padrão, policies de links referenciam
  #                          o aprendizado de profiles)
  #   Wave 2: [6.3]        — RLS link_clicks + refactor tracking (requer
  #                          PRE-1; fecha o débito MEDIUM do gate epic-5)
  #   Wave 3: [6.4]        — rate limiting (requer PRE-1; toca os mesmos
  #                          endpoints que 6.3 refatorou)
  #   Wave 4: [6.5, 6.6]   — middleware edge/CSP e débitos de design; áreas
  #                          disjuntas (middleware.ts vs globals.css/testes)
  #                          → paralelas em teoria
  #
  # NOTA DE EXECUÇÃO (lição Epics 3-5): em YOLO, subagentes rodam SEQUENCIAIS
  # no mesmo working tree respeitando dependências; paralelização "real"
  # (worktrees) colapsada para evitar gotcha de merge. Waves = ordem lógica.
  # Branch única feature/epic-6-security a partir de main (padrão Epic 5).
  # ──────────────────────────────────────────────────────────

  waves:
    - number: 1
      name: "RLS Foundation"
      description: "RLS em profiles e links — defense-in-depth sobre a authz app-layer"
      stories: ["6.1", "6.2"]
      parallel: false
      gate_agent: "@data-engineer"
      gate_focus: >-
        RLS habilitada COM policies na mesma migration (sem lockout); página
        pública anônima (ISR) segue lendo profile + links ativos; dashboard
        segue vendo links inativos do dono; anon key não lê inativos nem
        escreve nada; testes cross-user (app-layer) + novos testes de policy
        (db-layer) verdes; migrations aplicadas em development; app-layer
        preservada (NFR3 defense-in-depth).
      merge_order: ["6.1", "6.2"]
      tag: "epic-6-wave-1-rls-foundation"

    - number: 2
      name: "Tracking Hardening"
      description: "RLS em link_clicks + refactor trackLinkClick — requer Wave 1 + PRE-1"
      stories: ["6.3"]
      parallel: false
      gate_agent: "@qa"
      gate_focus: >-
        INSERT direto via PostgREST com anon key REJEITADO (fecha o concern
        MEDIUM do gate epic-5); tracking real grava via rota ratificada pelo
        @architect (security definer ou admin client); contrato preservado
        (valida is_active, nunca lança, fire-and-forget, navegação nunca
        bloqueia); analytics dashboard sem regressão; se admin client, a
        service key não vaza para o browser (nunca NEXT_PUBLIC_*).
      merge_order: ["6.3"]
      tag: "epic-6-wave-2-tracking-hardening"

    - number: 3
      name: "Rate Limiting"
      description: "Throttling em signup/login/reset/tracking — requer Wave 2"
      stories: ["6.4"]
      parallel: false
      gate_agent: "@qa"
      gate_focus: >-
        Targets do NFR18 aplicados (5/h, 10/15min, 3/h, 60/min/linkId);
        estouro em auth = erro genérico (não vaza mecanismo nem enumera
        contas); estouro em tracking = no-op silencioso (navegação intacta);
        sem IP raw persistido (NFR19); zero dependência nova (ou ADR do
        @architect justificando); testes da janela deslizante.
      merge_order: ["6.4"]
      tag: "epic-6-wave-3-rate-limiting"

    - number: 4
      name: "Edge & Polimento"
      description: "Middleware edge (auth guard + CSP + refresh) e débitos de design do Epic 4"
      stories: ["6.5", "6.6"]
      parallel: true
      gate_agent: "@qa"
      gate_focus: >-
        Middleware: guard edge soma ao layout guard (nenhum removido); CSP
        não quebra dashboard/pública/temas (verificar console limpo);
        matcher não intercepta /_next, assets nem a pública ISR; refresh de
        token funcional. Design: accent-fg/accent ≥ 4.5:1 medido, limiar do
        teste elevado p/ 4.5, swatch fiel ao canvas, 3 temas verificados
        visualmente. `pnpm dev` sobe sem erro (DoD padrão).
      merge_order: ["6.5", "6.6"]
      tag: "epic-6-wave-4-edge-polish"

  # ──────────────────────────────────────────────────────────
  # FINAL GATE
  # ──────────────────────────────────────────────────────────
  final_gate:
    agent: "@qa"
    focus: >-
      Sign-off final do Epic 6 — Segurança em Camadas & Hardening. Verificar:
      1. NFR3 cumprido: TODA tabela multi-tenant (profiles, links,
         link_clicks) com RLS habilitada + policies que replicam e reforçam
         a app-layer (que permanece intacta — defense-in-depth)
      2. Débito MEDIUM do gate epic-5 fechado: INSERT anônimo em link_clicks
         via PostgREST rejeitado; spam de cliques mitigado (RLS + rate limit)
      3. FR21/NFR18: rate limiting ativo nos 4 endpoints com os targets;
         falha de throttle nunca quebra navegação nem vaza informação
      4. Middleware edge: auth guard + CSP + refresh sem regressão em
         dashboard, pública ISR, temas, analytics
      5. Débitos Epic 4 fechados: contraste accent ≥ 4.5:1 + teste barrando
         regressão + swatch alinhado
      6. Smoke test manual (docs/smoke-test.md) re-executado pelo owner
         APÓS o epic — nenhuma regressão de fluxo (OWN-1)
      7. `pnpm dev` sobe; CI verde (typecheck+lint+test+build); migrations
         versionadas p/ CD de prod; conventional commits [Story 6.x]
      8. .env.example atualizado se SERVICE_ROLE entrou; nenhuma secret em
         código ou NEXT_PUBLIC_*
    tag: "epic-6-complete"

  # ──────────────────────────────────────────────────────────
  # RETROSPECTIVE
  # ──────────────────────────────────────────────────────────
  retrospective:
    enabled: true
    agent: "@sm"
    focus: >-
      O padrão "MVP primeiro, hardening depois" se pagou didaticamente?
      Alguma policy de RLS quebrou query em produção (a decisão #5 de
      migration atômica + inventário PRE-2 evitou)? A escolha de rate
      limiting (nativa vs serviço) foi acertada? CSP deu retrabalho?
      Registrar em docs/retrospectives/epic-6.md. Ao final: produto
      declarado "publicável em produção aberta"? Pré-requisito: retro do
      Epic 5 escrita antes (OWN-4).

metadata:
