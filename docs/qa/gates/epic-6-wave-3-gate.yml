# ── Item 4: TENTATIVAS DE EVASÃO (probes próprias) ──────────
evasion_attempts:
  - vector: "Variar o subject para escapar do teto de tracking"
    result: NOT_POSSIBLE
    why: >-
      No teto da camada 1 o subject é `p_link_id::text`, derivado DENTRO da RPC do
      parâmetro que identifica o próprio recurso alvo. O chamador não escolhe a chave: se
      mudar o link_id, ataca outro link e paga outro balde. É exatamente o desenho que a
      Emenda 1 § 6.3 pedia — chave que o banco conhece de forma autoritativa.
  - vector: "pg_advisory_xact_lock não serializa sob concorrência (race read-modify-write)"
    result: SERIALIZES_CORRECTLY
    proof: >-
      Probe deste gate: 40 chamadas SIMULTÂNEAS (curl em background, wait) ao mesmo
      bucket/subject com p_limit=20. Resultado no banco: sum(hits) = EXATAMENTE 20.
      Nenhuma passou do teto, nenhum hit se perdeu. O lock de escopo de transação faz o
      check+increment ser atômico de verdade.
  - vector: "Burst de 2x na virada de janela (defeito clássico do contador fixo)"
    result: NOT_PRESENT
    why: >-
      A janela é a SOMA dos sub-buckets com `window_start > now - p_window_seconds`, e não
      um contador que zera. Não existe instante em que o consumo caia a zero de uma vez.
    residual: >-
      Existe um erro de granularidade INFERIOR, não superior a 2x: um sub-bucket é
      descartado quando seu INÍCIO envelhece além da janela, então hits feitos no fim
      daquele sub-bucket saem da conta até `p_bucket_seconds` cedo. Teto efetivo máximo
      ≈ limit * (janela + bucket) / janela → tracking: até ~72/min em vez de 60 (+16%);
      auth: +1.7% (bucket de 60s numa janela de 900/3600s). Bounded e aceitável. Ver issue #5.
  - vector: "Housekeeping apaga contadores VIVOS"
    result: IMPOSSIBLE
    why: >-
      O delete usa `window_start < now() - interval '24 hours'` e a janela mais longa em
      uso é 3600s (signup/reset). Uma linha viva tem no máximo 1h — nunca entra no
      critério. Margem de 24x. O risco R7 está fechado corretamente.
    caveat: >-
      Só deixaria de valer se alguém chamasse check_rate_limit com p_window_seconds > 86400.
      Nenhum caminho do app faz isso (TARGETS é constante); um chamador direto que o
      fizesse prejudicaria apenas o próprio balde.
  - vector: "🔴 Disparar o fail-open DE PROPÓSITO para DESLIGAR o limiter"
    result: NOT_ACHIEVABLE_NO_TRACKING_PATH
    analysis: >-
      ESTA ERA A PERGUNTA MAIS IMPORTANTE DO GATE. Julgamento: NÃO é explorável para
      desligar o teto de tracking, e a razão é estrutural.
      Dentro de `record_link_click` a chamada é
      `check_rate_limit('track_link', p_link_id::text, 60, 60, 10)` — bucket, limite,
      janela e sub-bucket são LITERAIS no corpo da função. O atacante não controla NENHUM
      argumento capaz de provocar exceção; o único valor que ele fornece (p_link_id) é
      tipado uuid e validado contra `links` antes. Não há entrada que faça o handler
      disparar e liberar a escrita.
    empirical_finding: >-
      Probe deste gate: chamada DIRETA com p_bucket_seconds=0 → o erro 22012
      "division by zero" PROPAGOU ao cliente (HTTP 400), NÃO foi capturado como `true`.
      Motivo: v_now/v_window_start/v_slot são inicializados no bloco DECLARE, que fica
      FORA do `begin ... exception when others`. Ou seja, o fail-open é MENOS abrangente
      do que a AC5/AC14 e o comentário da migration afirmam — para exceções do DECLARE a
      função falha FECHADA (propaga erro). Isso é irrelevante para a segurança (nenhum
      caminho do app passa parâmetros variáveis), mas invalida a afirmação literal de que
      "a função nunca lança". Ver issue #3.
    residual_risk: >-
      O fail-open permanece disparável por falha GENUÍNA de infraestrutura (lock timeout,
      statement_timeout, bloat da tabela) — e essas condições correlacionam com CARGA, ou
      seja, o limiter tende a abrir exatamente quando mais importa. É o trade-off que o
      ADR contratou conscientemente e este gate NÃO o trata como defeito. A ressalva é que
      a issue #1 dá ao atacante um caminho para INFLAR a tabela de contadores, o que
      aproxima essas condições — é o elo entre as duas.
  - vector: "🔴 check_rate_limit como PRIMITIVA DE ESCRITA remota (achado novo)"
    result: EXPLOITABLE
    severity: high
    detail: "Ver issue #1 — o achado central deste gate, provado por três probes."

# ── Item 5: NFR19 — nenhum IP raw persistido ────────────────
nfr19_no_raw_ip:
  schema_check:
    columns: "bucket text · subject text · window_start timestamptz · hits int"
    verdict: PASS
    why: "Nenhuma coluna de IP existe na tabela. link_clicks também segue sem coluna de IP."
  data_check:
    method: "Consulta ao DADO real em development, por bucket, com regex — não leitura de código."
    results:
      - bucket: track
        rows: 16
        matching_hex64: 16
        ip_like: 0
      - bucket: track_link
        rows: 33
        matching_hex64: 0
        ip_like: 0
    verdict: PASS_WITH_DEVIATION
    why: >-
      ZERO subjects com forma de IP (v4 ou v6) em qualquer bucket. O NFR19 — que proíbe
      PERSISTIR IP RAW — está CUMPRIDO integralmente, verificado no dado e não só no código.
      Os buckets de aplicação (`track`, e por construção `signup`/`login`/`reset`) são
      100% hex de 64 chars. O bucket `track_link` usa o `link_id` (uuid) como subject:
      não é PII e não é IP, mas NÃO casa com `^[0-9a-f]{64}$`. Ver issue #4.
  pepper_leak_check:
    verdict: PASS
    why: >-
      Auditado o caminho todo: `pepper()` retorna o valor mas NUNCA o imprime — a mensagem
      de warning cita apenas o NOME do env. `subjectHash` só devolve o digest. Nenhum
      console.log/error com o pepper, nenhum caminho que o envie ao banco (o que trafega
      é o hash) e nenhuma exceção que o inclua. O valor não aparece em log nem em erro.
  ip_ephemeral:
    verdict: PASS
    why: >-
      `clientIp()` lê os headers e o valor morre no escopo da função — só o digest sai.
      Extração correta: leftmost de `x-forwarded-for` (o cliente), fallback `x-real-ip`,
      fallback `'unknown'`. Nunca gravado, logado nem enviado.

# ── Item 6: comportamento sem RATE_LIMIT_PEPPER ─────────────
missing_pepper_behavior:
  claim_by_dev: "degrada com aviso único no log e o limiter continua ativo"
  verified: TRUE_BUT_SEVERITY_UNDERSTATED
  code_verification: >-
    `let warnedAboutPepper` no escopo do módulo + guarda `if (!value && !warnedAboutPepper)`
    → exatamente UM console.warn por processo. `pepper()` retorna '' e o hash continua sendo
    calculado, então `checkRateLimit` segue consultando o banco e barrando normalmente.
    A afirmação do @dev está CORRETA como descrita.
  environment_finding: >-
    ⚠️ `.env.local` (development) NÃO define RATE_LIMIT_PEPPER — nem como chave vazia. O
    `.env.example` o lista com valor VAZIO. Ou seja, o modo degradado é o modo ATUAL de
    development, e será o de produção se o gate de merge do @devops (AC9) não for cumprido.
  severity_judgment: >-
    JULGAMENTO DESTE GATE: a documentação da story, do .env.example e do handoff classificam
    a ausência do pepper como degradação de PRIVACIDADE ("permite enumerar o espaço IPv4",
    "correlacionar hashes"). Isso SUBESTIMA o impacto de forma material.
    Combinado com o `grant execute on check_rate_limit to anon` (issue #1), um pepper vazio
    torna o subject dos buckets de auth INTEIRAMENTE COMPUTÁVEL por qualquer um:
    `sha256([''  , ip].join(':'))`. O atacante deixa de precisar "enumerar" e passa a poder
    FORJAR o balde de uma vítima específica.
    PROVADO POR PROBE DESTE GATE — ver issue #2. A ausência do pepper não é só um problema
    de privacidade: é um vetor de NEGAÇÃO DE SERVIÇO de autenticação.

# ── Item 7: os 3 endpoints de auth ──────────────────────────
auth_endpoints:
  targets_verified:
    - { endpoint: signUp, bucket: signup, limit: 5, window_s: 3600, bucket_s: 60, subject: "hash(ip)", matches_nfr18: true }
    - { endpoint: signIn, bucket: login, limit: 10, window_s: 900, bucket_s: 60, subject: "hash(ip)", matches_nfr18: true }
    - { endpoint: requestPasswordReset, bucket: reset, limit: 3, window_s: 3600, bucket_s: 60, subject: "hash(ip)", matches_nfr18: true }
  placement:
    verdict: PASS
    why: >-
      Nos TRÊS a chamada é a PRIMEIRA instrução do corpo — antes da leitura do FormData, da
      validação, do round-trip ao GoTrue e do hash de senha. É o ponto todo de um limiter:
      cortar antes do trabalho caro. Verificado linha a linha no diff contra main.
  generic_message:
    verdict: PASS
    value: "'Muitas tentativas. Aguarde alguns minutos e tente novamente.'"
    no_mechanism_leak: >-
      Não contém "rate limit", contador, janela nem Retry-After. Nenhum header
      X-RateLimit-* / Retry-After é emitido (o OUT da story foi respeitado).
    no_account_enumeration:
      verdict: PASS
      reasoning: >-
        A mensagem é uma CONSTANTE de módulo (RATE_LIMIT_MESSAGE), retornada ANTES de
        qualquer consulta que pudesse distinguir conta existente de inexistente. Como o
        limiter é chaveado por IP e é avaliado antes do e-mail sequer ser lido do FormData,
        o retorno é BIT A BIT IDÊNTICO exista ou não a conta. Risco R2 fechado.
    distinguishable_from_bad_credentials:
      verdict: PASS_BY_DESIGN
      analysis: >-
        Verificado adversarialmente: a mensagem de estouro ('Muitas tentativas...') É
        DIFERENTE da de credencial errada ('E-mail ou senha inválidos'). Isso é CORRETO e
        não é um vazamento: distinguir "você está limitado" de "sua senha está errada" não
        revela NADA sobre a existência de conta — as duas mensagens são invariantes em
        relação ao e-mail digitado. O oposto (mensagem idêntica) seria hostil ao usuário
        legítimo, que ficaria sem saber por que não entra. O que a AC12 exige — e o que
        está cumprido — é que a mensagem não permita ENUMERAR CONTAS.

# ── Item 8: tracking — contrato fire-and-forget ─────────────
tracking_contract:
  silent_noop_on_limit:
    verdict: PASS
    why: >-
      Camada 2: `if (!(await checkRateLimit('track', id))) return { ok:false, error: GENERIC_ERROR }`.
      Camada 1: a RPC devolve `false`, que cai em `if (data !== true) return { ok:false, ... }`.
      Os dois estouros viram ActionResult tipado. NENHUM throw em nenhum caminho.
  navigation_never_blocked:
    verdict: PASS
    why: >-
      components/public/TrackedLink.tsx NÃO está no diff da branch — o comportamento de
      navegação das Stories 5.2/5.3 (incluindo o fix do clique fantasma) está intocado.
      trackLinkClick continua envolto em try/catch com guarda de último recurso; o retorno
      nunca é renderizado na UI.
  fire_and_forget_intact:
    verdict: PASS
    why: >-
      O contrato de retorno (ActionResult) é idêntico ao anterior — o caller não tem como
      perceber que existe rate limiting. Nenhuma mensagem nova chega à UI.
  order_of_layers:
    verdict: PASS
    why: >-
      A camada 2 roda ANTES do round-trip ao banco (corta cedo, economiza a chamada); a
      camada 1 roda dentro da RPC. Correto: quem já estourou o próprio balde nem chega a
      consumir conexão de banco para a escrita.
  D9_accepted: >-
    'Link não encontrado ou inativo' também é retornado quando o teto do link estoura.
    Aceito: a string nunca é renderizada (fire-and-forget) e o significado ampliado está
    comentado no código. Equivalência comportamental preservada.

# ── Item 9: os 2 testes que mudaram de expectativa ──────────
changed_test_expectations_audit:
  question: "fortalecimento legítimo ou mascaramento de regressão?"
  verdict: FORTALECIMENTO_LEGÍTIMO — NÃO É MASCARAMENTO
  files:
    - "tests/integration/link-clicks-rls.test.ts — 'SELECT anônimo em link_clicks é NEGADO por PRIVILÉGIO (duas camadas)'"
    - "tests/integration/link-clicks.test.ts — bloco final do teste de isolamento"
  before: "expect(error).toBeNull() + expect(data).toHaveLength(0)   // 200 [] — RLS filtrando em silêncio"
  after:  "expect(error).not.toBeNull() + 'permission denied' + expect(data).toBeNull()   // 42501"
  reasoning: >-
    Auditado contra a fraude mais provável (afrouxar a asserção para acomodar uma quebra).
    O MOVIMENTO É O CONTRÁRIO: as duas asserções ficaram ESTRITAMENTE MAIS FORTES. Antes
    aceitavam qualquer resposta bem-sucedida e vazia; agora exigem um erro específico, com
    substring específica, e data === null. Um `200 []` — que ANTES passava — hoje FALHA.
    Nenhuma asserção foi removida, nenhum expect virou no-op, nenhum client anon foi trocado
    por service role (a fraude que o gate da Wave 2 procurou).
    A mudança de comportamento é a CONSEQUÊNCIA DIRETA E PRETENDIDA do
    `revoke select on link_clicks from anon` — que era literalmente a recomendação do
    concern #2 do gate da Wave 2. O comportamento observável passou de negação silenciosa
    pela RLS (uma camada) para negação por privilégio com a RLS atrás (duas camadas).
    Atualizar a expectativa aqui não é acomodar regressão: é registrar que o resultado
    contratado foi atingido.
  closes: "concern #2 (low) do gate da Wave 2 — FECHADO."

