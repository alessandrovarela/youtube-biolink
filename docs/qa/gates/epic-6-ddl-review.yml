decision: >-
  PASS_WITH_FINDINGS — a AC11 da Story 6.3 está formalmente FECHADA, e o TD-3 pode ser
  encerrado.

  A DDL do Epic 6 é, no essencial, boa DDL de segurança: as policies usam
  `(select auth.uid())` nas três tabelas (o erro nº 1 de RLS no Supabase, evitado),
  as funções SECURITY DEFINER têm search_path declarado, revoke de PUBLIC e grant
  mínimo, a atomicidade "policies primeiro, ENABLE por último" foi respeitada em todas
  as migrations, e o desenho do advisory lock para tornar check-and-increment atômico
  está correto. Nada do que o mandato desta revisão levantou como suspeita de
  performance de policy se confirmou: o EXISTS de link_clicks_select_own resolve como
  hashed SubPlan de execução única, a PK de rate_limit_counters está na ordem certa
  para o padrão de acesso real, e o housekeeping usa índice.

  O que a revisão encontrou está quase todo FORA do que os gates anteriores podiam ver,
  e isso valida a existência da AC11. Os dois achados HIGH têm o mesmo formato e são o
  motivo de esta revisão não ter sido dispensável:

  (1) A query de analytics era O(histórico) por causa de uma escolha de expressão feita
  no Epic 5 — date_trunc é STABLE, logo não indexável, logo o índice existente não
  servia ao recorte temporal. Com 500k cliques: 812 ms, 480.045 linhas descartadas por
  filtro, para devolver 90. Nenhum teste de comportamento sobre 62 linhas veria isso, e
  o modo de falha em escala é o pior possível: a role authenticated tem
  statement_timeout de 8 s e o app ENGOLE o erro, então o dashboard não mostraria falha
  — mostraria zero cliques. Corrigido, medido, 19,3× mais rápido.

  (2) CREATE OR REPLACE VIEW apaga security_invoker. Descobri isso porque aconteceu
  COMIGO ao aplicar a correção (1): reabri, por alguns segundos e sem nenhum sinal, o
  exato vazamento que a Story 6.3 existiu para fechar. É uma armadilha latente que
  qualquer manutenção futura da view dispara em silêncio. O estado está correto e a
  regra agora está escrita na migration — mas recomendo ao @qa uma asserção de
  catálogo, porque hoje a única barreira é a disciplina de quem escreve a próxima
  migration.

  O achado MEDIUM é de coerência: o epic formulou o argumento certo para revogar grants
  redundantes em link_clicks e não o aplicou a profiles e links, que continuavam com
  DELETE/INSERT/UPDATE/TRUNCATE para anon — inertes sob RLS, mas TRUNCATE em particular
  não é filtrado por RLS. Agora as três tabelas têm as duas camadas que o NFR3 promete.

  Sobre o TD-5: a AC é que está errada, e por um motivo mais forte do que "o texto
  envelheceu". Cumprir a AC1 literalmente exigiria que o app escolhesse o subject do
  balde track_link, que é exatamente o que o hardening da Wave 3 proibiu para fechar o
  vetor de supressão de analytics. A AC1 literal e a correção do issue HIGH da Wave 3
  não podem coexistir. Não editei o texto — isso é de @po —, mas deixei o registro e a
  emenda proposta na story.

  Sobre a suíte: o timeout de 5000 ms era real e está corrigido com dois perfis
  (unitários intocados). Mas a investigação rendeu mais do que o sintoma relatado — a
  suíte tinha um teste genuinamente flaky, o único de seu arquivo que não usava o
  helper de isolamento que o próprio arquivo define, colidindo consigo mesmo dentro da
  janela de 900 s do bucket login. Vale registrar que eu havia adicionado `retry: 1` e
  o REVERTI depois de observá-lo falhar: contra testes que asseguram contadores
  persistentes exatos, retry transforma falha transitória em falha garantida. A cura
  era isolamento, não repetição. 6 execuções consecutivas verdes, encadeadas sem pausa
  — que é justamente a condição sob a qual a falha aparecia.

  Nenhum dos achados justifica bloquear ou reabrir o merge do Epic 6. O DDL-1 é
  correção de um débito do Epic 5, não do 6; os demais são endurecimento e coerência.
  Recomendo que a migration 20260719210000 siga junto no mesmo merge, porque o DDL-2
  transforma uma armadilha de manutenção numa regra escrita, e porque o DDL-1 deixa de
  ser urgente exatamente enquanto produção tem zero cliques — a janela em que ele é
  barato é agora.

