# ── Issues / concerns ───────────────────────────────────────
concerns:
  - id: 1
    severity: high
    category: security
    story: "6.4"
    status: open
    title: "check_rate_limit é `grant execute to anon` com bucket e subject controlados pelo chamador — o limiter virou uma primitiva de ESCRITA remota"
    description: >-
      ACHADO CENTRAL DESTE GATE. Para que `lib/rate-limit.ts` funcione (ele usa
      createPublicClient, ou seja, a anon key), a AC6 concede
      `grant execute on check_rate_limit to anon`. Mas a função aceita `p_bucket`,
      `p_subject`, `p_limit`, `p_window_seconds` e `p_bucket_seconds` INTEIRAMENTE do
      chamador e INCREMENTA a tabela de contadores. Qualquer pessoa de posse da anon key
      pública pode, portanto, escrever em qualquer balde de qualquer sujeito.
      Isso inverte a natureza do controle: um mecanismo defensivo passa a ser utilizável
      COMO ARMA contra o próprio produto. Não está coberto por nenhuma AC nem por nenhum
      dos débitos D1-D9 aceitos pela story.
    proof: >-
      TRÊS PROBES DESTE GATE contra development, todas com a anon key crua e sem tocar no
      Next.js:
      (a) SILENCIAMENTO DE ANALYTICS — 60 chamadas a
      check_rate_limit('track_link', '<link_id>', 60, 60, 10) contra o link ativo
      6da450c3-a1ab-4447-a45f-7aa8801eb9a6, que gravaram ZERO cliques. Em seguida, uma
      chamada LEGÍTIMA a record_link_click nesse link retornou `false` e não gravou nada
      (verificado: 0 linhas). O atacante esgotou o balde de um link de terceiro sem
      produzir um único registro, silenciando a analytics daquele link enquanto quiser, a
      60 req/min. É MAIS BARATO E MAIS DISCRETO que a click inflation que a story fecha.
      (b) LOCKOUT DE AUTENTICAÇÃO (condicionado ao pepper — ver issue #2).
      (c) CRESCIMENTO IRRESTRITO DA TABELA — buckets arbitrários ('qa_gate_probe',
      'qa_gate_conc') foram aceitos e persistidos. Como (bucket, subject) é livre, um
      atacante cria linhas ilimitadas em rate_limit_counters; o housekeeping só remove o
      que tem mais de 24h. Pressão de armazenamento no free tier, contra o NFR8.
    impact: >-
      Novo vetor de negação de serviço, remoto e não autenticado, INTRODUZIDO por esta
      story. O vetor (a) não é mitigado pelo pepper: o subject do bucket track_link é o
      próprio link_id, que é PÚBLICO por design (links_select_public_active permite ao anon
      listar todos os links ativos). Balanço honesto: a story LIMITA a inflação de cliques e
      ABRE a supressão de cliques — do ponto de vista de integridade de analytics é
      aproximadamente uma troca, não um ganho líquido.
    why_not_blocking: >-
      Não bloqueia o merge da wave. (1) O objetivo contratado da story — fechar o bypass de
      click inflation — foi cumprido e provado. (2) O impacto é volumétrico/disponibilidade,
      não confidencialidade nem integridade de esquema: nada vaza, nada é corrompido, nenhum
      privilégio escala. (3) O grant é exigido pela própria AC6 — o @dev implementou o
      contrato com fidelidade; o defeito é de DESENHO (ADR-001 § 3), não de execução, e
      corrigi-lo é decisão de @architect/@pm, exatamente como o concern #1 da Wave 2 foi
      roteado. (4) Em produção o vetor (b) fica fechado assim que o gate de merge da AC9 for
      cumprido.
    recommendation: >-
      @architect / @pm — decidir CONSCIENTEMENTE, não por omissão (mesmo padrão do concern #1
      da Wave 2). Opções, da mais forte à mais barata:
      (a) REVOGAR `execute` de anon em check_rate_limit e expor, no lugar, uma RPC por
      bucket que derive internamente bucket/limite/janela (o chamador só fornece o subject),
      eliminando a escolha do balde e dos parâmetros;
      (b) manter o grant mas VALIDAR dentro da função: allowlist de p_bucket e limites/janelas
      derivados do bucket (ignorando os valores recebidos), o que mata (c) e reduz muito (a);
      (c) aceitar formalmente e registrar como débito D10, com o pepper como controle
      compensatório de (b) — insuficiente para (a).
      Recomendo (b): é uma migration pequena, não muda a interface do helper e fecha os três
      sub-vetores exceto a supressão por link, que exigiria (a).
  - id: 2
    severity: medium
    category: security
    story: "6.4"
    status: action_for_devops
    title: "RATE_LIMIT_PEPPER ausente não é só degradação de privacidade — é lockout de autenticação por IP"
    description: >-
      A story (AC9), o .env.example e o handoff descrevem a ausência do pepper como perda de
      PRIVACIDADE ("hash sujeito a enumeração do espaço IPv4", "permite correlacionar hashes").
      A afirmação funcional do @dev foi VERIFICADA e está correta — aviso único no log, limiter
      continua ativo. Mas a CLASSIFICAÇÃO DE SEVERIDADE está subestimada.
      Com pepper vazio, o subject dos buckets de auth é `sha256([''  , ip].join(':'))` — uma
      função pública, sem segredo. Combinado com a issue #1 (anon pode escrever em qualquer
      balde), o atacante não precisa "enumerar" nada: ele FORJA o balde de um IP escolhido.
    proof: >-
      PROBE DESTE GATE. Calculado, com o mesmo algoritmo de lib/rate-limit.ts e pepper vazio,
      o subject do IP 203.0.113.77 →
      684064235b913936c6e149acdfb5f37f154595d7e609ca73415cbf9d26ada393.
      Disparadas 10 chamadas anônimas a check_rate_limit('login', <subject>, 10, 900, 60):
      todas retornaram `true`. A 11ª — que é exatamente o que a tentativa de login REAL
      daquela vítima avaliaria — retornou `false`. Ou seja: 10 requisições HTTP
      não autenticadas bastam para negar login a um IP arbitrário por 15 minutos. Com o
      bucket `reset` (limite 3, janela 3600s) são 3 requisições para 1 hora; com `signup`,
      5 para 1 hora. Contadores removidos no cleanup.
    environment_finding: >-
      `.env.local` NÃO define RATE_LIMIT_PEPPER e `.env.example` o traz VAZIO — este é o
      estado ATUAL de development e será o de produção se o gate de merge não for cumprido.
    recommendation: >-
      @devops — o gate de merge da AC9 é CONFIRMADO COMO BLOQUEANTE por este gate, e sua
      justificativa muda de privacidade para DISPONIBILIDADE. Provisionar
      `RATE_LIMIT_PEPPER` (openssl rand -hex 32) em production E preview na Vercel ANTES do
      merge; valores DIFERENTES por ambiente. Definir também em `.env.local` para que
      development deixe de rodar no modo degradado.
      @dev / @sm — corrigir o texto de .env.example, do handoff e das Dev Notes: a ausência
      do pepper habilita lockout de auth por IP, não apenas correlação de hashes. Enquanto a
      issue #1 não for resolvida, o pepper é um CONTROLE DE SEGURANÇA, não um reforço de
      privacidade.
  - id: 3
    severity: low
    category: code
    story: "6.4"
    status: open
    title: "O fail-open não cobre o bloco DECLARE — a função PODE lançar, ao contrário do que AC5/AC14 e a migration afirmam"
    description: >-
      `v_now`, `v_window_start` e `v_slot` são inicializados na seção DECLARE, que fica FORA
      do `begin ... exception when others then return true`. Exceções levantadas ali
      PROPAGAM ao chamador em vez de virar `true`. A migration afirma, em comentário, que
      "um limiter quebrado NUNCA derruba o produto: ele libera" — isso não vale para essa
      janela.
    proof: >-
      PROBE DESTE GATE: chamada direta com p_bucket_seconds=0 retornou
      {"code":"22012","message":"division by zero"} (HTTP 400), e não `true`.
    impact: >-
      NENHUM no runtime atual, e este gate verificou por quê: em record_link_click os cinco
      argumentos são LITERAIS no corpo da função, e em lib/rate-limit.ts vêm da constante
      TARGETS. Nenhum caminho do produto passa valor variável capaz de disparar exceção no
      DECLARE. Além disso, se propagasse via record_link_click, o erro viraria
      `{ ok:false }` em trackLinkClick — o contrato fire-and-forget continua honrado.
      É um defeito de PRECISÃO DA AFIRMAÇÃO, não de comportamento observável.
    recommendation: >-
      Baixa prioridade. Mover as inicializações para dentro do bloco `begin` (declarar sem
      valor e atribuir depois) faz o fail-open ser realmente total, ou então ajustar o
      comentário da migration e a redação da AC5 para dizer "o corpo executável falha
      aberto". Preferir a primeira: o comentário é material didático e deve descrever o
      código com exatidão.
  - id: 4
    severity: low
    category: requirements
    story: "6.4"
    status: open
    title: "AC1 e AC17 exigem subject 64-hex em TODAS as linhas; o bucket track_link usa uuid"
    description: >-
      A AC1 determina que "`subject` é sempre um digest hex de 64 chars — nunca IP raw" e a
      AC17 assere que "`subject` casa com ^[0-9a-f]{64}$ em TODAS as linhas". O bucket
      `track_link`, criado pela Emenda 1, grava o `link_id` (uuid, 36 chars com hífens).
      Verificado no dado: 33 linhas em track_link, 0 casando com o regex.
      O @dev contornou reformulando a verificação para "buckets de APP", o que não é o texto
      da AC.
    impact: >-
      NENHUM em segurança ou privacidade. O NFR19 proíbe persistir IP RAW e isso está
      integralmente cumprido — confirmado por este gate no DADO: zero subjects com forma de
      IPv4 ou IPv6 em qualquer bucket. Um link_id é um identificador de recurso público, não
      PII, e o próprio comentário da migration argumenta isso corretamente. É desvio de
      TEXTO DE AC, não de intenção: as ACs foram escritas antes da Emenda 1 e não
      acompanharam a introdução do bucket track_link.
    recommendation: >-
      @po / @sm — emendar a redação da AC1/AC17 para refletir a Emenda 1: "subject é um
      digest hex de 64 chars para os buckets derivados de IP (signup/login/reset/track); para
      o bucket track_link é o link_id (uuid, não-PII). Em nenhum caso um IP raw é
      persistido." Registrar como correção de contrato, não como defeito de implementação.
      A trava automatizada deveria asserir a regra POR BUCKET.
  - id: 5
    severity: info
    category: code
    story: "6.4"
    status: accepted
    title: "Granularidade dos sub-buckets permite excesso limitado sobre o teto nominal"
    description: >-
      A janela descarta um sub-bucket quando seu INÍCIO envelhece além de p_window_seconds,
      então hits feitos no fim daquele sub-bucket saem da conta até p_bucket_seconds cedo.
      O teto sustentado efetivo é ≈ limit * (janela + bucket) / janela.
      Tracking (60s/10s): até ~72/min em vez de 60 (+16%). Auth (900s ou 3600s com bucket de
      60s): +6,7% e +1,7%.
    impact: >-
      Desprezível e na direção segura do ponto de vista de disponibilidade. NÃO é o "burst de
      2x na virada" que o contador fixo teria — esse defeito está corretamente ausente, como
      as Dev Notes afirmam. Registrado apenas para que o número 60 não seja lido como um teto
      matematicamente rígido numa auditoria futura.
    recommendation: "Sem ação. Reduzir p_bucket_seconds aumentaria a precisão ao custo de mais linhas; a troca atual está bem calibrada."
  - id: 6
    severity: low
    category: tests
    story: "6.4"
    status: open
    title: "Nenhum teste cobre o abuso de check_rate_limit chamada diretamente por anon"
    description: >-
      A suíte tem trava de regressão para a assinatura de record_link_click (via OpenAPI),
      mas nada exercita `check_rate_limit` sendo invocada direto pelo PostgREST com bucket e
      subject arbitrários — o vetor da issue #1. Uma futura alteração de grants passaria
      despercebida.
    recommendation: >-
      Ao endereçar a issue #1, adicionar em tests/integration/rate-limit.test.ts um teste que
      chame check_rate_limit como anon com um p_bucket fora da allowlist e espere recusa — a
      trava que torna a correção permanente.
  - id: 7
    severity: low
    category: tests
    story: "6.4"
    status: accepted
    title: "Smoke pela UI real não reexecutado por este gate"
    description: >-
      O T7 do @dev reporta `pnpm dev` verde e as rotas respondendo, mas este gate não abriu o
      navegador para estourar o login e ver a mensagem genérica renderizada, nem clicou num
      link real. Mesmo débito do concern #6 da Wave 2.
    recommendation: >-
      Aceito. A cobertura db-layer usa as formas de query exatas do produto e a suíte de
      integração roda contra o banco de development real. Um estouro manual de login e um
      clique real antes do merge continuam recomendados — baratos, e fecham junto com a
      verificação pós-deploy já pendente.

