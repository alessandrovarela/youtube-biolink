# CONFORMIDADE ARQUITETURAL
# ════════════════════════════════════════════════════════════════════════════
architectural_conformance:
  nfr3_rls_all_multitenant_tables: true    # profiles, links, link_clicks — verificado por sonda
  app_layer_authz_preserved: true          # nenhum filtro removido — verificado no diff
  nfr18_all_four_targets: true             # 3/h, 5/h, 10/15min, 60/min — medidos ao vivo
  nfr19_no_raw_ip_persisted: true          # só digest 64-hex; invariante imposta pelo BANCO
  nfr4_security_headers: true              # CSP enforce + XFO + nosniff + Referrer-Policy
  no_service_role_in_app_runtime: true     # ADR-001 refutou o admin client; PRE-3 cancelado
  zero_new_dependencies: true              # node:crypto + next/headers; nenhum Upstash/KV
  security_definer_controls: true          # search_path fixo + revoke public + grant mínimo, nas 3 funções
  migrations_atomic_policies_then_enable: true
  conventional_commits: true               # 37/37
  article_iv_no_invention: true            # tudo rastreia a FR21/NFR3/NFR18/NFR19/ACs

