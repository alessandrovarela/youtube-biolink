# ── Item 1 do gate: VERIFICAÇÃO DE CATÁLOGO ─────────────────
# O @dev da 6.2 registrou débito (#1) por não ter conseguido ler pg_policies
# (token da CLI no keychain em formato go-keyring). ESSE DÉBITO ESTÁ FECHADO.
# O token é recuperável (`security find-generic-password -s "Supabase CLI" -w`
# → go-keyring-base64:<base64>, NÃO cifrado). Consulta feita pela Management API
# (POST /v1/projects/{ref}/database/query) no projeto development.
catalog_verification:
  status: CONFIRMED
  method: "Supabase Management API — pg_class.relrowsecurity + pg_policies"
  project_dev: "rjsvkwjgsctqsswrospx (youtube-biolink-dev)"
  rowsecurity:
    profiles: true      # ✅ esperado (Story 6.1)
    links: true         # ✅ esperado (Story 6.2)
    link_clicks: false  # ✅ esperado — Story 6.3, fora da Wave 1
  forcerowsecurity:
    profiles: false     # ok: owner é postgres (BYPASSRLS); não afeta anon/authenticated
    links: false
  policies_found: 7
  # Cada linha abaixo foi comparada CARACTERE A CARACTERE com a migration.
  # Divergências encontradas: NENHUMA.
  policies:
    - table: profiles
      name: profiles_select_public
      permissive: PERMISSIVE
      roles: "{anon,authenticated}"
      cmd: SELECT
      qual: "true"
      with_check: null
      matches_migration: true
    - table: profiles
      name: profiles_update_own
      permissive: PERMISSIVE
      roles: "{authenticated}"
      cmd: UPDATE
      qual: "(id = ( SELECT auth.uid() AS uid))"
      with_check: "(id = ( SELECT auth.uid() AS uid))"
      matches_migration: true
    - table: links
      name: links_select_public_active
      permissive: PERMISSIVE
      roles: "{anon,authenticated}"
      cmd: SELECT
      qual: "(is_active = true)"
      with_check: null
      matches_migration: true
    - table: links
      name: links_select_own
      permissive: PERMISSIVE
      roles: "{authenticated}"
      cmd: SELECT
      qual: "(profile_id = ( SELECT auth.uid() AS uid))"
      with_check: null
      matches_migration: true
    - table: links
      name: links_insert_own
      permissive: PERMISSIVE
      roles: "{authenticated}"
      cmd: INSERT
      qual: null
      with_check: "(profile_id = ( SELECT auth.uid() AS uid))"
      matches_migration: true
    - table: links
      name: links_update_own
      permissive: PERMISSIVE
      roles: "{authenticated}"
      cmd: UPDATE
      qual: "(profile_id = ( SELECT auth.uid() AS uid))"
      with_check: "(profile_id = ( SELECT auth.uid() AS uid))"
      matches_migration: true
    - table: links
      name: links_delete_own
      permissive: PERMISSIVE
      roles: "{authenticated}"
      cmd: DELETE
      qual: "(profile_id = ( SELECT auth.uid() AS uid))"
      with_check: null
      matches_migration: true
  no_extra_policies: true   # nenhuma policy fora das 7 declaradas; nada anula a intenção
  no_restrictive_policies: true  # todas PERMISSIVE → as duas SELECT de links combinam por OR

# ── Item 2/4: revisão linha a linha de cada USING/WITH CHECK ─
policy_audit:
  bypass_attempts_analyzed:
    - vector: "anon escreve em profiles (INSERT/UPDATE/DELETE)"
      result: DENIED
      why: "Nenhuma policy cobre anon para escrita; com RLS ligada, ausência de policy = negação."
    - vector: "A reatribui profiles.id para o id de B (doação de perfil)"
      result: DENIED
      why: "WITH CHECK (id = auth.uid()) valida a linha RESULTANTE."
    - vector: "A move um link próprio para profile_id de B"
      result: DENIED
      why: "WITH CHECK de links_update_own valida a linha resultante."
    - vector: "A insere link com profile_id de B"
      result: DENIED
      why: "WITH CHECK de links_insert_own."
    - vector: "anon lê/reativa/deleta link inativo"
      result: DENIED
      why: "links_select_public_active USING (is_active = true) esconde; sem policy de UPDATE/DELETE para anon."
    - vector: "authenticated lê links ATIVOS de terceiros via PostgREST"
      result: ALLOWED_BY_DESIGN
      why: "Necessário: usuário logado precisa renderizar a página pública de outro. Não expõe nada além do que a página pública já expõe; inativos de terceiros seguem invisíveis (verificado)."
    - vector: "view link_click_daily como bypass de RLS de links"
      result: NOT_APPLICABLE
      why: "A view lê APENAS link_clicks (pg_get_viewdef confirmado); não toca links. Ver concern #1 para o risco na Story 6.3."
    - vector: "função SECURITY DEFINER como bypass"
      result: CONTROLLED
      why: "Única SECURITY DEFINER em public é handle_new_user (owner postgres). É o caminho de INSERT legítimo do signup, por design."
  no_overpermissive_policy_found: true

