# ════════════════════════════════════════════════════════════════════════════
# PRECONDIÇÕES DE MERGE — @devops (EXAUSTIVO)
# Um item esquecido aqui derruba produção ou trava o CD.
# ════════════════════════════════════════════════════════════════════════════
merge_preconditions:

  - id: PRE-M1
    severity: BLOCKING
    owner: "@devops"
    what: "RATE_LIMIT_PEPPER como secret de REPOSITÓRIO no GitHub Actions"
    why: >-
      O job `quality` do ci.yml ganhou um passo Preflight e um Build que leem
      `secrets.RATE_LIMIT_PEPPER`. Sem ele o job FALHA. E como
      `migrate-production` declara `needs: quality`, a falha impede que as
      migrations sejam aplicadas em produção — a branch mergeia e o banco não
      muda, deixando código novo contra schema velho.
    critical_detail: >-
      ⚠️ TEM QUE SER SECRET DE REPOSITÓRIO, NÃO DE ENVIRONMENT. O job `quality`
      NÃO declara `environment:` (só `migrate-production` declara
      `environment: production`). Um secret criado apenas no environment
      `production` fica INVISÍVEL para o `quality` e a CI falha mesmo com o
      secret aparentemente provisionado. Este é o erro mais provável de todo o
      merge.
    how: "gh secret set RATE_LIMIT_PEPPER --body \"$(openssl rand -hex 32)\""

  - id: PRE-M2
    severity: BLOCKING
    owner: "@devops"
    what: "RATE_LIMIT_PEPPER na Vercel — environment PRODUCTION"
    why: >-
      assertProductionEnv() em next.config.ts roda ANTES da compilação e faz o
      build da Vercel FALHAR sem o env. Sem deploy, sem release.
    how: "Vercel → Settings → Environment Variables → Production. NUNCA prefixar NEXT_PUBLIC_."

  - id: PRE-M3
    severity: BLOCKING
    owner: "@devops"
    what: "RATE_LIMIT_PEPPER na Vercel — environment PREVIEW"
    why: >-
      Os preview deploys de PRs também rodam `next build` com NODE_ENV=production
      e batem no mesmo gate. Sem o env em Preview, TODO PR futuro tem o deploy
      de preview vermelho. Valor DIFERENTE do de produção.

  - id: PRE-M4
    severity: BLOCKING
    owner: "@devops"
    what: "Confirmar NEXT_PUBLIC_SUPABASE_URL disponível em TEMPO DE BUILD na Vercel (prod + preview)"
    why: >-
      DEPENDÊNCIA NOVA CRIADA POR ESTE EPIC. A CSP é montada em next.config.ts,
      avaliado no build. Se a var existir só em runtime, o header sai com
      `connect-src 'self'` e o browser bloqueia TODA chamada ao Supabase —
      login quebra pelo console, sem nenhum erro de servidor. Antes do Epic 6
      esta var só era necessária em runtime; agora é de build.
    how: "Verificar o header Content-Security-Policy do deploy e confirmar que o domínio Supabase aparece em connect-src."

  - id: PRE-M5
    severity: BLOCKING
    owner: "@devops"
    what: "Confirmar os secrets do CD já existentes antes do merge"
    why: >-
      `migrate-production` depende de SUPABASE_ACCESS_TOKEN,
      SUPABASE_DB_PASSWORD e SUPABASE_PROJECT_REF_PROD. Já foram usados nos
      Epics 3-5, mas este é o maior lote de migrations do projeto (5 de uma vez,
      3 delas mudando comportamento de acesso). Um token expirado significa
      código novo em produção contra schema antigo — o pior dos dois mundos.
    how: "Rodar o CD uma vez em dry-run ou confirmar validade dos tokens antes do merge."

  - id: PRE-M6
    severity: BLOCKING
    owner: "@devops"
    what: "Secrets de teste de integração da CI"
    why: >-
      SUPABASE_URL_DEV, SUPABASE_ANON_KEY_DEV e SUPABASE_SERVICE_ROLE_KEY_DEV
      alimentam `pnpm test:integration` no job quality. As novas suítes de RLS e
      rate limiting EXIGEM o banco dev COM as migrations do Epic 6 aplicadas
      (já estão). Se o CI apontar para um Supabase sem elas, ~40 testes falham
      e a CI fica vermelha por motivo errado.

  - id: PRE-M7
    severity: HIGH
    owner: "@devops"
    what: "Verificação PÓS-DEPLOY em produção (não é opcional)"
    why: >-
      Duas afirmações centrais do epic são PREDIÇÕES sobre produção, não
      observações: (a) que o owner das funções SECURITY DEFINER tem BYPASSRLS em
      prod — se não tiver, o rate limiting fica silenciosamente desligado com
      todos os sinais verdes; (b) que a RLS não quebrou nenhuma query real.
    checklist_minimo_pos_merge:
      - "POST /rest/v1/link_clicks com a anon key de PROD → deve retornar 42501 (hoje retorna 409/FK)."
      - "POST /rest/v1/rpc/check_rate_limit com a anon key de PROD → deve retornar 42501."
      - "POST /rest/v1/rpc/check_app_rate_limit com bucket 'track_link' → deve retornar 22023."
      - "GET /rest/v1/rate_limit_counters com a anon key de PROD → deve retornar 42501."
      - "Abrir a página pública real e confirmar que os links continuam renderizando."
      - "Clicar num link e confirmar no dashboard de analytics que o clique foi CONTADO (prova que record_link_click e o BYPASSRLS do owner funcionam em prod)."
      - "Fazer 4 pedidos de reset seguidos e confirmar a mensagem genérica (prova que os contadores gravam em prod)."

  - id: PRE-M8
    severity: MEDIUM
    owner: "@devops"
    what: "Ordem recomendada: aplicar migrations ANTES de promover o deploy"
    why: >-
      Das duas ordens possíveis, migrations-primeiro degrada apenas o tracking
      do código antigo (perda silenciosa de cliques); deploy-primeiro degrada o
      tracking E deixa o rate limiting inativo. Com prod em 0 cliques, ambas são
      aceitáveis, mas a primeira é estritamente melhor.

  - id: PRE-M9
    severity: MEDIUM
    owner: "@devops"
    what: "Tag v0.1.0 na main ANTES do merge do Epic 6 (OWN-3)"
    why: >-
      A tag marca o MVP (Epics 1-5). O Epic 6 é pós-MVP, candidato a v0.2.0.
      Mergear antes de taggear perde para sempre o ponto de corte do MVP —
      irreversível sem reescrever histórico.

  - id: PRE-M10
    severity: LOW
    owner: "@devops"
    what: "Documentar o pepper no gerenciador de segredos do owner"
    why: >-
      Perder o pepper não causa perda de dado, mas INVALIDA todos os baldes em
      voo (todo mundo ganha limite zerado) e obriga a reprovisionar em 3 lugares
      (GitHub, Vercel prod, Vercel preview) simultaneamente.

# ════════════════════════════════════════════════════════════════════════════
# ISSUES DESTE GATE (novas, não herdadas)
# ════════════════════════════════════════════════════════════════════════════
issues:
  - id: 1
    severity: low
    category: docs/consistency
    status: open
    title: ".env.example ainda afirma que o app 'NÃO SOBE' sem o pepper — falso desde a Wave 4"
    description: >-
      O bloco 'COMPORTAMENTO SE AUSENTE' do .env.example diz: 'production →
      lib/rate-limit.ts LANÇA na carga do módulo e o app NÃO SOBE ... quebra
      ruidosamente no boot'. O gate da Wave 4 TESTOU e refutou: o throw só
      dispara na primeira Server Action. lib/rate-limit.ts e next.config.ts
      foram corrigidos com essa lição escrita em detalhe; .env.example não. Num
      projeto didático é exatamente o defeito que a Wave 4 mandou corrigir,
      sobrevivendo num arquivo que o leitor abre PRIMEIRO.
    recommendation: >-
      Reescrever o bloco para: 'production → o BUILD falha (assertProductionEnv
      em next.config.ts), então o artefato ruim nunca existe. O throw em
      lib/rate-limit.ts é backstop e dispara na primeira Server Action, não no
      boot.' Correção de 4 linhas.
    blocking: false

  - id: 2
    severity: low
    category: infra
    status: open
    title: "Next 16.2.6 deprecia `middleware.ts` em favor de `proxy.ts`"
    description: >-
      Confirmado por este gate em DOIS pontos: `next build` e `next dev` emitem
      '⚠ The \"middleware\" file convention is deprecated. Please use \"proxy\"
      instead.' O middleware FUNCIONA (build classifica como 'ƒ Proxy
      (Middleware)' e o guard redireciona corretamente), mas o projeto nasce
      sobre uma convenção anunciada como morta.
    recommendation: >-
      Renomear middleware.ts → proxy.ts numa story de manutenção, junto com a
      atualização de docs/architecture/routing.md e do teste de matcher. Não
      fazer no Epic 6: renomear no fechamento de um epic de segurança é
      trocar o telhado durante a mudança.
    blocking: false

  - id: 3
    severity: low
    category: code/dead-code
    status: open
    title: "O `?next=` construído pelo middleware é parâmetro MORTO"
    description: >-
      O middleware faz `url.searchParams.set('next', request.nextUrl.pathname)`
      no redirect para /login. Grep confirma que NENHUM consumidor lê esse
      parâmetro: a única ocorrência de `next=` no fluxo de auth é
      `${origin}/auth/callback?next=/reset-password/confirm` em
      lib/actions/auth.ts:130, que é outro fluxo. O usuário que tentava abrir
      /dashboard/analytics loga e cai em /dashboard, não no destino.
    recommendation: >-
      Ou implementar o consumo em /login (redirect pós-login para o `next`
      validado — reusar safeNextPath de auth/callback/route.ts, que já existe e
      já é robusto), ou remover o parâmetro. Manter os dois estados é pior que
      qualquer um dos dois: parece funcionalidade e não é. Herdado da issue #4
      do gate da Wave 4, confirmado independentemente aqui.
    blocking: false

  - id: 4
    severity: low
    category: performance
    status: open
    title: "Server Actions do dashboard atravessam o middleware — um getUser() extra por action"
    description: >-
      Achado NOVO, de conjunto — nenhuma wave olhou isto. Server Actions do
      dashboard são POSTs para /dashboard/*, portanto casam o matcher
      /dashboard/:path* e disparam supabase.auth.getUser() ANTES da action, que
      por sua vez faz seu próprio getUser(). Toda criação/edição/reordenação de
      link paga um round-trip extra ao GoTrue e uma invocação edge.
    recommendation: >-
      Medir antes de agir. Se o custo importar, o matcher pode ser restrito a
      requisições GET/de navegação, ou o guard de layout pode absorver o papel
      (ele já é autoritativo). Não mexer sem medição — o ganho de segurança da
      redundância é real.
    blocking: false

  - id: 5
    severity: info
    category: security/limits
    status: accepted
    title: "O teto de 60/min por link é global — um link genuinamente viral perde cliques"
    description: >-
      A camada 1 (dentro da RPC) limita 60 cliques/min POR LINK para TODOS os
      chamadores, sem distinguir tráfego legítimo de forjado. Um link que
      viralize acima de 1 clique/segundo terá o excedente descartado
      silenciosamente e o analytics subcontará.
    recommendation: >-
      Sem ação. É o preço explícito de fechar o click inflation no único lugar
      que alcança o curl direto, e está contratado no ADR-001 § 6. Registrado
      para que uma subcontagem futura não seja diagnosticada como bug.
    blocking: false

