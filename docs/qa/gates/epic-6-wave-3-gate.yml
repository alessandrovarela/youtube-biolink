    transação: não existe janela com a tabela criada sem a RLS que a torna privada, nem com
    a RPC republicada sem o teto que a protege.
  ordering: >-
    PASS — 20260719190000 > 20260719180000 (Wave 2) > 20260719171040 > 20260719170252 >
    20260702120000 (última aplicada em prod). Aplicação lexicográfica correta e as quatro
    migrations da branch entram no MESMO run do CD, em ordem.
  dependency_on_wave_2:
    status: SATISFIED_IN_SAME_RUN
    detail: >-
      Esta migration faz `create or replace function record_link_click` e
      `revoke select on link_clicks from anon` — ambos dependem de objetos criados em
      20260719180000, que tem versão MENOR e portanto roda antes no mesmo push. Verificado
      no preflight: em produção record_link_click AINDA NÃO EXISTE (rlc_fn_count=0), o que
      confirma que a Wave 2 e a Wave 3 vão para produção juntas.
  production_preflight:
    project: "bmyijncgsiubufwhttul (youtube-biolink-prod)"
    latest_version_applied: "20260702120000"
    rate_limit_counters_exists: false
    record_link_click_count: 0
    verdict: >-
      PASS — a migration aplicará LIMPO. `create table public.rate_limit_counters` não colide
      (a relação não existe em prod). O `create or replace` de record_link_click encontra a
      função recém-criada pela migration da Wave 2 no mesmo run. Os revokes incidem sobre
      grants que existem de fato (default do Supabase). Nenhum statement destrutivo, nenhum
      DROP, nenhuma linha alterada ou apagada.
  destructive_statements: none
  data_loss_risk: none
  rollback: >-
    Trivial: DROP FUNCTION check_rate_limit, DROP TABLE rate_limit_counters, re-GRANT do
    select em link_clicks para anon e `create or replace` da versão 6.3 de record_link_click.
