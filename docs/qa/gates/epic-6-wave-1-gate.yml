# ── Item 7: segurança das migrations para o CD de produção ──
migration_safety:
  files:
    - "supabase/migrations/20260719170252_profiles_rls.sql"
    - "supabase/migrations/20260719171040_links_rls.sql"
  atomicity: "PASS — em AMBAS, as policies são criadas ANTES do ENABLE ROW LEVEL SECURITY, no mesmo arquivo. Sem janela de lockout."
  ordering: "PASS — timestamps 20260719170252 < 20260719171040, ambos posteriores às 5 migrations já em prod. supabase db push aplica em ordem lexicográfica."
  pgrst_reload: "PASS — ambas terminam com notify pgrst, 'reload schema'."
  destructive_statements: none   # nenhum DROP/ALTER COLUMN/DELETE; apenas CREATE POLICY + ALTER TABLE ENABLE
