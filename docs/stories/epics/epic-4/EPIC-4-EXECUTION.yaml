execution:
  epicId: EPIC-4
  epicTitle: "Design System & Temas"
  epicGoal: >-
    Formalizar em código de produção o design system que nos Epics 2-3 foi
    construído de forma tática: tokens consolidados (CSS variables), primitivos
    reutilizáveis (Button, Input, Textarea, Card, Avatar, Label, Toast), 3 temas
    selecionáveis pelo usuário (light/dark/accent) via classe no root, aplicação
    consistente em dashboard e página pública `/[username]`, navegação/layout
    coeso (dashboard ↔ links ↔ perfil), acessibilidade WCAG AA validada nos 3
    temas e documentação viva leve. Ao final o produto deixa de "parecer estudo"
    e ganha identidade visual profissional — sem mudar nenhuma feature funcional.

  storyBasePath: "docs/stories"
  template: "epic-orchestration"
  mode: yolo  # solicitado pelo owner — rodar o epic inteiro autônomo

  # ──────────────────────────────────────────────────────────
  # DECISÕES DE ESCOPO (reconciliação pré-execução)
  # ──────────────────────────────────────────────────────────
  # Ratificação recomendada ao owner antes do kickoff. Defaults seguem o
  # código existente e o design system de referência (menor risco de invenção).
  #
  # 1. Tailwind 4 CSS-first → tokens vivem em `app/globals.css` via CSS variables
  #    + bloco `@theme` (Tailwind 4 não usa `tailwind.config.ts`). O PRD Story
  #    4.1 (AC2) cita `tailwind.config.ts` + `theme.extend.colors` — DESATUALIZADO.
  #    Reconciliação análoga ao caso `zod → validação inline` do Epic 3. Zero
  #    arquivo de config JS; tokens expostos ao Tailwind via `@theme inline`.
  #
  # 2. Fonte de verdade dos tokens/primitivos → `docs/design/system/project/`
  #    (colors_and_type.css, ui_kits/, preview/) + skill `biolink-design`.
  #    Artigo IV (No Invention): tokens, cores, radii, sombras e specs de
  #    primitivos DERIVAM da referência — @dev não inventa paleta nem escala.
  #
  # 3. Conjunto de tokens = SUPERSET da referência (não o subset do PRD 4.1 AC1).
  #    Canônico: --color-bg/-fg/-muted/-muted-fg/-border/-surface/-accent/
  #    -accent-fg/-accent-soft + status (success/warning/danger/info) +
  #    tipografia (Inter) + spacing (grid 4px) + radii + shadows + motion +
  #    layout (--max-public 480, --max-dashboard 720, --topbar-h 64).
  #
  # 4. Mecanismo de tema → classe no root: `html.theme-dark` / `html.theme-accent`
  #    (light = :root default). Dashboard: aplicação client-side instantânea
  #    (ThemeProvider, sem reload). Página pública: injeção server-side da classe
  #    no SSR a partir de `profile.theme` (SEM FOUC). Substitui o
  #    `prefers-color-scheme` atual do globals.css.
  #
  # 5. Fonte Inter via `next/font/google` (self-hosted pelo Next, sem <link>
  #    externo do Google Fonts). Substitui Geist. Aplicada em `--font-sans`.
  #
  # 6. SEM migration de banco. `profiles.theme` já existe (Story 2.1, CHECK
  #    light|dark|accent, default 'light'). Story 4.3 apenas escreve nessa coluna
  #    via Server Action `updateTheme` (segue padrão de `updateProfile`).
  #
  # 7. Navegação/layout do dashboard (lição da retrospectiva Epic 3: "a feature
  #    é alcançável?") entra como escopo da Story 4.2 — topbar/nav coeso ligando
  #    dashboard ↔ /dashboard/links ↔ perfil, resolvendo o débito do link de
  #    navegação da Story 3.3.
  # ──────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────
  # OWNER PREREQUISITES
  # ──────────────────────────────────────────────────────────
  # NENHUM. Epic puramente de frontend/apresentação. Sem config no painel
  # Supabase, sem novas secrets, sem nova migration (profiles.theme já existe).
  owner_prerequisites: []

  # ──────────────────────────────────────────────────────────
  # PRÉ-REQUISITOS TÉCNICOS
  # ──────────────────────────────────────────────────────────
  technical_prerequisites:
    - id: "PRE-1"
      task: >-
        Internalizar o design system de referência como fonte de verdade ANTES
        de codar: docs/design/system/project/colors_and_type.css (tokens),
        preview/*.html (specs visuais de buttons/inputs/avatars/cards-toasts/
        theme-selector) e ui_kits/{dashboard,public-profile} (composição alvo).
        Usar a skill `biolink-design` quando útil. Artigo IV: não inventar
        paleta, escala tipográfica nem specs de componente — derivar da referência.
      owner: "@dev / @ux-design-expert"
      blocks: ["4.1", "4.2"]
    - id: "PRE-2"
      task: >-
        Confirmar que `profiles.theme` existe e aceita light|dark|accent (Story
        2.1). Nenhuma migration nova no Epic 4 — validação apenas.
      owner: "@data-engineer"
      blocks: ["4.3"]

  # ──────────────────────────────────────────────────────────
  # STORIES
  # ──────────────────────────────────────────────────────────
  stories:
    - id: "4.1"
      file: "4.1.story.md"
      title: "Design tokens e CSS variables (Tailwind 4)"
      status: pending
      branch: "feature/4.1-design-tokens"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: []
      notes: >-
        Portar tokens de docs/design/system/project/colors_and_type.css para
        app/globals.css: CSS variables em :root (light) + overrides
        html.theme-dark / html.theme-accent. Expor ao Tailwind via `@theme inline`
        (Tailwind 4 — SEM tailwind.config.ts, reconcilia PRD 4.1 AC2). Trocar
        Geist → Inter via next/font/google em app/layout.tsx (--font-sans).
        Remover `prefers-color-scheme` do globals.css (tema agora é escolha do
        usuário, não do SO). Superset de tokens (cores+status+type+spacing+radii+
        shadows+motion+layout). Base de TODO o epic. Screenshots dos 3 temas no PR.

    - id: "4.2"
      file: "4.2.story.md"
      title: "Primitivos UI + refactor de páginas + navegação do dashboard"
      status: pending
      branch: "feature/4.2-ui-primitives"
      complexity: 5
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["4.1"]
      notes: >-
        Criar components/ui/: Button (variants primary/secondary/ghost/destructive;
        sizes sm/md/lg; disabled+spinner), Input, Textarea, Card, Avatar
        (fallback iniciais), Label, Toast (role=status/alert, auto-dismiss 5s).
        Specs derivam de preview/*.html. Cada primitivo com teste unitário
        (render + estado). Refactor LEVE (não reescrever) das páginas
        auth/dashboard para usar os primitivos (login-form, profile-form,
        links-manager, signup/reset). INCLUI navegação/layout coeso do dashboard
        (topbar ligando dashboard ↔ /dashboard/links ↔ perfil) — resolve débito
        de navegação da retrospectiva Epic 3. STORY DE MAIOR COMPLEXIDADE — toca
        muitos arquivos → roda SOLO na sua wave para evitar conflito de worktree.

    - id: "4.3"
      file: "4.3.story.md"
      title: "Seletor de tema persistido + aplicação no dashboard"
      status: pending
      branch: "feature/4.3-theme-selector"
      complexity: 3
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["4.1", "4.2"]
      notes: >-
        Card "Aparência" em /dashboard com 3 swatches clicáveis (preview de cada
        tema — spec em preview/theme-selector.html). Server Action `updateTheme`
        (padrão de updateProfile, filtro auth.uid()) persiste profiles.theme.
        ThemeProvider client-side aplica classe no <html> instantaneamente (sem
        reload). Fallback 'light' se valor inválido (defense-in-depth além do
        CHECK). Testes: unit (validação) + integração (update reflete ao
        recarregar). Toca dashboard → paralela à 4.4 (que toca a pública).

    - id: "4.4"
      file: "4.4.story.md"
      title: "Aplicação consistente de tema na página pública + a11y WCAG AA"
      status: pending
      branch: "feature/4.4-theme-public-a11y"
      complexity: 3
      executor: "@dev"
      quality_gate: "@ux-design-expert"
      dependencies: ["4.1", "4.2"]
      notes: >-
        app/[username]/page.tsx lê profile.theme e injeta a classe do tema no
        root da página server-side (SSR, sem FOUC — mecanismo distinto do
        ThemeProvider client da 4.3). CSS variables resolvem sem flash. Validar
        contraste WCAG AA (>=4.5:1) nos 3 temas (axe-core manual/CI leve).
        Garantir que dashboard e pública compartilham o mesmo tema do usuário.
        Toca a pública → paralela à 4.3. Nota: se a 4.3 criar um helper de
        resolução de classe de tema reutilizável, a 4.4 consome; senão define o
        próprio apply server-side (independente).

    - id: "4.5"
      file: "4.5.story.md"
      title: "Documentação viva do design system"
      status: pending
      branch: "feature/4.5-design-system-docs"
      complexity: 2
      executor: "@dev"
      quality_gate: "@qa"
      dependencies: ["4.1", "4.2", "4.3", "4.4"]
      notes: >-
        docs/design-system.md (pt-BR): tabela de tokens, exemplo de uso de cada
        primitivo, os 3 temas (screenshots + quando usar), a11y checks rodados.
        Seção "Decisões": por que Tailwind 4 + CSS variables vs CSS Modules/
        vanilla-extract/styled-components. Link no README. Stretch (não-DoD):
        playground /dev/ui atrás de flag NEXT_PUBLIC_UI_PLAYGROUND=1. Última story
        — documenta o resultado consolidado das anteriores.

  # ──────────────────────────────────────────────────────────
  # WAVES
  # ──────────────────────────────────────────────────────────
  #
  # Estrutura de dependências:
  #   Wave 1: [4.1]        — tokens/temas (base de tudo, bloqueia o resto)
  #   Wave 2: [4.2]        — primitivos + refactor + nav (SOLO: toca todas as
  #                          páginas → evita conflito de worktree paralelo)
  #   Wave 3: [4.3, 4.4]   — tema no dashboard (client) e na pública (SSR)
  #                          arquivos distintos (dashboard vs [username]) → paralelas
  #   Wave 4: [4.5]        — documentação viva (consolida tudo)
  # ──────────────────────────────────────────────────────────

  waves:
    - number: 1
      name: "Fundação de Tokens"
      description: "Tokens e 3 temas como CSS variables em globals.css (Tailwind 4), fonte Inter — base de todo o design system"
      stories: ["4.1"]
      parallel: false
      gate_agent: "@ux-design-expert"
      gate_focus: >-
        Verificar que os tokens em globals.css batem com a referência
        (colors_and_type.css): :root light + html.theme-dark/.theme-accent
        com bg/fg/muted/border/accent/surface + status + type (Inter) + spacing
        + radii + shadows. Confirmar exposição via `@theme inline` (SEM
        tailwind.config.ts) e remoção do prefers-color-scheme. Trocar tema por
        classe no <html> altera visualmente as 3 paletas.
      merge_order: ["4.1"]
      tag: "epic-4-wave-1-tokens"

    - number: 2
      name: "Primitivos & Navegação"
      description: "Primitivos UI acessíveis + refactor leve das páginas + navegação coesa do dashboard — requer Wave 1"
      stories: ["4.2"]
      parallel: false
      gate_agent: "@ux-design-expert"
      gate_focus: >-
        Verificar que Button/Input/Textarea/Card/Avatar/Label/Toast existem em
        components/ui/ com variants/sizes/estados conforme preview/*.html, cada
        um com teste unitário, aria-invalid nos inputs com erro, fallback de
        iniciais no Avatar e Toast com role correto. Confirmar que páginas de
        auth/dashboard usam os primitivos e que a navegação liga dashboard ↔
        links ↔ perfil (feature alcançável — débito da retro Epic 3 fechado).
      merge_order: ["4.2"]
      tag: "epic-4-wave-2-primitives"

    - number: 3
      name: "Temas Aplicados"
      description: "Seletor de tema + aplicação no dashboard (client) e na página pública (SSR) + a11y — requer Wave 2"
      stories: ["4.3", "4.4"]
      parallel: true
      gate_agent: "@ux-design-expert"
      gate_focus: >-
        Verificar que o seletor (3 swatches) persiste profiles.theme via
        updateTheme (auth.uid()) e aplica instantaneamente no dashboard (sem
        reload), que a página pública /[username] injeta a classe do tema no SSR
        (sem FOUC) lendo profile.theme, que dashboard e pública mostram o MESMO
        tema do usuário, e que o contraste WCAG AA (>=4.5:1) passa nos 3 temas.
        Fallback 'light' para valor inválido.
      merge_order: ["4.3", "4.4"]
      tag: "epic-4-wave-3-themes-applied"

    - number: 4
      name: "Documentação"
      description: "Documentação viva do design system (tokens, primitivos, temas, a11y) — requer Waves 1-3"
      stories: ["4.5"]
      parallel: false
      gate_agent: "@qa"
      gate_focus: >-
        Verificar que docs/design-system.md documenta tokens (tabela),
        primitivos (uso), 3 temas (screenshots + quando usar) e a11y checks, com
        seção de decisões (Tailwind 4 + CSS variables) e link no README.
      merge_order: ["4.5"]
      tag: "epic-4-wave-4-docs"

  # ──────────────────────────────────────────────────────────
  # FINAL GATE
  # ──────────────────────────────────────────────────────────
  final_gate:
    agent: "@ux-design-expert"
    focus: >-
      Sign-off final do Epic 4 — Design System & Temas. Verificar:
      1. Tokens em globals.css (Tailwind 4, @theme inline) cobrindo os 3 temas;
         Inter aplicada; sem prefers-color-scheme
      2. Primitivos (Button/Input/Textarea/Card/Avatar/Label/Toast) acessíveis,
         testados, e usados nas páginas de auth/dashboard
      3. Navegação coesa: dashboard ↔ links ↔ perfil (nenhuma feature órfã)
      4. Seletor de tema persiste em profiles.theme e aplica no dashboard
         (client, sem reload) e na página pública (SSR, sem FOUC)
      5. Contraste WCAG AA (>=4.5:1) validado nos 3 temas
      6. Nenhuma regressão funcional (auth, links, página pública seguem OK)
      7. CI verde em main; pnpm lint + typecheck + test + build passando
      8. Conventional commits em todos os PRs do epic; sem migration nova
    tag: "epic-4-complete"

  # ──────────────────────────────────────────────────────────
  # RETROSPECTIVE
  # ──────────────────────────────────────────────────────────
  retrospective:
    enabled: true
    agent: "@sm"
    focus: >-
      O que funcionou no Epic 4 (formalizar design system a partir de referência
      existente)? A referência reduziu invenção? Waves com story solo (4.2)
      evitaram conflito de worktree? Registrar em docs/retrospectives/epic-4.md.

