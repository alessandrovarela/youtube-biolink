        fail-open. Efeito: mesma perda silenciosa de cliques, rate limiting
        temporariamente inativo. Auth e navegação: intactos.
      Em AMBAS as ordens a única vítima é o tracking, e com prod em 0 cliques o
      impacto real é nulo. Esta é a issue #3 do gate da Wave 2, que permanece
      aberta — mas este gate a MEDE e a reclassifica de risco para não-evento.

  - id: 10
    topic: "Interação entre camadas (rate limiting × RLS × middleware)"
    result: PASS
    findings:
      middleware_nao_consome_rate_limit: >-
        HIPÓTESE TESTADA E REFUTADA. O middleware não importa lib/rate-limit
        (verificado no arquivo) e o refresh de token fala com o GoTrue, não com
        o PostgREST — não passa por check_app_rate_limit. Além disso, o matcher
        é /dashboard/:path*, enquanto os buckets de auth são consumidos em
        /login, /signup e /reset-password, fora do matcher. NÃO há caminho pelo
        qual o refresh do middleware gaste o balde de login do usuário.
      rls_x_rate_limit: >-
        A tabela rate_limit_counters tem RLS ligada SEM policy e sem grants —
        ou seja, ela só é acessível pelo owner via SECURITY DEFINER. Este é o
        acoplamento mais frágil do epic: se o owner das funções não tivesse
        BYPASSRLS, TODA escrita de contador falharia, o `exception when others`
        engoliria, e o rate limiting inteiro ficaria SILENCIOSAMENTE DESLIGADO
        com todos os sinais verdes. Verifiquei empiricamente em dev que não é o
        caso (os 4 buckets contam corretamente). Em prod, as migrations são
        aplicadas pelo mesmo papel (`supabase db push` como postgres), então o
        resultado deve ser idêntico — mas isso é uma PREDIÇÃO, não uma
        observação. Ver merge_preconditions PRE-M7 (verificação pós-deploy).
      rls_x_middleware: >-
        O middleware roda getUser() com a anon key e cookies; a role resultante
        no PostgREST é `authenticated`, que é a role que todas as policies de
        escrita usam. Sem conflito. A view link_click_daily com
        security_invoker exige SELECT na tabela BASE para `authenticated` —
        preservado de propósito na migration de hardening (revogado só de anon).
        Se isso tivesse sido revogado por simetria, o analytics quebraria: é o
        tipo de acoplamento que só aparece olhando as três camadas juntas, e
        está corretamente resolvido.
      csp_x_supabase: >-
        connect-src é montado com NEXT_PUBLIC_SUPABASE_URL lido em
        next.config.ts, ou seja EM TEMPO DE BUILD. Se o env estiver ausente no
        BUILD (mesmo que presente em runtime), a CSP sai com connect-src
        'self' apenas e TODA chamada do browser ao Supabase é bloqueada — login
        pelo browser quebra com erro de CSP no console e nenhum erro de
        servidor. É uma dependência de build NOVA, criada por este epic, que
        não existia antes. Ver merge_preconditions PRE-M4.
      server_action_sob_middleware: >-
        Server Actions do dashboard são POSTs para /dashboard/* e portanto
        ATRAVESSAM o middleware, que roda getUser() antes de cada uma. Efeito:
        um round-trip extra ao GoTrue por action. Não é bug e não consome rate
        limit, mas é custo de latência e de invocação edge que ninguém
        contabilizou. Registrado como issue #4 (low).

